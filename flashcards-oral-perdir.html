rofil d’études grâce au choix des enseignements de spécialité.\n\n- A la fin de la seconde, les élèves qui se dirigent vers la voie générale choisissent trois enseignements de spécialité qu’ils suivront en première (4h hebdomadaires par spécialité)\n\n- A la fin de l’année de première, ils choisissent, parmi ces trois enseignements, les deux enseignements de spécialité qu’ils poursuivront en classe de terminale (6h hebdomadaires par spécialité)\n\n- contrôle continu avec les épreuves communes\n\n- Il n’y a pas d’enseignement d’exploration mais des enseignements de spécialité  ou des des options :\n\n- Les lycées proposeront des enseignements de spécialité parmi les suivants:\n\n  - Mathématiques\n\n  - Physique-chimie\n\n  - Sciences de la Vie et de la Terre\n\n  - Sciences économiques et sociales\n\n  - Histoire géographie, géopolitique et sciences politiques\n\n  - Humanités, littérature et philosophie\n\n  - Langues, littératures et cultures étrangères et régionales\n\n  - Numérique et sciences informatiques\n\n  - Sciences de l’ingénieur\n\n  - Littérature, langues et cultures de l’Antiquité\n\n  - Arts (arts plastiques ou arts du cirque ou musique ou théâtre ou cinéma-audiovisuel ou danse ou histoire des arts)\n\n  - Biologie écologie (dans les lycées agricoles uniquement)\n\n**Voie techno : L’organisation en séries est maintenue**\n\n**Dès la fin de la seconde, les élèves optant pour la voie technologique se dirigent vers une série, qui déterminera leurs enseignements de spécialité :**\n\nST2S : Sciences et technologies de la santé et du social\n\nSTL : Sciences et technologies de laboratoire\n\nSTD2A : Sciences et technologies du design et des arts appliqués\n\nSTI2D : Sciences et technologies de l’industrie et du développement durable\n\nSTMG : Sciences et technologies du management et de la gestion\n\nSTHR : Sciences et technologies de l’hôtellerie et de la restauration\n\nS2TMD : Sciences et techniques du théâtre, de la musique et de la danse\n\nSTAV : Sciences et technologies de l’agronomie et du vivant (dans les lycées agricoles uniquement)"], [135, "Un bachelier technologique peut-il s’inscrire en CPGE ?", "Oui, un élève en voie technologique peut postuler en CPGE; à partir de la voie STMG, les élèves ont toute légitimité pour postuler en classe prépa ECT (économique et commerciale voie technologique) et en classe prépa DCG (diplôme de comptabilité et de gestion)."], [136, "Dans le cadre du continuum bac-3/bac+3. Comment faites-vous pour développer l'ambition des élèves pour l'enseignement ? Quels leviers ?", "**Rappel :**\n\nLa notion de continuum Bac – 3/Bac + 3, instauré par la Loi du 22 juillet 2013 relative à l'enseignement supérieur a pour objectifs d’assurer par un ensemble d’initiatives la continuité des enseignements entre le secondaire et le supérieur, et d’affirmer la notion de spécialisation progressive des études dans le supérieur. Il s’agit donc notamment d’améliorer le processus d’orientation, de rendre les parcours plus fluides et mieux articulés, de préparer et d’accompagner les jeunes dans leur choix et leurs projets afin de favoriser leur réussite\n\nLeviers : cordées de la réussite, renforcement des liens avec enseignement >, Leviers dans le cadre du continuum : les cordées de la réussite, l’orientation active (période d’immersion des lycéens dans des structures d’enseignement supérieur), l’invitation d’étudiants lors des forums des métiers et des formations organisées avec l’aide des chargés de mission orientation à la Région, sollicitation des campus des métiers et des qualifications d’excellence pour venir présenter des filières d’avenir aux lycéens, Erasmus+ pour inciter les lycéens effectuer des immersions à l’étranger (y compris PFMP) et ainsi leur ouvrir des horizons nouveaux.\n\n=> réforme = obligation encore plus importante d’accompagner les lycées. Le Lycée = trait d’union ; construire un passage sécurisé.\n\n**Parcours Sup =** enjeu, c’est un outil mais le réel enjeu c’est la construction de son projet. Il faut éviter de considérer que c’est APB amélioré. Parcours sup incarne le continium = c’est une passerelle, il faut l’emprunter, c’est un processus de réflexion que l’on construit.\n\n**Point positif =** l’enseignement sup = meilleur idée de qui vient, permet de faire évoluer l’approche en première année.\n\n**Fiche Avenir =** devenir un vrai outil de dialogue, serait intéressant de préciser que tel élève a besoin d’outils"], [138, "Pourquoi faire des arts plastiques en lycée professionnel?", "En effet, dans de nombreuses filières, il est important de savoir lier le geste artistique au geste professionnel : métiers d'art comme la maroquinerie ou la ferronnerie, menuiserie, carrosserie...\n\nEt en outre, le prof d'art appliqué saura éveiller les élèves à la culture artistique.\n\nAjout exemple : campus : patrimoine, métiers d’art et tourisme, hotellerie. // lieu totem\n\n\\+ cpmtces transversales"], [139, "Quel axe projet d'établissement développeriez-vous en priorité dans un collège classé REP +?", "**Axes :**\n\n- **Garantir l’acquisition du « Lire, écrire, parler » et enseigner plus explicitement les compétences que l’école requiert pour assurer la maîtrise du socle commun**\n\n- Conforter une école bienveillante et exigeante\n\n- Mettre en place une école qui coopère utilement avec les parents et les partenaires pour la réussite scolaire\n\n- Favoriser le travail collectif de l’équipe éducative\n\n- Accueillir, accompagner, soutenir et former les personnels\n\n- Renforcer le pilotage et l’animation des réseaux"], [140, "Qui compose une équipe de direction? Le CPE fait-il partie de l'équipe de direction?", "Principal, Principal adjoint, adjoint gestionnaire, secrétaire + CPE même s’il n’est pas de par son statut un personnel de direction."], [141, "Quels sont les différents parcours pour l'élève au collège? Expliquez...", "**Le parcours Avenir**\n\nDe la 6è à la Terminale, le parcours Avenir permet à chaque élève de construire progressivement son orientation et de découvrir le monde économique et professionnel. Pour accompagner les équipes dans sa mise en place, éduscol propose un ensemble de fiches disciplinaires et interdisciplinaires qui couvrent le collège et le lycée.\n\n**Le parcours d'éducation artistique et culturelle**\n\nDe l'école au lycée, le parcours d'éducation artistique et culturelle a pour ambition de favoriser l'égal accès de tous les élèves à l'art à travers l'acquisition d'une culture artistique personnelle. Des objectifs de formation et les repères de progression à la mise en œuvre de ce parcours sont fixés. Un guide présente les principes et l'organisation du parcours pour un élève.\n\n**Le parcours éducatif de santé**\n\nDe la maternelle au lycée, le parcours éducatif de santé permet de structurer la présentation des dispositifs qui concernent à la fois la protection de la santé des élèves, les activités éducatives liées à la prévention des conduites à risques et les activités pédagogiques mises en place dans les enseignements en référence aux programmes scolaires.\n\n**Le parcours citoyen de l'élève**\n\nDe l'école au lycée, le parcours citoyen vise à la construction, par l'élève, d'un jugement moral et civique, à l'acquisition d'un esprit critique et d'une culture de l'engagement. Il fait l'objet d'une circulaire, publiée le 23 juin 2016, qui en précise les grands objectifs ainsi que les modalités de pilotage et de mise en œuvre."], [142, "\"les élèves ne comprennent pas les consignes\", cette phrase renvient souvent chez les profs, que faites-vous?", "- Conseil pédago avec atelier thématique\n\n- travail avec le coordo devoirs faits\n\n- mobilisation des corps d’inspection\n\n- FIL"], [143, "Que pensez-vous du classement des lycées ? Que pouvez-vous nous en dire ?", "- classe brut dans un souci de transparence mais qui ne reflète pas la plus-value"], [144, "Quelle différence entre une équipe éducative et une commission éducative ?", "**Équipe éducative d’une classe :** enseignants, CPE, Chef d’établissement. En cas de difficulté avec un élève, elle peut être réunie pour envisager des solutions\n\n**Commission éducative :**\n\n- La commission éducative est présidée par le chef d’établissement ou son représentant.\n\n\n\n- Elle comprend également des personnels de l'établissement (dont au moins un enseignant), et au moins un parent d'élève.\n\n- La composition de la commission éducative est fixée par le conseil d'administration. Elle est inscrite dans le règlement intérieur de l'établissement.\n\nLe chef d'établissement peut y inviter toutes les personnes qu'il juge utiles à l'examen du dossier (délégués de classe, conseiller principal d'éducation, etc.).\n\nLa commission examine la situation d'un élève qui ne respecte pas ses obligations scolaires ou qui a un comportement inadapté.\n\n**La commission ne sanctionne pas le comportement de l'élève. Elle recherche une solution éducative adaptée et personnalisée à la situation, comme par exemple la mise en place d'une mesure de responsabilisation.** Elle cherche ainsi à amener l'élève à s'interroger sur sa conduite et sur les conséquences de ses actes."], [145, "Que pensez-vous des systèmes éducatifs étrangers? Quels systèmes étrangers vous inspirent le plus et pourquoi?", "3 systèmes qui me \"tentent\" :\n\n- Estonie (excellence éducative, plateforme numérique nationale qui couvre le continuum de formation, autonomie et auto-évaluation des étab)\n\n- Finlande (30% des élèves ont une aide spécialisée pdt leurs années d'étude, aucune éval en début de scolarité, tous les élèves dans les mêmes classes, 1h15 de récré par jour, classes de sciences à 16, 2h de formation par semaine pour les enseignants, recrutement des meilleurs professeurs, pédagogies actives et empowerment des élèves)\n\n- Canada (semestrialisation, parcours des élèves personnalisés avec choix des enseignements, approches pédagogiques plus participatives et explicites, l'empowerment à l'américaine avec rituels par ex)\n\nUn point commun de ces systèmes : ils sont tous très bien classés au Test PISA, comme c'est bizarre.\n\nEt du coup la question qui vient ensuite c'est : Pourquoi par la Chine ou Singapour qui sont encore mieux classés ?\n\nLa chine est un système très inégalitaire entre les zones urbaines et rurales. la scolarité obligatoire ( 6-15 ans) est finalement assez similaire à Singapour par sa rigueur et la part importante des sciences dans les apprentissages."], [146, "Vous êtes proviseur adjoint en lycée, le proviseur, en conseil pédagogique, veut « remplir » 2 classes de 1STI2D avec les classes de seconde. Que faites-vous ?", "**-Les professeurs de seconde viennent dans votre bureau pour s’insurger de cette politique des quotas. Que faites-vous ?**\n\n Le CP a été préparé en amont et je suis donc censé être au courant de cette volonté et j’ai au préalable dialogué avec le chef afin de lui expliquer mon point de vue et insisté sur le fait que ce n’est dans l’intérêt de personne de chercher à « remplir » des classes. Les élèves doivent bénéficier d’une orientation choisie et non forcée, cela remet en question leur réussite mais aussi le climat de ces classes car des élèves orientés « par défaut » ne se retrouveront pas dans ce cursus et cela va sûrement engendrer des débordements donc: problèmes de discipline, des enseignants pas heureux et des élèves en souffrance.\n\nSi en CP il parle de cette volonté, je ne dis rien, je suis loyal et je ne dois pas montrer mon désaccord en « public ».\n\nSi les enseignants viennent me voir dans mon bureau, je les écoute, je leur explique qu’aucune décision n’a été prise, que l’on ne parle ici que d’une volonté et que je vais en discuter avec le chef pour lui faire part des remarques des enseignants. »"], [147, "PPCR: Est-ce que pour remplir les items d’un PPCR le CE doit assister à un cours ?", "**-Dans les items à remplir par le PERDIR y en a -t-il d’ordre pédagogique ?**\n\nNon, mais généralement, il est fréquent qu’il soit associé à ce temps d’observation. Oui : « contribuer à l’action de la communauté éducative et coopérer avec les parents d’élèves et les partenaires de l’établissement » + « accompagner les élèves dans leur parcours de formation » +\n\nPPCR: pour remplir les items le CE n’a pas besoin d’assister à un cours mais le rendez-vous de carrière est l’occasion pour le CE de rentrer en classe et d’assister au cours en même temps que l’inspecteur (avec l’accord de l’enseignant); cela permet au CE de se faire une meilleure idée du fonctionnement de l’enseignant et le climat de la classe. Le CE a 3 compétences à évaluer seul : coopérer au sein d’une équipe, contribuer à l’action de la communauté éducative (dont la coopération avec les parents et les partenaires) et installer un climat propice aux apprentissages. L’IA-IPR va évaluer les compétences liées à la pédagogie et la didactique (pas le CE). Ensemble, CE et IA-IPR vont co-évaluer 3 compétences : agir en éducateur responsable, accompagner les élèves dans leur parcours de formation et s’engager dans son développement professionnel. À l’issue de la discussion entre l’Enseignant et l’IA-IPR, je demanderai un temps de discussion avec l’IA-IPR pour la co-évaluation avant un entretien bilan entre les 3 parties; l’enjeu est que ce RDV soit au maximum un moment de valorisation qui ouvre des perspectives."], [148, "Est-ce que vous réunissez , en tant que CE, une équipe de suivi pour une dyslexie ?", "C’est envisageable."], [149, "Un PAP peut-il générer la présence d’une AESH ?", "Non, un Projet d'Accueil Personnalisé (PAP) ne génère pas automatiquement la présence d'une Accompagnante des Élèves en Situation de Handicap (AESH).\n\n- **PAP vs PPS** : Le PAP est destiné à des élèves ayant des difficultés scolaires sans handicap reconnu. Il vise à adapter l'enseignement pour répondre aux besoins spécifiques de l’élève. En revanche, le **Projet Personnalisé de Scolarisation (PPS)** est destiné aux élèves en situation de handicap et peut inclure la présence d'une AESH pour accompagner l'élève en fonction des besoins définis dans le PPS.\n\n- **Préconisations** : Les préconisations du PAP s’adressent principalement aux enseignants et à l’équipe éducative. Elles visent à définir des adaptations pédagogiques pour favoriser l'inclusion et la réussite de l’élève dans le cadre de la classe ordinaire."], [150, "Trois enseignants refusent de mettre en place ces préconisations, que faîtes-vous ?", "En cas de refus de la part des enseignants de mettre en œuvre les préconisations du PAP, voici les étapes à suivre :\n\n- **Rappel du Référentiel** : Il est important de rappeler aux enseignants le cadre légal et pédagogique qui encadre ces préconisations. Le référentiel de l'inclusion scolaire précise l'obligation de mise en œuvre des adaptations nécessaires pour les élèves en difficulté.\n\n- **Loi du 11 Février 2005** : Cette loi, qui promeut l’égalité des droits et des chances, impose une obligation d’adaptation des pratiques pédagogiques pour répondre aux besoins de tous les élèves, y compris ceux en difficulté. Une discussion constructive sur les enjeux de l’inclusion scolaire et les impacts sur les élèves concernés peut aussi être engagée."], [151, "Des programmes trop chargés et pas formé pour cela vous dit un enseignant, que faîtes-vous ?", "Face à des préoccupations concernant des programmes trop chargés et un manque de formation, il convient de :\n\n- **Analyser les Besoins en Formation** : Il est essentiel de proposer des formations adaptées aux enseignants sur les pratiques inclusives et sur la gestion de classes hétérogènes. Cela peut être organisé en concertation avec l'administration de l'établissement.\n\n- **Soutien et Accompagnement** : Mettre en place des sessions d'accompagnement ou de formation continue sur la différenciation pédagogique et l'inclusion.\n\n- **Réflexion sur le Contenu des Programmes** : En tant que chef d'établissement ou coordinateur, il est aussi pertinent de remonter ces préoccupations aux instances supérieures (Inspection académique, Rectorat) pour envisager une réflexion collective sur le contenu des programmes et leur adaptation à la réalité des classes."], [152, "Réformes des 15 Dernières Années", "Les réformes éducatives de ces quinze dernières années ont été menées pour plusieurs raisons :\n\n- **Continuité Bac -3/Bac +3** : L'objectif est d'assurer une continuité dans le parcours éducatif des élèves, facilitant ainsi leur insertion dans l'enseignement supérieur et le monde professionnel.\n\n- **Lutte contre les Inégalités Sociales et Territoriales** : Les réformes visent à réduire les inégalités d'accès à l'éducation, en mettant l'accent sur des dispositifs comme l'éducation prioritaire et les réseaux d'éducation prioritaire renforcée (REP+).\n\n- **Inclusion Scolaire** : Promouvoir l'inclusion des élèves en situation de handicap et des élèves en difficulté, afin de garantir un droit à l'éducation pour tous."], [153, "Quelle est la différence entre équité et l’égalité?", "Égalité : la même chose pour tout le monde.\n\nÉquité : en fonction des besoins de chacun."], [154, "Comment mettre en place l’évaluation par compétences?", "Réflexion commune (conseil pédagogique) pour faire ressortir les réticences et les besoins de formation. Refonte du projet d'établissement. Formation de type FIL. Rencontre avec parents pour expliquer la démarche.\n\n\\+ Sollicitation IEN et écoles du secteur qui évaluent souvent déjà par compétence."], [155, "Qu’est-ce qu’un bon chef d’établissement ? Quelqu’un dans son bureau ou sur le terrain ?", "Les deux. Le terrain c’est à la fois le bureau, la cours, l’entrée, la salle des profs, la restauration, l’environnement et les réseaux dans lesquels s’inscrit l’établissement."], [156, "Vous êtes principal, une dispute éclate entre 2 agents en cuisine, que faîtes-vous ?.L’agent vous répond que vous n’êtes pas son chef. Vous avez 2 personnes en moins (arrêt) à la cantine. Que faîtes-vous ?", "Rappel : principe de l’autorité fonctionnelle, convocation dans le bureau en lien avec l’adjoint gestionnaire, écoute et invitation à apaiser les tensions.\n\n// appel auprès de la RH de la collectivité."], [157, "Quand vous parlez, vous dites: « Mon établissement », « mes enseignants », « mes élèves » ?", "Ce ne sont pas les « miens ». Nous ne sommes que de passage.\n\n> **158. Installation du PIAL dans l'établissement**\n\nLe PIAL est généralement installé dans un établissement scolaire pour coordonner l'accompagnement des élèves en situation de handicap. Dans le cadre d'un établissement de formation (FF), cela peut inclure la mise en place de :\n\n- **Équipe pluridisciplinaire** : regroupement de professionnels (AESH, enseignants, psychologues, etc.) pour définir des projets personnalisés.\n\n- **Partenariats locaux** : collaboration avec des acteurs éducatifs et sociaux pour une prise en charge globale.\n\n- **Formations** : des formations spécifiques pour les AESH et le personnel éducatif sont souvent proposées pour leur permettre de mieux comprendre et répondre aux besoins des élèves."], [159, "Attirer des gens au PIAL", "Pour attirer des professionnels dans un PIAL, il serait judicieux de :\n\n- **Valoriser les missions** : mettre en avant l'impact positif de l'accompagnement des élèves en situation de handicap.\n\n- **Proposer des formations continues** : offrir des opportunités de développement professionnel pour renforcer les compétences.\n\n- **Créer un environnement de travail collaboratif** : favoriser l'échange d'expériences entre les membres de l'équipe et la reconnaissance des bonnes pratiques.\n\n- **Sensibiliser à la philosophie de l’inclusion** : communiquer sur l’importance de l’inclusion scolaire et de la mixité sociale."], [160, "Volume d'heures de formation pour les AESH ?", "Les Accompagnants d'Élèves en Situation de Handicap (AESH) bénéficient en général de **60 heures de formation** initiale et continue. Cela inclut des sessions sur les besoins spécifiques des élèves, les outils d’accompagnement, et les stratégies d’inclusion."], [161, "Dispositif de l'inclusion scolaire ?", "L’inclusion scolaire vise à permettre à tous les élèves, y compris ceux en situation de handicap, d’accéder à l’éducation dans des conditions équitables. Le dernier texte important sur l’inclusion scolaire est la **loi n° 2019-791** du 26 juillet 2019 pour une école de la confiance, qui a introduit de nouvelles dispositions. Sa philosophie repose sur :\n\n- **L’accessibilité** : garantir l’accès à l’éducation pour tous.\n\n- **La personnalisation des parcours** : adapter l’enseignement aux besoins de chaque élève.\n\n- **La valorisation de la diversité** : favoriser l'acceptation et le respect des différences."], [162, "Rôle de la CARDIE", "La **CARDIE** (Cellule Académique pour la Recherche et le Développement de l’Innovation Éducative) a pour rôle d’accompagner les établissements scolaires dans leurs projets d’innovation et d’inclusion. Elle est chargée de :\n\n- **Évaluer et accompagner des projets** : soutenir des initiatives innovantes.\n\n- **Former les équipes** : proposer des formations adaptées.\n\n- **Favoriser le partage d’expériences** : diffuser les bonnes pratiques au sein des établissements."], [163, "Rôle de la direction sur le travail par compétences", "La direction joue un rôle crucial dans le travail par compétences en :\n\n- **Établissant une vision claire** : définir les objectifs et les attentes en matière de compétences.\n\n- **Mobilisant les ressources** : fournir les outils et formations nécessaires pour que les enseignants puissent mettre en œuvre cette approche.\n\n- **Encourageant l’évaluation** : instaurer des méthodes d’évaluation adaptées pour suivre les progrès des élèves."], [164, "Envie ou nécessité de mixité sociale dans l'établissement", "Pour promouvoir la mixité sociale dans un établissement, il est possible de :\n\n- **Développer des partenariats** : collaborer avec des associations locales et des structures éducatives pour favoriser l’accès de tous les élèves.\n\n- **Organiser des activités communes** : mettre en place des projets ou événements qui réunissent tous les élèves, favorisant les échanges.\n\n- **Adapter l’offre éducative** : veiller à proposer un enseignement qui prenne en compte la diversité des élèves et valorise leurs différences."], [165, "Texte récent sur le pilotage et la direction", "la [loi n° 2013-595 du 8 juillet 2013](https://www.legifrance.gouv.fr/loda/id/JORFTEXT000027677984/) d'orientation et de programmation pour la refondation de l'École de la République qui renforce la place du numérique à l'école en créant un service public du numérique éducatif, modifie le nombre et la durée des cycles scolaires et instaure le conseil école-collège, favorise le déploiement des parcours éducatifs, renforce le rôle de la collectivité territoriale de rattachement avec la mise en place possible des contrats d'objectifs tripartites ;\n\nla [loi n° 2019-791 du 26 juillet 2019](https://www.legifrance.gouv.fr/loda/id/JORFTEXT000038829065/) Pour une École de la confiance qui pose les bases d'un service public de l'École inclusive et engage une transformation profonde de l'accompagnement des élèves en situation de handicap, renforce la place de l'évaluation à tous les échelons du système éducatif et crée pour cela le Conseil d'évaluation de l'École chargé de la mise en cohérence des évaluations de l'enseignement scolaire et de la mise en place de l'évaluation des EPLE à l'échelle nationale.\n\n Les personnels de direction qui exercent en EPLE sont régis par le [décret n° 2001-1174 du 11 décembre 2001](https://www.legifrance.gouv.fr/loda/id/JORFTEXT000000587727/) modifié portant statut particulier du corps des personnels de direction d'établissement d'enseignement ou de formation relevant du ministre de l'Éducation nationale dont les dispositions précisent leurs modalités de nomination, d'avancement, d'évaluation et de mutation. Les missions des personnels de direction demeurent quant à elles toujours précisées par le référentiel annexé au [Protocole d'accord relatif aux personnels de direction](https://www.education.gouv.fr/bo/2002/special1/texte.htm#page7) du 16 novembre 2000 (annexe 1 : référentiel des personnels de direction)."], [166, "Lien SEGPA - Lycée professionnel : comment fonctionne une SEGPA (Section d’enseignement général et professionnel adapté) ? Comment intégré les élèves de SEGPA avec les autres élèves ? Des propositions ?", "La transition entre les SEGPA (Sections d’Enseignement Général et Professionnel Adapté) et les lycées professionnels se fait généralement par le biais de l’**orientation des élèves**. Le texte régissant cette articulation est la **loi n° 2018-166** du 23 mars 2018, qui renforce l’égalité des chances et propose un parcours adapté pour chaque élève.\n\nUne classe Segpa: Section d'enseignement général et professionnel adapté accueille les jeunes de la 6e à la 3e présentant des difficultés scolaires importantes. Il s'agit de difficultés ne pouvant pas être résolues par des actions d'aide scolaire et de soutien. La classe est intégrée dans un collège. Elle regroupe un petit groupe d'élèves (16 maximum) pour individualiser le parcours de chacun. La Segpa doit permettre à votre enfant d'accéder à une formation professionnelle diplômante ou à la poursuite de ses études après la 3e. La Segpa permet à votre enfant de suivre des enseignements adaptés à ses difficultés. Il bénéficie d'un suivi individualisé. Les élèves suivent les mêmes programmes d'enseignement que leurs camarades de section générale, mais avec des adaptations et des aménagements. Les enseignements généraux sont assurés par des professeurs des écoles, de collège ou de lycée. Des professeurs de lycée professionnel sont chargés de l'enseignement professionnel.\n\nPendant sa scolarité, votre enfant effectue des [stages en entreprise](https://www.service-public.fr/particuliers/vosdroits/F1882) (en 4e et en 3e).La formation doit lui permettre d'acquérir le [socle commun de connaissances et de compétences](http://www.education.gouv.fr/cid2770/le-socle-commun-de-connaissances-et-de-competences.html) et de se présenter en fin de collège au [diplôme national du brevet (DNB)](https://www.service-public.fr/particuliers/vosdroits/F10005). En fin d'année de 3e, votre enfant passe le [certificat de formation générale (CFG)](http://www.education.gouv.fr/cid2619/le-diplome-national-du-brevet.html) ou le [diplôme national du brevet (DNB)](http://www.education.gouv.fr/cid2619/le-diplome-national-du-brevet.html).\n\nAprès le collège, votre enfant doit pouvoir accéder à une formation, au minimum du niveau d'un [certificat d'aptitude professionnelle (CAP)](http://www.education.gouv.fr/cid2555/le-certificat-d-aptitude-professionnelle-cap.html).\n\nIl peut ainsi poursuivre sa formation en [lycée professionnel](https://www.service-public.fr/particuliers/vosdroits/F20395) ou en [centre de formation d'apprentis (CFA)](https://www.service-public.fr/particuliers/vosdroits/N11240).\n\nPour intégrer les SEGPA, intégration structurelle, inclure les élèves dans les portes ouvertes et les accueils de CM2, mettre en avant les élèves en fonction des ateliers de SEGPA"], [167, "Travail pour les EREA (Établissements Régionaux d’Enseignement Adapté)", "Pour les élèves des SEGPA et des EREA, le travail se concentre sur :\n\n- **Des parcours individualisés** : chaque élève bénéficie d’un suivi personnalisé qui prend en compte ses capacités et ses besoins.\n\n- **Des projets de réinsertion** : mettre en place des stages et des formations en alternance pour favoriser l’insertion professionnelle."], [168, "Parcours Avenir", "Le parcours Avenir est un dispositif qui a pour but de :\n\n- **Accompagner les élèves dans leur orientation** : fournir des outils et des informations sur les métiers et les formations.\n\n- **Favoriser la découverte des métiers** : organiser des visites d’entreprises, des stages, et des rencontres avec des professionnels."], [169, "Le parcours Avenir est-il exclusivement consacré à la découverte des sections professionnelles ?", "Non, le parcours Avenir ne se limite pas à la découverte des sections professionnelles. Il englobe également :\n\n- **L’information sur les formations générales** : les élèves peuvent explorer divers chemins, y compris les filières générales et technologiques.\n\n- **La sensibilisation aux compétences transversales** : développement des compétences nécessaires pour réussir dans le monde professionnel."], [172, "Chiffres sur les choix de médecine et spécialités", "En France, le choix des études de médecine est influencé par plusieurs facteurs. En 2021, près de **50% des étudiants** en santé choisissent la filière médecine. Les spécialités couramment choisies pour y accéder incluent :\n\n- **SVT (Sciences de la Vie et de la Terre)** : souvent privilégiée pour la filière médecine.\n\n- **Mathématiques** : certaines formations peuvent également exiger des bases solides en mathématiques.\n\n45000 élèves en PASS ou LAS"], [173, "Taxe d'apprentissage", "La taxe d'apprentissage est un impôt que les entreprises versent pour financer l'apprentissage. Le pourcentage reversé par les entreprises est **0,68%** de la masse salariale pour les entreprises de 11 salariés ou plus. Pour connaître le montant de la taxe d'apprentissage dans un lycée professionnel spécifique, il est nécessaire de consulter le service comptable de l’établissement."], [174, "Co-intervention en cas de problèmes relationnels entre professeurs", "Pour mettre en place la co-intervention, il serait important de :\n\n- **Organiser des réunions de médiation** : permettre aux professeurs de discuter de leurs préoccupations et de trouver des solutions ensemble.\n\n- **Clarifier les rôles** : établir des objectifs communs pour la co-intervention et définir le cadre de collaboration."], [175, "Quand ils ne souhaitent pas travailler ensemble", "Si les enseignants persistent à ne pas travailler ensemble, il serait pertinent de :\n\n- **Renforcer la communication** : discuter individuellement avec chaque professeur pour comprendre les obstacles et proposer des solutions.\n\n- **Encourager une démarche collaborative** : valoriser les bénéfices de la co-intervention pour les élèves."], [176, "Qu'est-ce que la DHG ?", "La **DHG (Dotation Horaire Globale)** est un outil de gestion des ressources humaines et pédagogiques dans les établissements. Elle détermine le nombre d’heures d’enseignement alloué à un établissement pour une année scolaire."], [177, "Outil de gestion des ressources humaines", "Oui, la DHG est un outil de gestion des ressources humaines, car elle impacte la répartition des enseignants, les classes, et l’organisation des emplois du temps."], [178, "Outil pédagogique par excellence dans un EPLE", "L'outil pédagogique par excellence dans un Établissement Public Local d’Enseignement (EPLE) est le **projet d’établissement**, qui définit les priorités éducatives et les objectifs à atteindre. En tant que chef d'établissement, un autre outil dont vous disposez est le **contrat d’objectifs**, qui aide à formaliser les engagements pédagogiques et organisationnels."], [179, "Changement concernant la commission permanente vs CA", "Le changement concernant la commission permanente et le conseil d’administration (CA) implique souvent une évolution dans la répartition des rôles. La commission permanente peut s'occuper de certaines décisions pratiques afin d’alléger les débats du CA, qui se concentre davantage sur les orientations stratégiques."], [183, "EDT = outil pédagogique ? RH ?", "L'emploi du temps (EDT) est à la fois un **outil pédagogique et un outil de gestion des ressources humaines**. En tant qu'outil pédagogique, il permet d'organiser les enseignements et de favoriser la réussite des élèves. Comme outil RH, il aide à gérer le temps de travail des enseignants et l’occupation des salles."], [181, "Créer un effet établissement et un bon climat scolaire", "Pour créer un **effet établissement** et un **bon climat scolaire**, il est essentiel de :\n\n- **Promouvoir une culture d’établissement positive** : valoriser les réussites collectives et individuelles à travers des événements, des récompenses et des affichages dans l’établissement.\n\n- **Encourager la communication** : organiser des temps d’échanges réguliers entre enseignants, élèves et parents pour partager des préoccupations et des succès.\n\n- **Impliquer les élèves** : créer des instances (comme un conseil d'élèves) pour qu’ils puissent s’exprimer et participer à la vie de l’établissement."], [182, "Faire coopérer les gens ensemble", "Pour faire coopérer les gens, il faut :\n\n- **Instaurer des projets communs** : définir des objectifs partagés qui nécessitent la collaboration de différents acteurs (projets pédagogiques, événements, etc.).\n\n- **Organiser des formations et des ateliers** : favoriser le travail en équipe à travers des formations où les enseignants apprennent ensemble et partagent leurs pratiques.\n\n- **Mettre en place des réunions régulières** : des rencontres inter-équipes pour discuter des avancées et des difficultés, favorisant ainsi un esprit de collaboration.\n\n**183. Composition du conseil pédagogique**\n\nLa **composition du conseil pédagogique** inclut généralement :\n\n- **Le chef d’établissement** : qui préside le conseil.\n\n- **Les enseignants** : représentants des différentes disciplines, y compris des coordonnateurs de niveaux ou de matières.\n\n- **Les représentants des parents** : bien que leur participation puisse varier d’un établissement à l’autre.\n\n- **Le personnel éducatif** : parfois inclus selon les spécificités de l’établissement.\n\n**Tous les coordos ?**\n\nOui, dans un conseil pédagogique, on peut s’attendre à ce que tous les **coordonnateurs de niveau ou de discipline** soient représentés, car leur rôle est crucial dans la mise en œuvre des projets pédagogiques."], [184, "Dégager des heures pour des projets en tant que principale", "Concrètement, pour dégager des heures pour des projets, une principale peut :\n\n- **Réorganiser les emplois du temps** : ajuster certaines heures d’enseignement pour libérer du temps pour des projets spécifiques.\n\n- **Prioriser des heures de concertation** : allouer des créneaux dédiés à la réflexion collective sur des projets.\n\n- **Utiliser des heures de décharge** : si le budget le permet, faire appel à des remplacements pour libérer des enseignants pour des projets."], [185, "Heures bloquées dans les EDT", "Bloquer des heures dans les EDT ne signifie pas que les enseignants travaillent **bénévolement**. Ces heures sont souvent intégrées dans le cadre des projets éducatifs ou des équipes de travail, rémunérées selon les dispositions en vigueur."], [186, "Financement des projets", "**1. Financements publics**\n\n**a) Dotations de l’État**\n\n- **Budget des EPLE :** Les établissements publics locaux d'enseignement (EPLE) reçoivent une dotation globale annuelle pour financer leurs projets éducatifs, pédagogiques ou d’infrastructures.\n\n- **Appels à projets ministériels :** Le ministère de l'Éducation nationale lance régulièrement des appels à projets sur des thématiques spécifiques (innovation pédagogique, numérique, inclusion, etc.).\n\n- **Collectivités territoriales :** Régions, départements, et communes contribuent au financement des projets, notamment pour l'achat de matériel, l’entretien des infrastructures et le développement des projets éducatifs locaux.\n\n**b) Fonds européens**\n\n- **Fonds structurels européens (FSE) :** Utilisés pour des projets liés à l’inclusion, la formation ou l’innovation pédagogique.\n\n- **Erasmus+ :** Programme pour financer les projets de mobilité des élèves et des enseignants ou des partenariats éducatifs internationaux.\n\n**2. Financements privés**\n\n**a) Partenariats avec des entreprises**\n\n- **Mécénat :** Les entreprises peuvent soutenir des projets scolaires via des dons financiers, en nature ou en compétence.\n\n- **Sponsoring :** Notamment pour les projets sportifs ou technologiques, sous réserve de respecter les règles de neutralité de l’Éducation nationale.\n\n**b) Fondations et associations**\n\n- **Fondation de France, Fondation SNCF, etc. :** Proposent des subventions pour des projets éducatifs innovants, solidaires ou culturels.\n\n- **Associations éducatives :** Certaines associations spécialisées dans l'éducation peuvent soutenir financièrement ou logiquement des initiatives.\n\n**3. Financements participatifs et autonomes**\n\n**a) Actions menées par les établissements**\n\n- **Coopératives scolaires :** Collecte de fonds pour financer des activités périscolaires ou des projets culturels.\n\n- **Vente de produits ou événements (kermesses, tombolas) :** Pour collecter des fonds pour des projets spécifiques.\n\n**b) Crowdfunding**\n\n- **Plateformes spécialisées :** La Trousse à projet permet de mobiliser les parents d'élèves et la communauté locale pour financer des projets précis.\n\n**4. Aides spécifiques**\n\n**a) Dispositifs d'aide sociale**\n\n- **Caisse des écoles :** Financement d’activités pour les élèves défavorisés.\n\n- **Fonds sociaux des collèges et lycées :** Soutien financier pour permettre aux élèves en difficulté économique de participer aux projets éducatifs.\n\n**b) Programmes nationaux ou locaux**\n\n- **Contrat local d'accompagnement (CLA) :** Financements pour des projets dans des zones prioritaires.\n\n- **Cités éducatives :** Soutien aux initiatives locales dans les quartiers prioritaires."], [187, "Enveloppe d’un collège", "L’enveloppe budgétaire d’un collège peut varier, mais il est courant que le budget de fonctionnement tourne autour de **200 à 300 euros par élève** selon les établissements."], [188, "Prendre sur la marge des 3h", "Les heures dégagées peuvent effectivement être prises sur la **marge horaire** prévue pour les projets, mais cela doit être fait en conformité avec les directives académiques.\n\n**189 Gestion du numérique dans un collège réticent**\n\nPour gérer une situation où le personnel est réticent au numérique, il faut :\n\n- **Organiser des formations adaptées** : introduire des sessions de formation ciblées sur les outils numériques et leurs bénéfices pour l'enseignement.\n\n- **Fournir du matériel adéquat** : travailler à l’amélioration des équipements disponibles pour faciliter l’adoption du numérique.\n\n- **Encourager des initiatives pilotes** : démarrer avec des petits projets numériques pour montrer leur efficacité."], [190, "Formation autour du numérique", "La formation peut être mise en place en :\n\n- **Collaborant avec des experts** : inviter des formateurs externes ou des enseignants déjà compétents pour partager leur expérience.\n\n- **Créant des ateliers pratiques** : organiser des séances où les enseignants peuvent tester les outils numériques."], [191, "Co-éducation en REP sans parents au CA", "Pour renforcer la co-éducation dans un REP où les parents ne sont pas élus au CA, il faut :\n\n- **Organiser des rencontres informelles** : avec les parents pour échanger sur leurs préoccupations et leur offrir une plateforme pour participer.\n\n- **Impliquer des représentants des parents** : dans des groupes de travail ou des comités consultatifs."], [192, "Composition du conseil d'administration (CA)", "Le **CA** est généralement composé de :\n\n- **Le chef d’établissement** : président.\n\n- **Représentants des enseignants** : élus par leurs pairs.\n\n- **Représentants des parents d’élèves** : élus.\n\n- **Représentants des collectivités locales** : parfois inclus.\n\n- **Représentants des élèves** : dans le cas des établissements secondaires."], [193, "Dernière réforme de la commission permanente et du CA", "La dernière réforme a souvent porté sur la clarification des rôles et responsabilités entre la **commission permanente** et le **CA**. La commission permanente s’occupe des questions courantes et des décisions pratiques, tandis que le CA se concentre sur les orientations stratégiques."], [194, "Projet numérique et projet d'établissement", "Le **projet numérique** doit être intégré au **projet d’établissement** pour garantir la cohérence des actions. Cela implique :\n\n- **Alignement des objectifs** : le projet numérique doit servir les objectifs pédagogiques définis dans le projet d’établissement.\n\n- **Mise en œuvre conjointe** : les actions numériques doivent être soutenues par des initiatives pédagogiques."], [195, "Arrivée dans un établissement sans projet d'établissement", "Si vous arrivez dans un établissement sans projet d’établissement, vous pouvez :\n\n- **Évaluer les besoins et les priorités** : organiser des rencontres avec les enseignants, le personnel et les élèves pour comprendre les enjeux.\n\n- **Initier un diagnostic partagé** : établir un état des lieux pour construire ensemble un projet qui reflète les aspirations de la communauté éducative."], [197, "Attirer des partenaires", "Les **partenaires** peuvent inclure :\n\n- **Associations locales** : pour des projets éducatifs et sociaux.\n\n- **Entreprises** : pour des stages ou des financements.\n\n- **Institutions** : autres établissements scolaires pour des échanges ou des projets communs."], [198, "Partenaires en LP", "Dans un lycée professionnel, les partenaires peuvent être :\n\n- **Entreprises locales** : pour des stages et des contrats d’apprentissage.\n\n- **Chambres de commerce** : pour l’orientation et l’insertion professionnelle.\n\n- **Bureaux de placement** : pour aider les élèves à trouver des opportunités après le diplôme."], [199, "Partenaires en REP+ pour l'orientation des filles", "Pour travailler sur l’**orientation et l’ambition des filles** en REP+, vous pouvez solliciter :\n\n- **Associations féministes ou de promotion des carrières féminines** : pour sensibiliser et accompagner.\n\n- **Professionnelles de divers secteurs** : pour des interventions et des témoignages."], [200, "PFMP (Périodes de Formation en Milieu Professionnel)", "Les partenaires pour les PFMP peuvent inclure :\n\n- **Entreprises du secteur** : pour accueillir les élèves en stage.\n\n- **Organisations professionnelles** : pour des formations et des conseils."], [201, "DDFPT dans tous les LP", "Les **DDFPT (Directeurs de Formation Professionnelle et Technique)** ne sont pas présents dans tous les lycées professionnels, mais sont souvent disponibles dans ceux qui disposent d’une offre de formation diversifiée. Leur rôle est d’assurer la qualité des formations professionnelles."], [202, "Parcours citoyen du lycéen professionnel", "Le parcours citoyen vise à sensibiliser les élèves aux valeurs de la République, aux droits et devoirs des citoyens, et à les impliquer dans des projets collectifs. Il se traduit par :\n\n- **Des actions de bénévolat** : participation à des projets associatifs.\n\n- **Des cours d’éducation civique** : sensibilisation aux enjeux de la citoyenneté."], [203, "deux idées clés à retenir de la Transformation de la Voie Professionnelle (TVP) :", "### 1. Renforcement de l’Alternance\n\n- La TVP met l’accent sur l'**alternance** comme modalité privilégiée de formation. Cette approche permet aux élèves d’acquérir des compétences pratiques directement en entreprise tout en suivant des cours théoriques. L'alternance favorise une meilleure insertion professionnelle, car les étudiants se familiarisent avec le monde du travail et développent un réseau professionnel dès leur formation.\n\n### 2. Mise à Jour des Programmes et des Compétences\n\n- Les programmes de formation sont modernisés pour intégrer des **compétences transversales** (comme le travail en équipe, la communication et la résolution de problèmes) et des compétences numériques. Cette mise à jour vise à répondre aux besoins du marché du travail et à assurer que les diplômés soient non seulement techniquement compétents, mais aussi capables de s'adapter aux évolutions des métiers.\n\n- Ces deux idées illustrent bien les efforts de la TVP pour rendre la voie professionnelle plus dynamique et en adéquation avec les réalités du monde du travail."], [204, "Leviers en tant que Chef d'Établissement pour la Sécurité", "En tant que **Chef d'Établissement**, les leviers pour garantir la sécurité incluent :\n\n- **Mise en place de protocoles de sécurité** : Établir des procédures claires pour différents types d’alertes (incendie, intrusion, etc.) et assurer leur communication à l’ensemble de la communauté éducative.\n\n- **Formation du personnel** : Organiser des formations régulières pour les enseignants et le personnel sur les protocoles de sécurité et les gestes de premiers secours.\n\n- **Collaboration avec les acteurs locaux** : Travailler avec la police, les pompiers et les services de sécurité pour réaliser des exercices de simulation et des évaluations de sécurité."], [205, "Le C.E. Est-il Seul sur la Question de la Sécurité ?", "Non, le **Chef d'Établissement (C.E.)** ne travaille pas seul sur la question de la sécurité. Il collabore avec :\n\n- **Le personnel éducatif** : Les enseignants et les CPE (Conseillers Principaux d’Éducation) jouent un rôle clé dans la mise en œuvre des mesures de sécurité.\n\n- **Les instances de l’établissement** : Le conseil d’administration et d'autres comités (comme le conseil de la vie scolaire) doivent être impliqués dans la réflexion sur la sécurité.\n\n- **Les partenaires extérieurs** : Les forces de l'ordre et les collectivités locales peuvent fournir des conseils et des ressources."], [206, "Situation d'Urgence : Foudre et SSI (système de sécurité incendie ) en Panne", "Si la foudre tombe sur l’établissement et que le Système de Sécurité Incendie (SSI) ne fonctionne plus, voici ce que je ferais :\n\n- **Évaluer la situation** : Vérifier la sécurité des élèves et du personnel, en s’assurant qu’il n’y a pas de blessés.\n\n- **Mettre en place un plan d’évacuation** : Si nécessaire, évacuer les élèves vers des zones sûres tout en maintenant le calme et l’ordre.\n\n- **Contacter les services d’urgence** : Alerter les pompiers pour qu’ils interviennent sur le site afin de rétablir la sécurité.\n\n- **Informer les parents** : Communiquer avec les familles pour les tenir informées de la situation."], [207, "Faire Vivre les Instances Démocratiques", "Pour faire vivre les instances démocratiques (comme le CVL ou le CA), je mettrais en place :\n\n- **Des réunions régulières** : Organiser des rencontres avec des ordres du jour clairs et des objectifs précis pour encourager la participation active.\n\n- **Sensibilisation des membres** : Informer les membres sur l’importance de leur rôle et les enjeux des décisions prises.\n\n- **Inviter les élèves et parents à s’exprimer** : Créer un climat de confiance où chacun se sent libre de donner son avis et de participer aux discussions."], [208, "CVL qui ne Fonctionne Pas", "Si le **CVL** ne fonctionne pas et que les élèves ne participent pas, je ferais :\n\n- **Évaluer les raisons du désintérêt** : Comprendre pourquoi les élèves ne s'engagent pas (manque d’information, de motivation, etc.).\n\n- **Proposer des activités attractives** : Organiser des événements qui intéressent les élèves pour les inciter à s’impliquer.\n\n- **Communiquer les résultats des actions passées** : Montrer l’impact concret de leur participation pour susciter l’intérêt."], [209, "Agir sur les Difficultés Économiques et Sociales", "Dans le cadre d’une **cité éducative**, je pourrais agir sur les difficultés économiques et sociales des élèves en :\n\n- **Créant des partenariats** : Collaborer avec des associations locales pour offrir du soutien scolaire ou des aides matérielles.\n\n- **Mise en place de dispositifs d’écoute** : Offrir des séances de soutien psychologique pour aider les élèves à surmonter leurs difficultés.\n\n- **Organisant des actions de sensibilisation** : Proposer des interventions sur des thèmes comme la gestion du budget, l'égalité des chances, etc."], [210, "Suivi Individualisé des Élèves", "Pour assurer un suivi individualisé des élèves dans le contexte de la réforme du lycée, je mettrais en place :\n\n- **Des réunions régulières avec les professeurs principaux** : Pour discuter des parcours et des besoins de chaque élève.\n\n- **Utilisation d’outils numériques** : Mettre en place des plateformes de suivi où les enseignants peuvent partager des informations sur les progrès des élèves.\n\n- **Accompagnement personnalisé** : Prévoir des heures de soutien ou de tutorat pour les élèves en difficulté."], [211, "Prise pour Assurer un Suivi Individualisé", "J’ai la capacité d’établir des dispositifs de suivi individualisé en :\n\n- **Ressources humaines** : Mobiliser le personnel éducatif pour consacrer du temps à des suivis personnalisés.\n\n- **Coordination avec les équipes pédagogiques** : Travailler en concert avec l’ensemble des enseignants pour partager les informations et stratégies sur les élèves."], [212, "AP (Accompagnement Personnalisé) en 1re et Term", "L’**Accompagnement Personnalisé (AP)** en première et terminale est généralement un dispositif :\n\n- **Encouragé par les réformes** : Il est intégré aux programmes pour soutenir les élèves dans leur parcours.\n\n- **Peut-être complexe à mettre en place** : S’il n’est pas bien planifié, notamment en fonction des horaires et des disponibilités des enseignants."], [213, "Principes des Sanctions", "Les **principes des sanctions** dans un EPLE incluent :\n\n- **Proportionnalité** : Les sanctions doivent être adaptées à la gravité de la faute commise.\n\n- **Égalité** : Appliquer les sanctions de manière équitable à tous les élèves.\n\n- **Prévention** : Les sanctions doivent viser à éduquer et à prévenir les comportements futurs."], [214, "Qui Peut Prononcer des Sanctions dans un EPLE ?", "Les sanctions peuvent être prononcées par :\n\n- **Le Chef d'Établissement** : Pour les sanctions les plus graves.\n\n- **Les Professeurs** : Pour des manquements mineurs au règlement intérieur.\n\n- **Le Conseiller Principal d’Éducation (CPE)** : Pour des comportements problématiques dans le cadre de la vie scolaire."], [215, "Délégation de Signature", "En tant que C.E., je peux déléguer ma signature à :\n\n- **Mon adjoint** : Cela permet de fluidifier les décisions administratives et de gérer plus efficacement le quotidien de l’établissement.\n\n- **Autres membres de l’équipe de direction** : Selon les besoins, pour assurer une continuité de service."], [216, "Délégation des Sanctions au CPE", "Il est possible de **déléguer certaines sanctions au CPE**, surtout celles qui relèvent de la vie scolaire. Toutefois, cela doit se faire dans le cadre du règlement intérieur et en tenant compte des responsabilités de chacun."], [217, "Différence entre une 3e Générale et une 3e PPM", "- **3e Générale** : La classe de 3e générale prépare principalement les élèves à poursuivre des études au lycée général ou technologique. Le programme se concentre sur des matières académiques classiques et vise à préparer les élèves à obtenir le Diplôme National du Brevet (DNB) en vue d'une orientation vers le lycée.\n\n- **3e Préparatoire Professionnelle (3PPM)** : La 3PPM est destinée aux élèves qui souhaitent s'orienter vers une formation professionnelle. Elle vise à les préparer à des métiers spécifiques et à leur donner des bases pratiques, souvent avec des stages en entreprise. Les élèves y acquièrent des compétences plus orientées vers le monde du travail."], [218, "Pourquoi Orienter Certains Élèves en 3PPM ?", "Orienter des élèves en 3PPM peut être justifié par plusieurs raisons :\n\n- **Affinité pour les métiers manuels ou techniques** : Certains élèves peuvent avoir une inclination naturelle pour des carrières techniques ou professionnelles et se sentir plus à l'aise dans un environnement d'apprentissage pratique.\n\n- **Niveau scolaire** : Les élèves ayant des difficultés dans les matières académiques peuvent trouver leur voie dans des formations plus adaptées à leurs compétences et intérêts.\n\n- **Épanouissement personnel** : La 3PPM peut offrir à ces élèves une chance de réussir et de s’épanouir dans un cadre qui leur convient mieux."], [219, "Taux de Participation des Parents aux Élections", "Le taux de participation des parents aux élections des représentants peut varier, mais il est souvent faible, oscillant autour de 20 à 30 % dans certains établissements.\n\n**Responsabilité du Faible Taux de Participation**\n\nLa responsabilité du faible taux de participation peut incomber à plusieurs facteurs :\n\n- **Manque d’information** : Les parents ne sont pas toujours informés des enjeux des élections et de l’importance de leur participation.\n\n- **Difficultés d’emploi du temps** : Les parents peuvent avoir des contraintes professionnelles ou personnelles qui rendent leur participation difficile.\n\n- **Perception** : Certains peuvent considérer que leur vote n’a pas d’impact significatif sur la vie de l’établissement."], [220, "Stratégie pour Impliquer les Parents aux Élections", "Pour inciter les parents à voter lors des élections des représentants :\n\n- **Sensibilisation** : Organiser des réunions d’information pour expliquer l’importance de leur rôle et les enjeux des élections.\n\n- **Communication proactive** : Envoyer des courriers, des SMS ou des mails rappelant la date des élections et l'importance de leur vote.\n\n- **Événements conviviaux** : Créer des événements autour des élections (comme des petits-déjeuners ou des rencontres) pour attirer les parents et les encourager à s’impliquer."], [221, "Valeurs pour Piloter", "Mes valeurs pour piloter un établissement éducatif incluent :\n\n- **Équité** : Assurer que chaque élève ait accès aux mêmes opportunités et ressources, quel que soit son milieu social ou ses besoins spécifiques.\n\n- **Collaboration** : Travailler en étroite collaboration avec tous les acteurs de l’établissement (enseignants, parents, élèves) pour favoriser un climat de confiance et d'engagement.\n\n- **Innovation** : Encourager des approches pédagogiques novatrices pour répondre aux défis éducatifs contemporains."], [222, "EBEP et Inclusion Scolaire", "- **EBEP (Éducation et Bien-Être de l’Élève en France)** : L'inclusion scolaire se réfère à l'intégration des élèves en situation de handicap ou ayant des besoins éducatifs particuliers dans les classes ordinaires.\n\n- **Déclinaison dans l'Éducation Nationale** :\n\n  - **Adaptation des programmes** : Ajuster le contenu et les méthodes d’enseignement pour répondre aux besoins variés des élèves.\n\n  - **Formation des enseignants** : Former le personnel éducatif à l'accueil et à l'accompagnement des élèves avec des besoins spécifiques.\n\n  - **Soutien individualisé** : Mettre en place des dispositifs tels que les ULIS (Unités Localisées pour l'Inclusion Scolaire) pour un accompagnement personnalisé."], [223, "Responsabilités Déléguées", "Les responsabilités qui peuvent être déléguées incluent :\n\n- **Gestion administrative** : Certaines tâches administratives peuvent être confiées à des adjoints ou à des secrétaires.\n\n- **Encadrement pédagogique** : Les responsabilités de coordination des équipes pédagogiques peuvent être déléguées à des professeurs référents.\n\n- **Suivi des élèves** : Les CPE peuvent être chargés de suivre la vie scolaire et les questions disciplinaires."], [224, "Délégation de la Présidence du Conseil d’Administration (C.A.)", "La présidence du **C.A.** ne peut pas être déléguée. Le président est élu par les membres du conseil et doit assumer ses fonctions."], [225, "Responsabilité Pénale", "La **responsabilité pénale** ne se délègue pas. Chaque personne, y compris le chef d’établissement, est responsable de ses actes devant la loi."], [226, "DHG, Projet d'Établissement et Contrat d'Objectifs", "- La **Dotation Horaire Globale (DHG)** influence le projet d’établissement en déterminant les ressources humaines disponibles.\n\n- Le **contrat d'objectifs** est un engagement entre l’établissement et l'académie, définissant des objectifs à atteindre en matière de résultats scolaires, d'inclusion, ou de développement professionnel."], [227, "Résultats Utiles pour le Pilotage du C.E.", "Les résultats utiles pour le pilotage peuvent inclure :\n\n- **Taux de réussite** au Diplôme National du Brevet (DNB) et au baccalauréat.\n\n- **Taux d’absentéisme** et de sanctions disciplinaires.\n\n- **Évaluations des élèves** et résultats des examens intermédiaires."], [228, "Nombre de Conseillers d'Orientation", "Le nombre de conseillers d’orientation (C.D.) peut être un indicateur dans le pilotage, car il influence l’accompagnement des élèves dans leur parcours."], [229, "Communication des Chiffres aux Parents d'Élèves", "Communiquer ces chiffres aux parents d’élèves est important pour :\n\n- **Transparence** : Établir une relation de confiance et impliquer les parents dans le suivi de la scolarité de leurs enfants.\n\n- **Implication** : Sensibiliser les parents aux enjeux de l’établissement et les inciter à participer activement à la vie scolaire."], [230, "Travail avec les Parents", "Le travail avec les parents peut inclure :\n\n- **Réunions d’information** : Organiser des rencontres pour informer les parents sur le fonctionnement de l’établissement et les projets pédagogiques.\n\n- **Outils de communication** : Utiliser des newsletters, des plateformes numériques, et des réseaux sociaux pour garder les parents informés.\n\n- **Encouragement de l'engagement** : Inviter les parents à participer aux conseils d’école et aux événements scolaires."], [231, "Communication sur les Heures Supplémentaires Effectives (HSE)", "Il est utile de communiquer sur les HSE données aux enseignants pour :\n\n- **Clarifier les attentes** : Préciser le volume de travail supplémentaire demandé aux enseignants.\n\n- **Justifier les décisions** : Expliquer les besoins pédagogiques qui nécessitent des HSE."], [232, "Obligation Réglementaire de Rendre Compte de la Ventilation des HSE et IMP", "Oui, il existe une **obligation réglementaire** de rendre compte de la ventilation des heures supplémentaires et des heures de mise en place des projets (IMP). Cela permet de garantir la transparence et l’équité dans la gestion des ressources."], [233, "Recrutement des Enseignants sur Profil", "Le recrutement des enseignants sur profil peut avoir des avantages, comme :\n\n- **Adapter les compétences aux besoins de l’établissement** : Cela permet de recruter des enseignants ayant des spécialités précises ou des compétences en lien avec les projets de l’établissement.\n\n- **Renforcer la motivation** : Les enseignants recrutés sur profil peuvent être plus motivés et engagés dans le projet éducatif."], [234, "Gros Mouvement Social dans un EPLE", "Si je suis nommée dans un EPLE avec un gros mouvement social contre le recrutement des enseignants, je ferais :\n\n- **Dialogue et écoute** : Organiser des rencontres avec les enseignants pour comprendre leurs préoccupations et leurs attentes.\n\n- **Transparence** : Expliquer les enjeux du recrutement et comment cela s’intègre dans le projet de l’établissement.\n\n- **Médiation** : Tenter de trouver des compromis pour apaiser les tensions et encourager la coopération."], [235, "DEPP et Sondage pour DF", "Si le DEPP (Direction de l'Évaluation, de la Prospective et de la Performance) demande un sondage à remplir pour le DF (Dossier de Formation) et qu'il y a peu de réponses, cela peut signifier :\n\n- **Un manque d'intérêt** de la part des personnels, ce qui peut refléter un désengagement ou une méfiance envers le processus.\n\n- **Un problème de communication** : Les personnels peuvent ne pas être au courant de l'importance de remplir ce sondage."], [236, "Mettre en Valeur des Personnels dans un EPLE", "Pour mettre en valeur les personnels de l’EPLE, je pourrais :\n\n- **Organiser des événements** : Célébrer les réussites des enseignants et du personnel en organisant des événements de reconnaissance.\n\n- **Valoriser le travail d'équipe** : Mettre en avant des projets collectifs ou des initiatives réussies.\n\n- **Saisir des dispositifs existants** : Utiliser des programmes comme les primes à l'ancienneté ou d'autres dispositifs de valorisation."], [237, "Dispositifs Autres que le PPCR", "D'autres dispositifs de valorisation des carrières et des compétences peuvent inclure :\n\n- **Le Compte Personnel de Formation (CPF)** : Permet aux agents d'acquérir des compétences supplémentaires.\n\n- **Les entretiens professionnels** : Pour discuter des perspectives de carrière et des besoins de formation."], [238, "Gestion des Ressources Humaines de Proximité", "La **Gestion des Ressources Humaines de proximité** (GRH) désigne une approche qui cherche à impliquer directement les établissements scolaires dans la gestion de leur personnel, en tenant compte des spécificités locales et des besoins des équipes."], [239, "Réforme du Collège", "Mes réflexions sur la **réforme du collège** peuvent inclure :\n\n- **Une volonté de personnalisation** : La réforme vise à offrir une plus grande personnalisation des parcours scolaires, ce qui peut être bénéfique pour les élèves.\n\n- **Des préoccupations sur la charge de travail** : Certains enseignants peuvent se sentir débordés par les nouvelles exigences, surtout avec un volume horaire réduit."], [240, "Volume Horaire en-deçà de l'Ancienne Formule", "Un volume horaire en-deçà de l'ancienne formule peut poser des défis :\n\n- **Difficulté à couvrir le programme** : Les enseignants peuvent avoir des difficultés à enseigner tout le contenu prévu dans un temps limité.\n\n- **Impact sur la qualité de l’enseignement** : Cela peut réduire la possibilité d’un enseignement approfondi et de l’accompagnement individualisé des élèves."], [241, "Impulser un Souffle Nouveau dans un Établissement Vieillissant", "Pour donner un nouveau souffle à un établissement vieillissant, je mettrais en place les actions suivantes :\n\n- **Diagnostic Participatif** : Réaliser un diagnostic avec l'ensemble des parties prenantes (enseignants, élèves, parents) pour identifier les points faibles et les axes d'amélioration.\n\n- **Projets Innovants** : Initier des projets pédagogiques innovants, comme des ateliers thématiques, des partenariats avec des entreprises locales, ou des programmes d'échange culturel.\n\n- **Formation Continue** : Encourager la formation continue des enseignants pour introduire de nouvelles méthodes pédagogiques et des outils numériques.\n\n- **Amélioration des Infrastructures** : Planifier des améliorations des locaux et des équipements pour créer un environnement d'apprentissage stimulant."], [242, "Répartition des Fonctions et Gestion (F et G)", "- **Moyens** : Utiliser des outils de gestion tels que des tableaux de bord pour suivre l’affectation des tâches et les besoins en ressources.\n\n- **Actions** :\n\n  - **Réunions de Coordination** : Organiser des réunions régulières avec les équipes pour discuter des missions et ajuster les responsabilités en fonction des besoins.\n\n  - **Sondages auprès des Équipes** : Recueillir des feedbacks sur la répartition des tâches pour s'assurer de leur efficacité et de l'adhésion des équipes."], [243, "Actions Face au Niveau Faible en Mathématiques en 6e et 2nd", "Pour remédier à la faiblesse des niveaux en mathématiques, je mettrais en place les actions suivantes :\n\n- **Renforcement en 6e** : Introduire des ateliers de soutien et de remédiation en mathématiques dès la 6e, en faisant appel à des enseignants référents.\n\n- **Collaboration avec les Collèges de Proximité** : Établir des partenariats avec des écoles élémentaires pour mieux préparer les élèves à entrer en 6e.\n\n- **Suivi Personnalisé** : Mettre en place un suivi individualisé pour les élèves en difficulté, en utilisant des évaluations diagnostiques."], [244, "Dispositif Obligatoire avec la Réforme du Collège", "La réforme du collège impose effectivement des dispositifs pour le travail :\n\n- **Accompagnement Personnalisé (AP)** : Ce dispositif est obligatoire et vise à répondre aux besoins spécifiques des élèves en offrant des heures dédiées à des activités de soutien ou d'approfondissement.\n\n- **Enseignements Pratiques Interdisciplinaires (EPI)** : Ils visent à renforcer la transversalité et le travail collaboratif entre disciplines."], [245, "Prérogatives en Tant que Principale sur le 1er Degré", "En tant que principale, mes prérogatives sur le 1er degré sont limitées, mais je peux :\n\n- **Travailler en Collaboration** : Mettre en place des collaborations avec les directeurs d’écoles pour assurer une continuité éducative entre le 1er et le 2nd degré.\n\n- **Participer aux Instances de Concertation** : Être impliquée dans les instances de concertation pour discuter des besoins des élèves."], [246, "Instances pour Travailler avec le 1er Degré", "Les instances peuvent inclure :\n\n- **Conseil Éducatif** : Pour discuter des problématiques liées aux élèves.\n\n- **Réunions de Pédagogie** : Pour coordonner les actions entre les enseignants du 1er et du 2nd degré."], [247, "Actions Face à une Baisse du Niveau en 3e", "Pour remédier à la situation où le niveau en 3e est encore plus faible :\n\n- **Suivi Personnalisé** : Instaurer un suivi renforcé pour les élèves en difficulté avec des remédiations ciblées.\n\n- **Projets d’Intégration** : Créer des projets visant à intégrer les élèves décrocheurs ou en difficulté pour les réengager dans le parcours scolaire.\n\n- **Collaboration avec des Associations** : Travailler avec des associations pour proposer des activités qui intéressent les élèves et les motivent."], [248, "Instances pour Suivre le Décrochage Scolaire", "Les instances peuvent inclure :\n\n- **Équipe de Suivi** : Établir une équipe au sein de l’établissement pour suivre les élèves en risque de décrochage, comprenant des enseignants, des CPE et des psychologues.\n\n- **Partenariats Externes** : Collaborer avec des structures extérieures comme des missions locales pour le suivi des élèves en décrochage."], [249, "Constitution du GPDS (Groupe de Pilotage de la Décrochage Scolaire)", "Pour constituer un GPDS, je :\n\n- **Identifie les Membres Clés** : Inclure des enseignants, des CPE, des psychologues, et des représentants des parents d’élèves.\n\n- **Définir les Objectifs** : Clarifier les missions et les objectifs du groupe pour assurer un suivi efficace des élèves à risque."], [250, "Banalisation d'une Demi-Journée dans un Établissement", "La possibilité de banaliser une demi-journée relève de la prérogative du chef d’établissement. Cela doit être justifié par des besoins pédagogiques et organisé en concertation avec les enseignants.\n\n- **Heures Dues** : Les heures d’enseignement dues aux élèves doivent être compensées pour éviter de pénaliser l’apprentissage."], [251, "Gestion en Tant que Principale-Adjointe", "Si je me retrouve seule devant l’EDT et Pronote :\n\n- **Prioriser les Tâches** : Identifier les tâches urgentes et les prioriser, par exemple, les emplois du temps des enseignants et des élèves.\n\n- **Demander de l’Aide** : N’hésiter pas à demander de l'aide à des collègues ou à des partenaires pour gérer les imprévus."], [252, "Priorité pour la Préparation de la Rentrée Scolaire", "Les priorités incluent :\n\n- **Analyse des Effectifs** : Vérifier le nombre d’élèves et les besoins spécifiques.\n\n- **Constitution des Équipes** : Organiser les équipes pédagogiques en fonction des besoins des élèves et des compétences des enseignants."], [253, "Différence entre AP et DF au Collège", "- **AP (Accompagnement Personnalisé)** : Destiné à soutenir les élèves selon leurs besoins spécifiques, il est à la fois pédagogique et basé sur des activités de soutien.\n\n- **DF (Dossier de Formation)** : Concerne le suivi et l’évaluation des formations des enseignants, souvent lié à la gestion des carrières."], [254, "AP et EPI dans les ORS des Enseignants", "Faire de l’AP et des EPI fait effectivement partie des **Obligations de Service (ORS)** des enseignants, ce qui signifie qu'ils doivent intégrer ces activités dans leur charge de travail, en les préparant et en les animant selon les besoins des élèves.\n\n**Liens entre le 1er Degré et le Lycée**\n\n- **Transition** : Il est crucial de mettre en place une continuité entre le 1er degré et le secondaire pour assurer un suivi cohérent des élèves. Cela implique des réunions régulières avec les enseignants des écoles primaires pour discuter des acquis des élèves et des attentes du collège.\n\n- **Partenariats** : Créer des partenariats avec des lycées pour faciliter l’orientation des élèves et organiser des visites pour les collégiens afin qu'ils puissent se projeter dans leur avenir scolaire."], [255, "Esprit des Réformes TVP et LGT", "- **Transformation de la Voie Professionnelle (TVP)** : Cette réforme vise à valoriser la voie professionnelle en la rendant plus attractive, avec des formations plus adaptées aux besoins du marché de l’emploi et une meilleure intégration des élèves.\n\n- **Réformes des Lycées Généraux et Technologiques (LGT)** : Elles cherchent à favoriser la personnalisation des parcours et à développer des compétences transversales, en encourageant l’interdisciplinarité et le travail collaboratif."], [256, "Co-Intervention et Co-Animation", "Ces modalités bousculent les habitudes en :\n\n- **Promouvant le Travail en Équipe** : Les enseignants doivent collaborer étroitement, ce qui peut être un changement par rapport à des pratiques plus individuelles.\n\n- **Redéfinissant les Rôles** : La co-intervention nécessite que les enseignants adaptent leurs méthodes d'enseignement et d'évaluation pour répondre aux besoins d’un groupe d’élèves plus diversifié."], [257, "Arrivée en LP avec Opposition entre Enseignements", "- **Dialogue** : Organiser des réunions pour discuter des craintes et des attentes de chaque groupe, et essayer de créer un climat de confiance.\n\n- **Formation Conjointe** : Proposer des formations sur la pédagogie de l’alternance et l’intérêt de la co-intervention pour faciliter la compréhension mutuelle des enjeux.\n\n- **Projets Commun** : Initier des projets communs qui nécessitent la collaboration des enseignants de différentes filières pour créer des synergies."], [258, "Parler de la DHG (Dotation Horaire Globale)", "La DHG est un outil de gestion qui définit le nombre d’heures d’enseignement alloué à un établissement pour une année scolaire. Elle est calculée en fonction de plusieurs critères, notamment le nombre d’élèves, les spécificités de l’établissement (REP, SEGPA, etc.), et les projets pédagogiques envisagés."], [259, "Apport d'une Cité Éducative à un EPLE", "- **Collaboration Renforcée** : La cité éducative favorise les partenariats entre les établissements scolaires, les collectivités locales, et les associations, ce qui enrichit les projets éducatifs.\n\n- **Soutien aux Élèves** : Elle permet de mobiliser des ressources pour aider les élèves en difficulté, notamment par le biais de soutien scolaire, d'activités périscolaires, ou d'accompagnement psychologique."], [260, "Co-Pilotage Tri-Partite", "Le co-pilotage tri-partite implique :\n\n- **Éducation Nationale** : Représentants des établissements scolaires.\n\n- **Collectivité Territoriale** : Pour la gestion des infrastructures et l’accompagnement des projets éducatifs.\n\n- **Associations Locales** : Qui peuvent apporter un soutien et une expertise sur des projets spécifiques."], [261, "Indicateurs : Où les Trouver et Comment les Utiliser ?", "Les indicateurs peuvent être trouvés dans :\n\n- **Bases de Données de l'Éducation Nationale** : Pour des données sur les résultats scolaires, les taux de réussite, et le décrochage.\n\n- **Rapports d'Évaluation** : Élaborés par des organismes comme la DEPP (Direction de l'évaluation, de la prospective et de la performance). Utiliser ces indicateurs pour :\n\n- **Analyser les Résultats** : Identifier les points forts et les axes d'amélioration.\n\n- **Évaluer l'Impact des Actions** : Mesurer l'efficacité des projets mis en place."], [262, "Chef d'Établissement : Autorité et Pouvoir", "- **Autorité** : Le chef d’établissement a un rôle de leader, responsable de la bonne marche de l’établissement, garant des valeurs de l’école et de la cohésion des équipes.\n\n- **Pouvoir** : Il détient des prérogatives administratives et pédagogiques, mais doit également s’appuyer sur des instances collectives et favoriser la participation de l'ensemble de la communauté éducative."], [263, "Établissement Syndicalisé et Opposition", "- **Construction Collective** : Établir des canaux de communication ouverts, organiser des réunions d’échange, et favoriser la participation de tous pour construire ensemble.\n\n- **Respect des Idées** : Écouter les préoccupations des enseignants, même en cas d’opposition, et trouver des terrains d’entente pour avancer ensemble vers des objectifs communs."], [264, "Non Négociable pour les Enseignants", "Les points non négociables peuvent inclure :\n\n- **Respect de la Pédagogie** : Engagement à respecter les valeurs éducatives et les programmes établis.\n\n- **Professionnalisme** : Attente d’un comportement professionnel, que ce soit dans les relations avec les élèves ou dans le travail d’équipe."], [265, "Premier Item des 19 Compétences", "Le premier item des 19 compétences évoque généralement la **capacité à conduire un projet éducatif**, à savoir définir une vision claire pour l’établissement et mobiliser les ressources nécessaires."], [266, "Élève de 6e Perdu avec Orientation SEGPA Refusée", "Je pourrais proposer :\n\n- **Accompagnement Personnalisé** : Mettre en place un suivi individuel avec un professeur principal ou un conseiller d’orientation pour aider l'élève à s’adapter et à trouver son chemin.\n\n- **Réunions avec les Parents** : Organiser une rencontre avec les parents pour expliquer la situation et explorer les options disponibles, telles que le soutien scolaire ou des activités extrascolaires."], [267, "Budget d'un Établissement : Construction", "La construction du budget se fait par :\n\n- **Évaluation des Besoins** : Analyser les besoins en ressources humaines, matérielles et pédagogiques.\n\n- **Planification** : Établir une prévision budgétaire basée sur la DHG, les subventions, et les ressources disponibles.\n\n- **Suivi Régulier** : Effectuer un suivi régulier du budget pour ajuster les dépenses en fonction des besoins."], [268, "Origine du Budget en Novembre", "Le budget arrive généralement en novembre sous forme de **dotation globale**, qui est calculée en fonction des effectifs et des besoins de l’établissement. Ce budget doit ensuite être ajusté et réparti selon les priorités définies par le chef d’établissement."], [269, "Missions d'Accompagnement et Leur Manque", "Quitter une mission d'accompagnement peut effectivement susciter des inquiétudes. Cependant, il est essentiel de :\n\n- **Évaluer l'Impact** : Réfléchir à l'impact de cette mission sur le personnel et les élèves.\n\n- **Continuer à Évaluer les Besoins** : Rester attentif aux besoins de l’établissement pour pouvoir proposer de nouveaux dispositifs si nécessaire."], [273, "Changement de Positionnement en Devenant Chef d'Établissement", "Le changement de positionnement implique :\n\n- **Responsabilité Accrue** : Une responsabilité plus grande en matière de décisions pédagogiques et administratives.\n\n- **Vision Globale** : Un besoin de développer une vision à long terme pour l’établissement, en prenant en compte les différents enjeux éducatifs, sociaux, et économiques."], [274, "Calcul de la Catégorie Financière d'un EPLE", "La catégorie financière d'un Établissement Public Local d’Enseignement (EPLE) est calculée en prenant en compte plusieurs critères, notamment :\n\n- **Effectifs Scolaires** : Le nombre d'élèves inscrit dans l'établissement.\n\n- **Caractéristiques Sociales** : La proportion d'élèves en situation de difficulté (REP, REP+).\n\n- **Besoin en Ressources** : Les besoins spécifiques liés aux structures pédagogiques (internat, SEGPA, etc.).\n\n- **Localisation** : La zone géographique de l’établissement (zones sensibles peuvent bénéficier de ressources supplémentaires)."], [275, "Différences de Catégories Financières dans la Même Ville", "Il peut y avoir des différences de catégories financières entre deux établissements dans la même ville pour plusieurs raisons :\n\n- **Public Cible** : Un établissement peut avoir une plus grande proportion d'élèves en difficulté ou en situation de handicap.\n\n- **Projets Spécifiques** : La présence de projets éducatifs ou d’activités spécifiques peut influencer la dotation financière.\n\n- **Antécédents Historiques** : Des investissements passés, des subventions locales ou des partenariats peuvent également jouer un rôle."], [276, "L'École de la Confiance", "L'école de la confiance vise à instaurer un climat de confiance entre les différents acteurs de l'éducation (élèves, parents, enseignants, etc.) pour améliorer la réussite de tous les élèves. Elle se base sur des principes d'ouverture, de transparence et d'inclusion.\n\nUne mesure clé de l'école de la confiance est la **réduction de la taille des classes**. Cela favorise un suivi plus personnalisé des élèves et améliore la qualité de l'enseignement.\n\n**Importance de la Mesure**\n\nOui, c'est une mesure importante car elle impacte directement la qualité de l'apprentissage et le rapport entre enseignants et élèves, ce qui est fondamental pour une bonne ambiance scolaire.\n\n**Réponse à un Professeur sur les Groupes**\n\nJe répondrais qu’il est essentiel de **construire un dialogue constructif** sur les besoins spécifiques de chaque cycle. Je lui expliquerais que la mise en place de groupes de niveau peut nécessiter des ajustements spécifiques au sein de notre établissement, et que je suis ouvert à discuter de solutions qui fonctionnent dans notre contexte."], [277, "Nombre d'Heures de la DHG", "Le nombre d'heures de la DHG dépend de l’établissement, mais en général, il se situe autour de **15 à 18 heures par élève** pour les collèges. Cela varie selon les spécificités de l'établissement et la répartition des élèves."], [278, "Assistance au Conseil d'Administration sur la DHG", "Je suis impliqué dans le processus de ventilation de la DHG, même si je n'ai pas assisté au CA. Je reste informé des décisions prises et j'assure un suivi pour que la distribution des heures réponde aux besoins pédagogiques."], [279, "Construction d'un Projet d'Établissement", "Pour construire un projet d’établissement :\n\n- **Diagnostic** : Analyser les besoins et les forces de l’établissement en collaboration avec l’équipe pédagogique et les parents.\n\n- **Élaboration** : Rédiger le projet en définissant les axes prioritaires, les objectifs et les actions concrètes à mettre en place.\n\n- **Validation** : Soumettre le projet aux instances (CA, conseils pédagogiques) pour validation.\n\n- **Mise en œuvre et Évaluation** : Mettre en œuvre le projet et prévoir des moments d’évaluation et d’ajustement."], [280, "Temps Nécessaire pour Monter un Projet d'Établissement", "Le temps nécessaire pour élaborer un projet d’établissement peut varier, mais généralement, il faut **environ 6 mois à un an** pour réaliser un diagnostic, consulter les différents acteurs, et rédiger le projet."], [281, "Structure du Projet d'Établissement", "Le projet d’établissement comprend généralement :\n\n- **Contexte et Diagnostic** : Analyse de la situation actuelle.\n\n- **Axes de Développement** : Les priorités éducatives et les objectifs.\n\n- **Actions à Mettre en Œuvre** : Descriptions concrètes des actions.\n\n- **Évaluation** : Critères de réussite et méthode d'évaluation."], [282, "Leviers Contre le Décrochage Scolaire", "En tant que principal, les leviers pour lutter contre le décrochage scolaire incluent :\n\n- **Accompagnement Personnalisé** : Mettre en place des dispositifs de soutien individualisés.\n\n- **Suivi des Élèves** : Créer des équipes de suivi pour les élèves en difficulté.\n\n- **Renforcemen
