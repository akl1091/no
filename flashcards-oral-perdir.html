de droit public d'une durée d'un, deux ou trois ans, renouvelable plusieurs fois, pendant une durée maximum de 6 ans (date 2003, remplacement des surveillants d’externat)"], [56, "Quels moyens connaissez-vous pour lutter contre le décrochage scolaire?", "- référent décrochage scolaire dans un établissement (2013)\n\n- groupe de prévention du décrochage scolaire (GPDS)\n\n- classe relais\n\n- article 15 de la loi de l’école de la confiance = mission prioritaire\n\n- Tutorat, mentorat\n\n- Cordées de la réussite\n\n- Les réseaux FOQUALE (réseau formation qualification emploi) rassemblent les acteurs de l'éducation nationale intervenant dans la prise en charge des jeunes sortis sans diplôme ni un niveau suffisant de qualification : établissements, CIO, MLDS, structures de retour à l'école (SRE)"], [57, "Manage-t-on un EPLE comme une entreprise? Pourquoi?", "Management comme dans une entreprise : en partie oui!\n\n« Un EPLE partage comme les entreprises l’objectif de bien être des employés, on dit agents dans le service public. Dans cet objectif le CE manager va veiller à positionner chaque agent dans une équipe adaptée à son profil, va accompagner l’agent dans sa formation, va valoriser son travail. Le CE va aussi identifier les personnes moteurs qui vont pouvoir devenir des ressources pour l’établissement. Différence : dans un EPLE, pas de prime aux résultats pour les agents, mais des IMP pour l’investissement dans certaines missions d’intérêt général pour l’établissement.\n\nPour les personnels de direction, il existe une prime de résultat  »"], [58, "Quelle est la différence entre autorité hiérarchique et autorité fonctionnelle?", "L’autorité hiérarchique = donne des ordres à une personne subornée\n\nL’autorité fonctionnelle, liée à la fonction a en charge l'encadrement, la répartition des tâches et l'organisation du travail des personnels, y compris en dehors de l’EN = ex ATEE)."], [59, "Quelle est la nouvelle organisation académique après la réorganisation des régions? Combien y a-t-il de régions en France? Combien d'Académies?", "13 régions métropolitaines = 13 régions académiques\n\n// 30 académies (exemple Limoges au sein de la région académique Nouvelle aquitaine)"], [60, "Que savez-vous des services civiques? Et le qu’est-ce que le SNU?", "**Services civique :** le Service Civique s'adresse aux jeunes de 16 à 25 ans, jusqu'à 30 ans pour les jeunes en situation de handicap. Indemnisé 580 euros par mois, il permet de s'engager sans condition de diplôme dans une mission d'intérêt général au sein d'une association, d'un établissement public, d'une collectivité... En France ou à l'étranger et dans 9 domaines d'action : solidarité, environnement, sport, culture, éducation, santé, intervention d'urgence, mémoire et citoyenneté, aide humanitaire.\n\n**SNU : service national universel, concerne les jeunes entre 15 et 17 ans (mise en place en 2019)**\n\nCe service comporte un séjour de cohésion de deux semaines puis une mission d'intérêt général de 12 jours ou au minimum 84 heures. Elle peut être poursuivie par une période d'engagement de trois mois minimum."], [61, "Que savez-vous des classes relais?", "Création en 1998.\n\nAteliers relais : 4 à 6 semaines\n\nClasses relais : 6 mois maximum\n\nInternat tremplins : échec scolaire + marginalisation\n\nC’est un dispositif destiné à accueillir les élèves en situation de décrochage scolaire, de marginalisation scolaire et sociale afin de les préparer à la poursuite d'un parcours de formation générale, technologique ou professionnelle tout en s'attachant à privilégier un objectif de socialisation et d'éducation à la citoyenneté.. Les familles doivent donner leur accord pour une inscription dans ce dispositif. Mais, depuis août 2019, un CE peut, sans l’accord préalable de la famille, inscrire un élève en classe relais s’il a été exclu de l’établissement à l’issue d’un conseil de discipline.\n\nEn dehors des polyexclus, les élèves inscrits dans le dispositif restent rattachés à leur établissement d’origine. L’objectif étant leur réintégration.\n\nNiveaux concernés : à partir de la 5ème, jusqu’à l’âge de 16 ans\n\nLes dispositifs relais sont rattachés à un établissement public local d'enseignement (EPLE). Cet établissement est le plus souvent un collège, mais il peut être un lycée d'enseignement général et technologique, un lycée professionnel.\n\nAménagements : matinées consacrées aux fondamentaux, après-midi EAC, citoyenneté, EPS. Groupe limité à 12 élèves.\n\nLa classe relais mobilise plusieurs acteurs : éducateurs, PJJ, collectivités"], [62, "L'équipe d'anglais organise un voyage en Angleterre en 3e : il y a 50 places pour 70 demandes, comment faites-vous ?", "Mobilisation de la commission et analyse des demandes avec une grille critériée. Seront privilégiés les élèves qui n’ont jamais participé au voyage et les inscriptions par ordre d’arrivées."], [63, "De quels leviers disposez-vous pour mobiliser les enseignants ? Comment procédez-vous ?", "- HSE, IMP\n\n- FIL\n\n- Budget\n\n- EDT\n\n- Dispositifs divers\n\n- Conseil pédagogiques\n\n- Relations interpersonnelles dans le cadre d’échanges individuels et collectifs\n\n- Valorisations des actions menées"], [64, "Le PPCR modifie-t-il la représentation des enseignants sur le rôle du chef d’établissement et de l’IA-IPR ? Quel est le rôle de l’IA-IPR dans le PPCR ? Quel est le rôle du chef d’établissement dans le PPCR?", "Oui, Le **PPCR** (Parcours Professionnels, Carrières et Rémunérations) a modifié en partie la perception des enseignants sur ces rôles :\n\n- **Chef d’établissement :** Avec le PPCR, le chef d’établissement joue un rôle plus important dans l’évaluation des enseignants, notamment en ce qui concerne leurs compétences organisationnelles, relationnelles et leur investissement dans la vie de l’établissement. Cette implication renforce sa position dans l’accompagnement des enseignants, mais peut aussi amener certains enseignants à le percevoir comme un acteur davantage évaluateur que simplement manager.\n\n- **IA-IPR :** L’IA-IPR est davantage perçu comme un expert pédagogique. Son rôle dans l’évaluation est recentré sur les compétences disciplinaires et pédagogiques. Cela peut donner une image plus technique de son intervention, mais aussi plus ciblée sur le cœur du métier d’enseignant.\n\nCes changements peuvent provoquer des ajustements dans la relation enseignant-chef d’établissement et enseignant-IA-IPR, parfois en renforçant la collaboration, mais aussi en suscitant des incompréhensions sur les limites respectives des responsabilités.\n\nL’IA-IPR intervient principalement dans le cadre de l’**évaluation professionnelle des enseignants**, notamment lors des rendez-vous de carrière. Son rôle inclut :\n\n1.  **Observer les pratiques pédagogiques :**\n\n    - L’IA-IPR évalue les compétences pédagogiques, disciplinaires et didactiques de l’enseignant lors des observations en classe.\n\n    - Il s’assure que les pratiques répondent aux attentes des programmes et aux besoins des élèves.\n\n2.  **Rédiger un rapport :**\n\n    - À l’issue de l’observation, l’IA-IPR produit un rapport d’évaluation détaillé, qui contribue à l’analyse de la progression de carrière de l’enseignant.\n\n3.  **Conseiller et accompagner :**\n\n    - L’IA-IPR conseille les enseignants pour améliorer leurs pratiques pédagogiques et pour favoriser leur développement professionnel.\n\nLe chef d’établissement joue un rôle complémentaire à celui de l’IA-IPR, en se concentrant sur des aspects plus organisationnels et relationnels :\n\n1.  **Évaluer la contribution de l’enseignant à la vie de l’établissement :**\n\n    - Le chef d’établissement apprécie la participation de l’enseignant à la dynamique collective (projets, relations avec les collègues, implication dans les instances, etc.).\n\n2.  **Participer au rendez-vous de carrière :**\n\n    - Il participe à l’évaluation des enseignants, notamment par des entretiens où il examine leurs compétences professionnelles dans le contexte de l’établissement.\n\n3.  **Rédiger un avis :**\n\n    - Le chef d’établissement rédige un avis sur la base de ses observations et échanges. Cet avis, transmis avec celui de l’IA-IPR, contribue à la décision finale concernant l’avancement de carrière.\n\n4.  **Accompagner et soutenir :**\n\n    - En dehors de l’évaluation, le chef d’établissement a aussi un rôle de facilitateur et de soutien dans la gestion de la carrière de l’enseignant, notamment en valorisant ses initiatives.\n\nLe PPCR a modifié les rôles et les perceptions des acteurs institutionnels :\n\n- **IA-IPR :** Un rôle recentré sur l’expertise pédagogique.\n\n- **Chef d’établissement :** Un rôle renforcé dans l’évaluation globale et l’accompagnement de l’enseignant."], [65, "Que pensez-vous de Parcoursup ?", "La plateforme a été mise en place en 2018 dans le cadre de la loi « Orientation et réussite des étudiants ». Elle remplace Admission Post-Bac (APB). Le côté positif, elle met fin au tirage au sort et enregistre les vœux motivés mais non hiérarchisés des candidats, qui doivent accepter ou décliner les propositions au fur et à mesure qu'elles leur sont faites.\n\nC’est aussi un outil d’accompagnement pour les familles avec des ressources sur les formations."], [66, "Que pensez-vous du redoublement?", "Les études montrent globalement son inutilité. Mon expérience va dans ce sens même s’il a pu fonctionner pour quelques élèves qui n’avaient pas pu suivre l’année redoublée en raison de problèmes personnels et familiaux.\n\nRôle des parents en 3ème et 2nde qui peuvent demander le redoublement en cas de non obtention de l’orientation ?"], [67, "Comment la taille et le type d’établissement influencent-ils le climat scolaire ?", "La taille de l’établissement peut affecter la gestion du climat scolaire. Par exemple, dans un grand établissement, il peut être plus difficile de maintenir une cohésion entre élèves et enseignants, et de gérer la sécurité. Je mettrais alors l’accent sur des initiatives pour renforcer le sentiment d’appartenance, comme des groupes de projets par niveau ou des équipes de tutorat. Le type d’établissement influence aussi le climat. Par exemple, les lycées professionnels rencontrent parfois plus de difficultés de gestion que les lycées généraux. Dans ce cas, des actions spécifiques comme le renforcement des équipes éducatives et des partenariats avec le monde du travail sont essentielles pour soutenir le climat."], [68, "Quelle stratégie adopteriez-vous pour impliquer les élèves dans l’amélioration du climat scolaire ?", "Impliquer les élèves est essentiel pour améliorer le climat scolaire. Je mettrais en place un conseil de vie scolaire qui regroupe des représentants des élèves, des enseignants et de la direction. Ce conseil pourrait proposer des projets pour la vie de l’établissement, organiser des activités de prévention du harcèlement, ou encore discuter des problèmes rencontrés au quotidien. Je pourrais aussi encourager des initiatives comme le tutorat entre élèves, qui favorise les liens entre classes et renforce l’entraide. En donnant aux élèves une place dans la prise de décisions, on les rend plus responsables et investis dans le bon fonctionnement de l’établissement."], [69, "Que pouvez-vous dire de l'école ouverte? =Vacances Apprenantes ?", "L’école ouverte s’inscrit dans la continuité de la réflexion menée sur les territoires éducatifs apprenant. Elle est un moyen de lutter contre les inégalités sociales et territoriales. En dehors du temps scolaire, lors des vacances, le dispositif est mis en place dans les écoles, collèges et lycées. Le dispositif implique la mobilisation d’une partie du personnel de l’établissement, notamment des enseignants. Par ailleurs, outre des heures consacrées à la consolidation des fondamentaux, des projets menés autour d’actions EAC, Sport, santé et citoyenneté peuvent être menés. Exemple : certaines académies phase de test : je découvre mon patrimoine en vélo. C’est le cas cette année de l’académie d’Orléans-Tours."], [70, "Un vol d'une somme d'argent destinée au FSE (association) a été volé dans une salle fermée a priori à clefs, que faites-vous ? Qui préside le FSE? Cette association peut-elle placer de l'argent sur un compte pour avoir plus de fonds l'année d'après ?", "En tant que Chef d’établissement, je reçois le président du foyer socio-éducatif et lui explique la situation. J’informe les personnels également, les élèves et les familles du vol en expliquant que ce vol est dommageable pour l’ensemble de la communauté scolaire. Si aucun, retour, je conseille au président du FSE (enseignants de l’établissement) de déposer plainte et l’invite à déposer les fonds sur un compte afin d’éviter que cette mésaventure ne se reproduise. Oui, un FSE peut ouvrir un compte en banque comme toute association et peut placer de l’argent."], [71, "Quelle est la définition d'un bon élève?", "- résultats scolaires\n\n- engagement dans l’établissement\n\n- relations interpersonnelles."], [72, "Vous êtes proviseure et la police vous appelle un soir pour vous prévenir qu’elle viendra le lendemain pour récupérer un de vos élèves majeurs et sans papier pour une reconduite à la frontière. Que faites-vous ?", "Je prends attache auprès de la DSDEN. Par ailleurs, je rappelle aux forces de l’ordre que s’agissant des mesures d’éloignement de jeunes étrangers en situation irrégulière, la circulaire du 19 octobre 2013 du ministère de l’Intérieur interdit aux forces de l’ordre (police, gendarmerie) d’intervenir aux abords des écoles ou durant le temps scolaire” suite à l’affaire Léonarda."], [73, "Vous êtes proviseure et un professeur de confession musulman refuse de vous serrer la main car vous êtes une femme. Que faites-vous ?", "Je le reçois dans mon bureau et lui demande quelle motivation expliquant son refus de serrer la main. Si sa réponse est justifiée par un motif religieux, je lui rappelle que nous sommes dans un établissement laïc et lui rappelle le caractère fondamental du respect de ce principe ainsi que celui de l’égalité homme femme dans la République. S’il persiste dans ce refus et que d’autres faits laissent supposer une radicalisation, j’informe le cabinet du DASEN de la situation."], [74, "Vous êtes principal d’un collège, un élève de 3ème a menacé le professeur de mathématiques avec une arme blanche. Le professeur a réussi à s’enfuir. Et l’élève est toujours dans le collège. Que faites-vous?", "Je sécurise les autres élèves et personnels. Je préviens les forces de police ou gendarmerie, la DSDEN, diffuse une annonce sur pronote et sur les téléphones portables des enseignants, enclenche le Plan particuliers de mise en sûreté (PPMS) en attendant l’intervention des forces de l’ordre.\n\nUne fois la menace écartée, réflexion à long terme :\n\n- retour sur les événements avec les élèves et infos aux parents dans le même temps\n\n- soutien de l’enseignant et des personnels\n\n- réflexion sur la situation / entretien d’explicitation pour se nourrir de l’expérience et envisager d’améliorer le PPMS"], [75, "Une professeure vient à l’établissement avec une jupe bien trop courte qui dévoile un tatouage de la cheville jusqu’au genou. Que faites-vous ?", "Je ne fais rien. Difficile de juger de la longueur d’une jupe. Auto regulation."], [76, "Des profs exercent leur droit de retrait suite à une gifle d’élève envers un professeur. Que faites-vous?", "Le droit de retrait est individuel Au même titre que les salariés du privé, les agents de la fonction publique peuvent exercer leur droit de retrait, s'ils estiment être exposés à un danger grave et imminent pour leur vie ou pour leur santé.\n\n**La réglementation**\n\nC’est par le décret n° 95-680 du 9 mai 1995 qu’ont été introduits les articles 5-6 à 5-9 dans le décret n°82-453 du 28 mai 1982 relatif à l’hygiène et à la sécurité du travail ainsi qu’à la prévention médicale permettant la mise en œuvre du droit de retrait en cas de danger grave et imminent.\n\nSelon la jurisprudence le danger grave est un danger susceptible de produire un accident ou une maladie entraînant la mort ou paraissant devoir entraîner une incapacité permanente ou temporaire prolongée. La gravité a donc des conséquences définitives, ou en tout cas longues à effacer, et importantes qui dépassent un simple inconfort.\n\n**Danger imminent**\n\nLe danger imminent peut être défini par tout danger susceptible de se réaliser brutalement dans un délai rapproché.\n\n**Danger grave et imminent**\n\nIl y a danger grave et imminent lorsque la personne est en présence d’une menace susceptible de provoquer une atteinte sérieuse à son intégrité physique ou à sa santé, dans un délai très rapproché.\n\n**La procédure**\n\nDroit d’alerte\n\nLa toute première action que doit faire l’agent est une alerte.\n\nL’enseignant signale un danger grave et imminent directement auprès de son autorité administrative ou son représentant (Inspecteur de l’Education nationale de circonscription, chef de service ou chef d’établissement).\n\nIl peut aussi avertir le représentant du CHSCT(1) de son académie.\n\n**Droit de retrait**\n\nLa mise en œuvre de la procédure d’alerte peut se faire préalablement ou simultanément à l’exercice du droit de retrait.\n\nLe droit de retrait est une action individuelle et non pas collective.\n\nA la suite de l’alerte, l’autorité administrative (Dasen) ou son représentant (IEN de circonscription ou chef d’établissement) doit procéder immédiatement à une enquête.\n\nEn cas de désaccord entre l’enseignant et sa hiérarchie sur la réalité du danger, l’autorité administrative doit réunir le CHSCT dans les 24h et informer l’inspection du travail de cette réunion.\n\nL’autorité administrative arrête les mesures à prendre. Le cas échéant, il met en demeure l’agent de reprendre son travail sous peine de mise en œuvre d’une procédure statutaire, dès lors que la situation de danger grave et imminent ne persiste plus, ou que le retrait a été considéré comme étant injustifié.\n\nSource : https://www.autonome-solidarite.fr/articles/droit-de-retrait/\n\nLe droit de retrait reste en l’état de la jurisprudence très encadré. La notion de danger grave et imminent pour la vie ou la santé des fonctionnaires est souvent difficile à établir pour justifier un arrêt collectif de travail pendant plusieurs jours après l’incident qui l’a déclenché. Dans le même temps l’administration exerce, en s’appuyant sur cette jurisprudence, une certaine pression pour la reprise du travail qui selon elle désorganise le service public et doit s’assimiler à un mouvement de grève privatif du salaire correspondant. Le jugement du tribunal administratif de Melun, à condition qu’il soit confirmé, ouvre néanmoins une brèche importante en accordant des dommages et intérêts pour un préjudice moral résultant d’un droit à l’anxiété qui est ainsi consacré. Si cette décision devait être confirmée, les communes, les départements et les régions qui ont la responsabilité des locaux pourront voir leur responsabilité engagée en cas de défectuosité matérielle constante. Quant à l’Etat il devra lui aussi revoir les moyens humains qu’il met à disposition de ses établissements scolaires pour assurer la sécurité de ses personnels. A défaut il sera régulièrement condamné au paiement de dommages et intérêts à l’instar de ce qui existe pour les détenus qui obtiennent régulièrement des dommages et intérêts en raison des conditions dégradantes dans lesquelles ils vivent au sein des établissements pénitenciers. L’affectation à compter du 1er janvier 2013 d’agents de prévention et de sécurité dans les établissements sensibles (500) est pour certains une première réponse positive de l’Education Nationale. Pour d’autres il n’est pas sûr qu’elle soit jugée comme suffisante par les personnels et par le juge.\n\n=> J'informe que le jeune sera traduit en conseil de discipline et je prononce une mesure conservatoire envers cet élève jusqu'à la date du CDD. Je reçois l'enseignant pour lui apporter mon soutien et lui propose de l'accompagner déposer une plainte s'il le souhaite. Je propose aux enseignants un temps d'échange en fin de journée pour rassurer mais en attendant dans la mesure où il n'y a pas de danger imminent et que le jeune est éloigné de l'établissement je leur demande de prendre en charge leur classe. J'informe ma hiérarchie de la situation."], [77, "Les fédérations de parents d’élèves vous interpellent sur le professeur de technologie qu’ils ont vu en état d’ébriété samedi soir sur la voie publique. Comment réagissez-vous?", "Est-ce la première fois ? Au collège, est-il déjà arrivé ivre.\n\nDans tous les cas, même si cela est hors temps de service, j’informe l’enseignant en toute transparence que des parents m’ont interpelé sur cette situation. Avec tact et humour, je le rassure mais lui rappelle qu’il doit être vigilant car il a une obligation de dignité. L’obligation de dignité signifie que le fonctionnaire ne doit pas, par son comportement, porter atteinte à la réputation de son administration (dénonciation calomnieuse, scandale public en état d’ébriété…).\n\nEnfin, si ce type de comportement est endémique, je lui demande s’il a besoin d’accompagnement.\n\nQuant aux parents, je les reçois et leur explique ma démarche.\n\nObligations des fonctionnaires\n\n1. Obligation de neutralité\n\n- Description : Le fonctionnaire doit respecter le principe de neutralité, c’est-à-dire s’abstenir de manifester ses opinions politiques, religieuses ou philosophiques dans l’exercice de ses fonctions.\n\n- Exemple : Porter des signes religieux ostentatoires est interdit pendant le service.\n\n2. Obligation de discrétion professionnelle\n\n- Description : Les fonctionnaires ne doivent pas divulguer d’informations qu’ils ont obtenues dans le cadre de leurs fonctions et qui ne sont pas destinées à être rendues publiques.\n\n- Exemple : Ne pas transmettre des informations confidentielles sur des usagers ou des collègues.\n\n3. Obligation de secret professionnel\n\n- Description : Certains fonctionnaires, notamment dans les domaines de la santé, de la justice ou de la sécurité, sont soumis à une stricte obligation de secret professionnel. Cela implique de ne jamais révéler les informations personnelles ou sensibles concernant les administrés.\n\n- Exemple : Un médecin ou un assistant social ne doit pas dévoiler les dossiers de ses patients ou bénéficiaires.\n\n4. Obligation de réserve\n\n- Description : En dehors de l’exercice de leurs fonctions, les fonctionnaires doivent faire preuve de retenue dans l’expression publique de leurs opinions, notamment s’il s’agit de critiques envers leur administration.\n\n- Exemple : Un fonctionnaire ne peut pas critiquer ouvertement son administration sur les réseaux sociaux.\n\n5. Obligation d’obéissance hiérarchique\n\n- Description : Le fonctionnaire est tenu d’exécuter les ordres reçus de son supérieur hiérarchique, sauf si ces ordres sont manifestement illégaux ou de nature à compromettre gravement un intérêt public.\n\n- Exemple : Un agent doit suivre les consignes de son chef de service, sauf si ces consignes violent la loi (par exemple, un ordre de falsifier des documents).\n\n6. Obligation de servir\n\n- Description : Le fonctionnaire doit consacrer l’intégralité de son activité professionnelle au service public. Cela inclut le respect des horaires et des missions définies.\n\n- Exemple : Un enseignant doit se présenter aux cours qui lui sont attribués et remplir ses obligations administratives.\n\n7. Obligation d’information\n\n- Description : Le fonctionnaire doit informer les usagers de leurs droits et des démarches à suivre, tout en leur garantissant un traitement impartial.\n\n- Exemple : Un agent d’accueil doit renseigner avec diligence les citoyens, sans favoritisme.\n\n8. Obligation de probité\n\nDescription : Le fonctionnaire doit agir avec honnêteté et intégrité, sans chercher à tirer un avantage personnel ou à favoriser des tiers.\n\n- Exemple : Accepter des cadeaux ou avantages en contrepartie d’un service rendu est interdit.\n\n9. Obligation de prévention des conflits d’intérêts\n\n- Description : Le fonctionnaire doit éviter de se trouver dans une situation où ses intérêts personnels pourraient interférer avec l’exercice de ses fonctions.\n\n- Exemple : Un agent public ne peut pas traiter un dossier impliquant un proche.\n\n10. Obligation de formation continue\n\n- Description : Les fonctionnaires doivent entretenir et développer leurs compétences tout au long de leur carrière, notamment par le biais de la formation professionnelle.\n\n- Exemple : Participer à des formations régulières pour s’adapter aux évolutions de leur métier."], [78, "Cas d’élève avec de bons résultats qui veut un lycée pro ? Que faites-vous ?", "Je le félicite pour ses résultats et le reçois pour qu’il m’expose son projet d’orientation. Avec la psychologue scolaire et son professeur principal, en lien avec la famille, nous évoquons les dispositifs susceptibles de développer son ambition (cordées de la réussite, campus d'excellence, compagnons du devoir et du tour de France). Enfin, je le solliciterai à N+1 pour témoigner de son parcours auprès des futurs 3èmes."], [79, "Un enseignant est régulièrement en retard. Que faites-vous ?", "Je le reçois, lui demande s’il va bien et lui fais part de mes interrogations relatives à ses nombreux retards qui ont des conséquences pour l’organisation interne de l’établissement. Si ses absences sont liées à des contraintes familiales à l’éloignement, j’en prends note. En lui rappelant ses obligations, je lui explique que nous allons essayer de trouver ensemble des aménagements au niveau de son EDT afin de tenir compte de ses contraintes. En revanche, s’il est incapable de justifier ses retards, je lui rappellerai par écrit son obligation de ponctualité. Si les retards se poursuivent, j’en informerai la DSDEN et son corps d’inspection."], [80, "Si vous êtes nommé en REP+, qui allez-vous rencontrer en premier lieu et pourquoi ?", "L’enseignant coordonnateur et l’IA-IPR référent afin de connaître les projets mis en œuvre, de fixer les modalités d’accompagnement des enseignants et des familles."], [81, "Vous devez mettre en place des journées portes ouvertes : les profs refusent de participer. Que faites-vous ? Et s’ils refusent quand même ?", "Je convoque un conseil pédagogique afin d’expliciter l’objectif de ces portes ouvertes, d’organiser ces dernières. Par ailleurs, je les interroge sur la motivation de leur refus et m’interroge sur le climat de mon établissement. Ce refus peut être le signe de tensions entre l’administration et les enseignants.\n\nCadre : jurisprudences ont confirmé qu'un enseignant absent sur cette 1/2j de portes ouvertes pouvait se voir retirer 1/30 de salaire sur ce motif."], [82, "On vient vous alerter car une élève n’a pas enlevé son voile en cours. Que faites-vous?", "Je fais venir l’élève. En présence du CPE, je lui demande pourquoi elle n’a pas enlevé son voile. Je lui demande si elle comprend le principe de la laïcité. Je lui réexplique ce dernier, lui rappelle les enjeux de ce principe et explique qu’il n’est pas contre ses croyances personnelles qui relèvent de la sphère privée. Je prends contact également avec les parents pour évoquer la situation. Si, manifestement il y a un refus de l’élève à enlever son voile, j’informe le cabinet du DASEN, sollicite le groupe valeurs de la République et fait un signalent le formulaire en ligne \"atteinte à la laïcité\" réservé à tous les personnels de l'Éducation nationale"], [83, "Un appel d’un journaliste sur votre portable qui vous demande vos commentaires sur l’agression d’un élève, que répondez-vous ?", "Au préalable, je m’assure d’avoir l’autorisation du DASEN pour apporter des éléments à la presse. Si c’est le cas, j’explique que la situation a été gérée en lien avec les services de la DSDEN, du rectorat et les services de police. Après avoir condamné cette agression, j’explique que les pensées du personnel de l’établissement et les miennes sont tournées vers l’élève et sa famille. Je rappelle que nous sommes à leur disposition pour les accompagner dans leurs différentes démarches. Enfin, je me montre rassurant en expliquant que cette situation est exceptionnelle et que nous travaillons régulièrement sur la prévention des violences en milieu scolaire. D’ailleurs, suite à cet évènement, plusieurs actions seront menées avec l’intervention de l’équipe mobile de sécurité."], [84, "Quel est votre sentiment sur l’enseignement des langues ? Comment mettre en place cet enseignement ?", "- Groupes de compétences (en 2010) pour les lycées\n\n- Ecouter, Parler, Dialoguer, Lire, Ecrire\n\n- rappel EDUSCOL :\n\nAu collège :\n\n**En classe de sixième, une deuxième langue vivante étrangère, ou régionale, peut être proposée**. Ce dispositif bilangue peut être établi sans obligation de continuité avec l’enseignement des langues proposées dans l’école d’origine. Les efforts pour développer des bilangues de continuité entre l’école et le collège ont vocation à être poursuivis. L’enseignement des deux langues en sixième dure jusqu’à 6 heures hebdomadaires.\n\n**Dès la sixième**, les collèges peuvent proposer un **enseignement de langues et cultures régionales** jusqu’à 2 heures par semaine.\n\n**À partir de la cinquième**, un enseignement de** langues et cultures européennes**, s’appuyant sur l’une des langues vivantes étrangères étudiées, peut être proposé jusqu’à 2 heures hebdomadaires.\n\nCollège LV1 : 3 h LV2 : 2 heures 30\n\nLycée : globalisé pour LVA et LVB = 5 heures 30\n\n**L’organisation en groupes de compétences est aussi privilégiée**. Ces groupes sont constitués à partir d’une évaluation des acquis linguistiques des élèves qui sont indépendants de l’organisation par classe.\n\n**Actualité EVALANG**\n\nEv@lang collège est un test de positionnement en anglais pour les élèves de troisième. Il permet de situer le niveau des élèves au regard du cadre européen commun de référence pour les langues (CECRL) avant leur entrée en classe de seconde. **Ce test concerne tous les élèves scolarisés en classe de troisième, en collège ou en lycée professionnel, qui suivent un enseignement d’anglais en langue vivante 1 ou 2 (LV1 ou LV2)** : Les différentes épreuves du test permettent de positionner les élèves du niveau A1 au niveau B1+ du CECRL dans les activités langagières de réception :\n\n- compréhension de l’oral ;\n\n- compréhension de l’écrit.\n\nLes connaissances linguistiques des élèves sont également testées : grammaire et lexique."], [85, "Quels sont les leviers sur lesquels s’appuie le chef d’établissement pour construire la DHG ? Vous allez élaborer un EDT, comment vous y prenez vous ?", "**Rappel : « La dotation globale est composée de deux enveloppes correspondant » :**\n\n- à la dotation horaire globale (DHG) composée des heures postes (HP) qui correspondent aux emplois définitifs ou provisoires d'enseignants,  et des heures supplémentaires années (HSA) ;\n\n- aux indemnités pour missions particulières (IMP).\n\nLe chef d’établissement a ainsi plutôt un rôle de ventilation des moyens de la DHG que de construction même s’il existe une phase de négociation et la possibilité pour certains dispositifs d’obtenir des moyens complémentaires.\n\nAinsi, à partir de la DHG , le chef d’établissement va procéder à la confection d’un Tableau de Répartition des Moyens (TRM). Dans cette perspective, il réunit le conseil pédagogique pour opérer les choix pédagogiques relatifs à l'emploi de la dotation dans le cadre de l'autonomie reconnue de l'EPLE (exemples groupes, options ...). Le TRM doit se faire dans :\n\n- le respect des horaires élèves réglementaires (sauf dans le cas d'une expérimentation approuvée par l'autorité académique) ;\n\n- les obligations réglementaires de service (ORS) des enseignants ;\n\n- les temps partiels."], [86, "Composition d’un CA ? Le nombre ? Les attributions ? Le rôle du CE au CA?", "Seuil de 600 élèves :\n\nEn dessous : 24 membres\n\nAu-dessous : 30 membres\n\nPrincipe du 1/3 : 1/3 = Chef, adjoint, CPE, personnes qualifiées, représentants des collectivités territoriales\n\n1/3 = représentants des personnels\n\n1/3 = représentants élèves et des parents d’élèves\n\nAttributions : rôle décisionnel sur le fonctionnement de l’EPLE\n\nCE = président qui exécute les décisions prises au CA\n\nLes instances à mettre en place sont :\n\n- la commission permanente, [sous réserve de sa création](https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000042728209) par le CA avec des délégations de compétences détaillées (les [articles R421-37 à 421-41](https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006071191/LEGISCTA000018377500/#LEGISCTA000018380704) du code de l’éducation précisent le mode d’élection ou de désignation) ;\n\n- le conseil de discipline composé de membres du CA ;\n\n- la [commission hygiène et sécurité](http://cache.media.education.gouv.fr/file/ONS/00/4/fpo_CHS_548004.pdf) obligatoire dans les lycées généraux et technologiques, lycées polyvalents, lycées professionnels, collèges avec SEGPA\n\n- la commission d’ouverture des plis, en cas de marchés publics ;\n\n- le comité d’éducation à la santé, à la citoyenneté et à l'environnement (cf. fiche [CESCE](https://www.ih2ef.gouv.fr/comite-deducation-la-sante-la-citoyennete-et-lenvironnement-cesce)) ;\n\n- le [conseil des délégués pour la vie lycéenne](https://www.ih2ef.gouv.fr/conseil-de-la-vie-lyceenne-cvl) (CVL) : les membres du CA doivent désigner leurs représentants ;\n\n- le [conseil de la vie collégienne](https://www.ih2ef.gouv.fr/conseil-de-la-vie-collegienne-cvc) (CVC) : le conseil d’administration fixe par une délibération la composition et les modalités d’élection ou de désignation des membres ;\n\n- la commission des [fonds sociaux](https://www.service-public.fr/particuliers/vosdroits/F1025) ;\n\n- la [commission éducative](https://cache.media.eduscol.education.fr/file/Sanctions_disciplinaires/85/8/09-la-commission-educative_197858.pdf) \n\n- le conseil pédagogique\n\nLe CA est convoqué en séance ordinaire, à l'initiative du chef d'établissement, au moins trois fois par an. Il peut être réuni en séance extraordinaire, sur un ordre du jour déterminé, à la demande du recteur d'académie, de la collectivité territoriale de rattachement, du chef d'établissement ou de la moitié au moins de ses membres ;\n\n- pour les lycées, le conseil des délégués pour la vie lycéenne (CVL) doit être réuni avant chaque CA. Dans les collèges, il peut être utile de réunir le conseil de la vie collégienne (CVC) avant certains CA, lorsque l’ordre du jour correspond aux éléments précisés à l’[article R421-45-2](https://www.legifrance.gouv.fr/affichCodeArticle.do?cidTexte=LEGITEXT000006071191&idArticle=LEGIARTI000033508372) du code de l’éducation.\n\nCompétences décisionnelles du CA\n\nLe CA fixe, entre autres, les principes de mise en œuvre de **l'autonomie pédagogique et éducative** dont disposent les EPLE.\n\n- l'organisation de l'établissement en classes et modalités de répartition des élèves ;\n\n- l'emploi des dotations horaires et de la mise en œuvre de l'accompagnement personnalisé dans le respect des obligations résultant des horaires réglementaires ;\n\n- l'organisation du temps scolaire et les modalités de la vie scolaire ;\n\n- la préparation de l'orientation et de l'insertion sociale et professionnelle des jeunes.\n\nIl adopte **le règlement intérieur, le projet d’établissement** et approuve le **contrat d’objectifs** conclu entre l’établissement, l’autorité académique et la collectivité de rattachement.\n\nLe CA établit chaque année un **rapport sur le fonctionnement pédagogique** de l’EPLE, le contenu de ce rapport étant étendu à la mise en œuvre des expérimentations et des contrats d’objectifs. Le rapport comporte également une partie relative à la vie scolaire, avec notamment un bilan des décisions rendues en matière disciplinaire.\n\nLe CA autorise le chef d'établissement à recruter les personnels (assistants d'éducation, contrats aidés) dans la limite des plafonds d'emploi notifiés par l'autorité académique.\n\nLe CA se prononce sur les sorties et voyages.\n\nLe CA adopte le **budget et le compte financier** de l’établissement.\n\nIl décide de la **passation de contrats et de conventions** dont le chef d’établissement est signataire, ou de l’adhésion à tout groupement d’établissements.\n\nIl se prononce sur toute question ayant trait à **l’accueil et à l’information des parents** ou aux questions relatives à** l’hygiène, la santé et la sécurité**.\n\nLe CA dispose de compétences décisionnelles et de compétences consultatives.\n\nCertains sujets sont abordés de façon incontournable selon le calendrier suivant :\n\n- octobre-novembre : CA d'installation ;\n\n- fin novembre-décembre : budget de l'année civile N+1. Le CA devra délibérer valablement au plus tard 30 jours après la date de réception de la notification de la Dotation globale de fonctionnement (DGF) (prévoir une marge pour être en mesure de convoquer à nouveau le CA dans le délai en cas de non-respect du quorum lors de la première séance) ;\n\n- février : structure pédagogique prévue et proposition d'évolution de la carte des emplois  ;\n\n- mars-avril : compte financier de l'année civile écoulée ;\n\n- juin-juillet : DHG : vote de la répartition des moyens horaires et de la structure pédagogique  si elles n'ont pas été adoptées plut tôt . Rapport relatif au fonctionnement pédagogique et matériel de l'EPLE et présentation définitive de la structure pédagogique et des services enseignants.\n\nLes votes en CA deviennent des décisions opposables dits \"actes administratifs\".  \nLes décisions prises sont des actes juridiques émis par l’administration dans un but d’intérêt général, et qui créent des droits et des obligations à l’égard des administrés.\n\nDans l’exercice de sa fonction, le chef d’établissement peut produire seul des actes administratifs : on parle alors d’actes du chef d’établissement. Ces derniers sont exécutoires dès leur transmission à l'autorité académique alors que les décisions du CA ne sont exécutoires que 15 jours après leur transmission.\n\nLe chef d’établissement transmet les actes du conseil d’administration via l’application [DEM’ACT](https://www.education.gouv.fr/modernisation-dem-act-la-dematerialisation-des-actes-des-eple-6866) à :\n\n- l’autorité académique qui effectue un contrôle de légalité de toutes les décisions ;\n\n- la collectivité territoriale de rattachement, pour certains actes dont ceux relevant du budget."], [87, "Quel est le budget de l’Éducation Nationale ?", "Plus de 63 milliards sur un budget total de 550 milliards. C’est l’un des premiers postes de dépenses de l’ETAT. Il était en hausse l’année dernière. **Après une augmentation continue de ses moyens depuis 2017, le budget du ministère continuera de progresser en 2025**. Entre 2017 et 2025, ce budget aura ainsi augmenté de 14,2 Md€, soit une hausse de près de 30 %, avec une forte accélération depuis 2022 : la hausse entre 2022 et 2025 (+ 7,8 Md€)\n\n\n\n\n\n\n\n\n\n\nDépenses moyennes par élève et par étudiant en France (2019)\n\n\nNiveaux d'enseignement\nEffectifs\nDépense moyenne par élève (euros)\nDépense globale\n(milliards d'euros)\n\n\nEnseignement pré-élémentaire\n2 463 400\n7 110\npour le premier degré : \n29,7\n\n\nEnseignement élémentaire\n4 189 400\n6 940\n\n\nCollège\n3 413 200\n8 790\npour le second degré : \n38\n\n\nLycée général et technologique\n1 619 600\n11 300\n \n\n\nLycée professionnel\n643 800\n12 740\n \n\n\nClasses préparatoires aux grandes écoles (CPGE)\n85 100\n15 710"], [88, "Comment garantissez-vous l’Inclusion des élèves ? Quels sont les enjeux pédagogiques dans l’Inclusion ? Quelles sont difficultés dans l’Inclusion ?", "Elle s’inscrit dans le cadre de la loi du 11 février 2005. Cette inclusion est rappelée dans le règlement intérieur. C’est un véritable projet d’établissement qui consiste à faire de la différence une chance.\n\nLes enjeux pédagogiques sont multiples :\n\n- différenciation, individualisation face au handicap, accompagnement et sécurisation du parcours de l’élève, autonomie et développer les compétences du scole.\n\nCela implique des temps de concertation avec la famille, les élèves, l’ERSEH (enseignant référent à la scolarisation des élèves handicapés), l’IEN ESEH, l’infirmière, l’assistante sociale, les personnels.\n\n=> accueillir, comprendre, accompagner, coopérer pour faire de l’élève pleinement inclus dans l’établissement.\n\nRappel cadre:\n\n**Ulis = l**orsque les exigences d'une scolarisation individuelle ne sont pas compatibles avec leurs troubles, les élèves en situation de handicap peuvent être scolarisés avec l’appui d’unité localisée pour l'inclusion scolaire (ULIS). Encadrés par un enseignant spécialisé, ils reçoivent un enseignement adapté qui met en œuvre les objectifs prévus par le projet personnalisé de scolarisation. Les élèves sont inscrits dans leur classe de référence.\n\n**PIAL =** « Les pôles inclusifs d'accompagnement localisés (**Pial**) sont une nouvelle forme d'organisation. Ils favorisent la coordination des ressources au plus près des élèves en situation de handicap (les aides humaines, pédagogiques, éducatives, et, à terme, thérapeutiques) pour une meilleure prise en compte de leurs besoins. » (2020)\n\nDifficultés = formation des enseignants, intégration"], [89, "Comment allez-vous travailler avec les jeunes migrants ?", "- Points réguliers avec l’éducateur et les jeunes\n\n- Concertation avec des associations\n\n- Possibilité de l’internat\n\n- Deux cas de figure :\n\n\n\n- les unités pédagogiques pour élèves allophones arrivants (UPE2A). \n\n  - accueil dans l’unité et parallèlement une partie de la semaine dans une classe ordinaire de la 6e à la 3e, sans dépasser un écart d'âge de plus de 2 ans avec l'âge de référence correspondant à ces classes.\n\n  - Ils bénéficient de l'enseignement proposé en classe ordinaire, en particulier dans les disciplines où leurs compétences sont avérées (mathématiques, langue vivante...).\n\n- les unités pédagogiques pour les élèves allophones arrivants très peu scolarisés ou pas du tout scolarisés dans leur pays d'origine avant leur arrivée en France (UPE2A-NSA).\n\n  - 1 : 'apprendre le français. La scolarisation dans l'unité pédagogique à plein temps est indispensable.\n\n  - Dans un second temps, il leur sera enseigné les bases de l'écrit, en lecture et en écriture\n\n- Projets favorisant l’acquisition des valeurs et principes de la République, des apprentissages transversaux (EAC, EPS...)"], [90, "Comment vous projetez-vous dans le quotidien de l’établissement ?", "En tant que chef d’établissement, je me vois accessible et engagé, capable de porter une vision claire et partagée par l’ensemble des équipes. Mon rôle serait de créer un cadre propice à la réussite, tant pour les élèves que pour le personnel. Au quotidien, je m’imagine veillant à ce que chaque rouage de l’établissement fonctionne efficacement : gestion des plannings, suivi des projets, résolution des situations imprévues, tout en assurant une communication fluide avec l’ensemble des acteurs.  \nJe me projette comme un chef d’établissement proche des équipes, des élèves et des familles. J’aimerais instaurer un climat de confiance, favoriser l’écoute active et promouvoir une communication transparente pour renforcer le sentiment d’appartenance de tous. Je souhaite m’impliquer pleinement dans le pilotage des projets pédagogiques en mettant l’accent sur l’innovation et l’excellence. Mon objectif est d’assurer à chaque élève un cadre éducatif enrichissant et à chaque enseignant les outils nécessaires pour exceller dans leur mission. Je me vois assurant une gestion rigoureuse des ressources de l’établissement, tout en développant des partenariats et des projets stratégiques pour pérenniser et faire évoluer l’établissement. Je souhaite incarner des valeurs telles que la bienveillance, la justice et l’engagement. Mon quotidien serait orienté vers la création d’un environnement inclusif et stimulant, où chacun peut se sentir valorisé et impliqué.\""], [91, "Comment accompagner les nouvelles pratiques d’évaluation ?", "Quelles nouvelles pratiques ? dans le cadre de la Réforme du Lycée ? l’évaluation par compétences ? Le grand oral ?\n\nMon rôle en tant que chef d’établissement serait d’accompagner les enseignants dans l’adoption des nouvelles pratiques d’évaluation en offrant des formations adaptées, en facilitant le partage d’outils et de bonnes pratiques, et en instaurant un climat favorable à l’innovation. Je veillerais également à soutenir la communication avec les élèves et les familles pour assurer une transition réussie."], [92, "Stabilité des équipes : bonne ou mauvaise chose ?", "Bonne = habitude de travail avec les familles, bonne connaissance par les enseignants des problématiques locales, de l’environnement, équipe qui a l’habitude de travailler ensemble, facilite des projets sur du long terme, reflet d’un sentiment de bien-être dans l’établissement.\n\nMauvaise= des habitudes de travail qu’il peut être compliqué de faire évoluer et donc cela implique de la prudence."], [93, "Vous êtes chef d’établissement et à la rentrée prochaine vous n’aurez plus les moyens de dédoubler les cours de langues. Que proposez-vous aux équipes ?", "A court terme, conseil d’enseignement pour exposer la situation aux collègues concernés et proposition de solutions à plus long terme :\n\n- assistant d’anglais qui peut intervenir en co-animation\n\n- recrutement d’un service civique avec un profil LVE\n\n- utilisation des temps de devoirs faits pour travailler l’oral en effectif réduit\n\nLe label « Euroscol » reconnaît l’engagement dans une dynamique d’ouverture européenne et internationale des écoles et des établissements scolaires publics ou privés sous contrat et s’inscrit dans la construction d'un Espace européen de l'éducation.\n\nPrésentation en conseil pédagogique des solutions envisagées."], [94, "Quel est le rôle de l’école dans la lutte contre la radicalisation ?", "D'après la Mission « flash » sur la prévention de la radicalisation à l’école du Mercredi 16 mai 2018.\n\nLe rôle de l’éducation nationale dans la prévention contre la radicalisation s’articule autour de trois axes :\n\n– le repérage et le signalement des jeunes qui présenteraient des signes de radicalisation ;\n\n– la prise en charge et le suivi de ces jeunes ;\n\n– la lutte contre la radicalisation cognitive qui peut envahir les esprits des enfants et adolescents : elle passe par les enseignements et la mobilisation autour des valeurs républicaines, et relève de la « prévention primaire ».\n\n\\+ Formation des enseignants"], [95, "Quels sont les points importants pour préparer l’année n+1<img src=\"media/image7.png\" style=\"width:7.40418in;height:2.3184in\" />", "- DHG et TRM\n\n- Budget\n\n- La répartition des IMP\n\n- La constitution des classes\n\n- Le choix des professeurs principaux\n\n- La formalisation de projets dans un cadre académique"], [96, "mesure de responsabilisation", "La mesure de responsabilisation a pour objectif de faire participer les élèves, en dehors des heures d'enseignement, à des activités de solidarité, culturelles ou de formation à des fins éducatives.\n\nAu cours de cette mesure, les élèves peuvent découvrir les activités de la structure d'accueil, assister ou participer à l'exécution d'une tâche.\n\nLe contenu de la mesure de responsabilisation doit respecter la dignité de l'élève, ne pas l'exposer à un danger pour sa santé, et demeurer en adéquation avec son âge et ses capacités.\n\nLa mesure de responsabilisation est mise en place pour éviter un processus de déscolarisation tout en permettant à l'élève de témoigner de sa volonté de conduire une réflexion sur la portée de son acte tant à l'égard de la victime que de la communauté éducative. Cette mesure est destinée à aider l'élève à prendre conscience de ses potentialités et à favoriser un processus de responsabilisation."], [97, "l’échelle des sanctions", "- **avertissement**\n\n- **blâme**\n\n- **mesure de responsabilisation**\n\n- **exclusion temporaire de la classe (max 8 jours)**\n\n- **exclusion temporaire de l’établissement (max 8 jours)**\n\n- **exclusion définitive de l’établissement**"], [98, "PPRE cela consiste en quoi ?", "Programme personnalisé de réussite éducative = sur proposition du Chef d’établissement face au constat d’une maîtrise insuffisante du socle dans plusieurs domaines. **Ce programme permet de coordonner une prise en charge personnalisée** et peut intervenir à n'importe quel moment de la scolarité obligatoire. Il diversifie les aides proposées qui vont de la différenciation pédagogique dans la classe aux aides spécialisées."], [99, "famille de métiers GRETA", "Elles participent à la transformation de la voie professionnelle. Mises en place depuis septembre 2019. Au total 14 : exemple, métiers de la construction durable, du bâtiment et des travaux publics / Métiers de la gestion admin, du transport et de la logistique / Métiers de la relation client / Métiers de l’hôtellerie-restauration.\n\nLes groupements d’établissements (Greta) sont les structures de l'éducation nationale qui organisent des formations pour adultes dans pratiquement tous les domaines professionnels."], [100, "que pensez-vous de la durée des contrats AED?", "Le contrat des assistants d'éducation est conclu pour une durée maximale de 3 ans dans la limite d'un engagement de 6 ans maximum. Il couvre les périodes de vacances scolaires.\n\nLa durée de 3 ans permet d’instaurer une forme de stabilité dans l’équipe de vie scolaire. Renouvelable une fois, pour trois ans, cette durée est suffisante pour assurer la transmission de pratiques. C’est aussi l’occasion de construire avec les AED un projet professionnel (cf professionnalisation)"], [101, "Vous suivez 2 classes de 6e , 2 élèves cumulent plusieurs dys. Ils ont 0/20 en H/G ts les 2. Que faites-vous? L’enseignant vous dit les phrases sont incompréhensibles, trop de fautes, trop lents je ne suis pas formé à ça j’applique les mêmes grilles de notation qu’avec les autres. Que répondez-vous?,", "J’écoute ses difficultés, lui propose de se rapprocher de son corps d’inspection, de formateurs disciplinaires qui proposent des exemples d’activités différenciées sur le site disciplinaire et lui rappelle que dans le cadre de son référentiel de compétences c’est une obligation pour lui d’adapter ses supports. Enfin, je lui rappelle la loi du 11 février 2005."], [102, "Que savez-vous des conseils de classe en Terminale? Qu'en pensez-vous?", "Les conseils de classe de terminale sont le moment de poursuivre le travail lié à l'Orientation qui a été amorcé depuis la classe de seconde avec les élèves.\n\n=> Lors du 1er trimestre\n\n- l'élève et sa famille renseignent une fiche de vœux de poursuite d'études qui fera l'objet d'échange et de conseil.\n\n=>Le conseil de classe du 2nd trimestre\n\n- sera axé sur la fiche avenir que les PP doivent compléter (4 critères : autonomie, engagement citoyen...de peu démontré a très satisfaisant).\n\n- Le CE a également pour chaque élève et chacun des vœux une appréciation à indiquer.\n\n- Prévoir un temps plus long pour ces conseils de classe même si les PP ont réalisé ce travail en amont car il y a également le bilan du 2nd trimestre à ne pas négliger dans la mesure où les bulletins des élèves vont être remontés sur parcoursup.\n\n=> 3eme trimestre est non seulement important pour l'obtention du baccalauréat mais aussi en cas de réorientation post bac car cette fois ci parcoursup demandera également le 3eme bulletin de terminale ce qui n'est pas le cas en terminale."], [103, "Comment intégrer CPE et Aed dans la politique pédagogique de l'établissement?", "- Conseil pédagogique\n\n- Constitution des classes\n\n- CVC/CVL\n\n- Projets transversaux autour des valeurs de la République\n\n- Devoirs faits\n\n- AP"], [104, "Dans un lycée de centre-ville, des élèves issus de quartiers défavorisés sont accueillis, comment inciter les professeurs à faire plus d'efforts d'explicitation pour les intégrer?", "- Explicitation des objectifs auprès des collègues : rappel d’une mission essentielle => éducation de tous et pour tous/ présentation des chiffres PISA (la France fait partie des 4 pays où les inégalités sociales pèsent le plus dans la réussite des élèves.\n\n- Mise à disposition de moyens dans le cadre de devoirs faits\n\n- stage établissement sur la différenciation"], [105, "Quels critères prendre en compte pour constituer les classes? Qui constitue les classes? Quand?", "- Les options, les projets pédagogiques, la mixité, les dispositifs particuliers, les indications données par les écoles ou collèges de secteur\n\n- juin juillet : CPE, professeurs principaux, CDE"], [106, "Dans le même style que la question précédente : comment constituer les équipes pédagogiques? Sur quels critères?", "- Projets pédagogiques\n\n- Souhaits des enseignants exprimés en conseil d’enseignement et conseil pédagogique\n\n- Point de vigilance sur les classes à examen (profs fragiles ou en difficultés)"], [107, "Dans des établissements où le ramassage scolaire est important et l'amplitude d'une journée grande, comment organisez-vous le temps scolaire? Est-ce un problème? Un levier?", "Non, au contraire, cela peut être un levier avec un projet d’établissement autour de devoirs faits et de la continuité des apprentissages entre la classe et hors la classe.\n\n=> D’où une réflexion à avoir sur la constitution des EDD avec des créneaux de devoirs faits dans la journée"], [108, "Pour le Chef d’Établissement, quels sont les désagréments du PPCR ? Les choses intéressantes ?", "Je ne vois pas de « désagréments » même si les entretiens individuels qui étaient liés à la note administrative pouvaient être des moments de dialogue intéressants. Il est important toutefois de poursuivre ces derniers dans d’autres cadres.\n\nAvantage = pleinement associé à l’IA-IPR avec en particulier un regard croisé et un entretien.\n\nC’est un outil de gestion de ressources humaines pour le CE. Ce temps d’échange est bénéfique pour l’enseignant => valorisation des compétences\n\nBénéfique pour l’EPLE => capitalisé les compétences des enseignants dans le projet de l’EPLE\n\n=> Dynamique d’un établissement apprenant"], [109, "Comment organiser les liaisons avec les collèges de secteur ?", "- Rapprochement avec les autres CE\n\n- Mise en place d’un coordonnateur liaison lycée/collèges\n\n- Portes ouvertes\n\n- Participation aux forums\n\n- Présentation lors des soirées de formation dans les établissements\n\n- Projets inter établissements (Exemple TREAC : territoire et résidence d’éducation artistique et culturelle, cité éducative : Le programme des Cités éducatives vise à renforcer les prises en charge éducatives pendant le temps scolaire et périscolaire. Il a comme objectif principal d’accompagner au mieux chaque parcours éducatif de la petite enfance jusqu'à l'insertion professionnelle, dans tous les temps et espaces de vie. Il s’agit de fédérer tous les acteurs éducatifs - services de l'État, collectivités, associations et habitants - des territoires en politique de la ville qui en ont le plus besoin en apportant des financements nouveaux.)"], [110, "Comment se pilote un conseil école-collège ? Au sein du collège qui peut y participer ?", "Conseil école et collège : en lien avec l’IEN de circonscription, le CE.\n\n**La composition du conseil école-collège**\n\nLe conseil école-collège comprend :\n\n- le principal du collège ou son adjoint\n\n- l'inspecteur de l'éducation nationale chargé de la circonscription du premier degré ou son représentant\n\n- des personnels désignés par le principal du collège sur proposition du conseil pédagogique du collège\n\n- des membres du conseil des maîtres de chacune des écoles du secteur de recrutement du collège"], [111, "Quelle est la personne référentes dans les projets du cycle 3 ?", "Coordonnateur de cycle bénéficiant d’une IMP\n\nLe professeur missionné est bien identifié par les enseignants des différentes écoles et devient un interlocuteur privilégié pour monter un projet. Il est le premier contact avec le collège pour les extérieurs, mais il est aussi celui qui, au sein du collège, met en relation avec les écoles. Personnel référent, donc. Comme il assiste à toutes les réunions (conseil école-collège, conseil de cycle 3, commissions d’harmonisation CM2-6e), c’est aussi la mémoire de ce qui s’est fait dans telle ou telle école, de ce qui s’est dit de tel ou tel élève. Cette vue globale en fait un passeur d’informations efficace qui évite les pertes et la dilution qu’entrainerait la multiplicité des intervenants.\n\nEnfin, sa position d’enseignant a été particulièrement facilitatrice, quand il s’est agi de mettre en place des observations croisées entre les enseignants du premier et du second degré."], [112, "Vous êtes principal adjoint dans un collège en charge du suivi des classes de 3ème, les professeurs vous disent qu’ils n’arrivent pas à faire la validation des compétences au 3ème trimestre en cycle 4, que faites-vous ?", "Je réuni une réunion de l’équipe de 3ème afin de comprendre leur problématique. S’agit-il d’un problème technique ou d’un refus d’évaluer par compétences. Par ailleurs, je m’interroge sur ma propre communication. Comment se fait-il qu’il faille attendre le 3ème trimestre pour avoir connaissance de cette problématique.\n\nJe rappelle aux enseignants les modalités du brevet et l’obligation d’avoir un positionnement sur les compétences :\n\n**L'évaluation du socle commun représente 400 points.**\n\nLa maîtrise de chacune des huit composantes du socle commun est appréciée lors du conseil de classe du 3e trimestre de la classe de 3e :\n\n- Maîtrise insuffisante (10 points)\n\n- Maîtrise fragile (25 points)\n\n- Maîtrise satisfaisante (40 points)\n\n- Très bonne maîtrise (50 points)\n\n**Les épreuves de l'examen représentent 400 points.**\n\n- Sont évalués sur 100 points :\n\n- le français\n\n- les mathématiques\n\n- Sont évaluées sur 50 points :\n\n- l'histoire-géographie\n\n- les sciences (physique-chimie, sciences de la vie et de la Terre, technologie)\n\n- L’épreuve orale est évaluée sur 100 points\n\n**Acte II du Choc des savoirs : une réforme du brevet pour un diplôme renforcé**\n\n- Dès juin **2025**, le diplôme national du brevet sera restructuré avec des notes séparées pour l’histoire-géographie et l’enseignement moral et civique (EMC), et introduira la mention \"Très bien avec félicitations du jury\".\n\n- En juin **2026**, le brevet verra le poids de ses épreuves terminales renforcé\n\n- Dès la session **2027**, il deviendra un passage obligatoire pour l’entrée en seconde."], [113, "Vous recevez une enseignante elle découvre la liste de noms et dans cette classe elle dit « y a que des noirs et des arabes » ? Vous la laissez entrer dans l'établissement ? Elle prend sa classe ? Que faites-vous?", "Je l’invite à mesurer ses propos et lui demande d’expliciter sa pensée. Je lui rappelle son obligation de neutralité et ses obligations professionnelles. En fonction de son attitude, je lui précise que je ne tolérerai aucune autre remarque raciste car contraint sinon de formuler une observation par écrit et d’en informer le corps d’inspection et la DSDEN."], [114, "votre établissement est centre d'examen, une élève de l'établissement se présente voilée alors qu'elle ne l'a jamais fait. Malgré votre demande et rappel au principe de laïcité elle ne veut pas le retirer, elle est candidate au même titre que les candidats libres, certains d'ailleurs portant une kippa.", "Le Vadémécum sur la laïcité rappelle que seuls les candidats libres peuvent porter des signes religieux ostensibles\n\nDans le cas présent, la réflexion ne semble pas été menée en amont. Concernant l’élève de l’établissement, je lui rappelle que le règlement intérieur s’applique, même durant les examens et que les autres candidats n’ont pas le même statut. Néanmoins, afin d’éviter de perturber la cession d’examen, je laisse l’élève composer mais prévient dans le même temps la DSDEN face à cette situation. Une fois les examens terminés, je prends le temps de la recevoir avec ses parents et lui demande d’expliciter sa démarche. Je lui rappelle le principe de laïcité et la raison pour laquelle les candidats libres avaient le droit de porter des signes religieux.\n\nJe mets à profit cette expérience pour l'année suivante, dès lors que je sais que nous allons recevoir des candidats du privé susceptibles de porter signes d'appartenance religieuse, je demanderai aux PP, CPE ou moi-même d'en informer les élèves en amont pour éviter tout malentendu."], [115, "Comment géreriez-vous une augmentation des incidents de violence dans votre établissement ?", "Face à une augmentation des incidents de violence, je commencerais par analyser les types et les causes de ces incidents, en m’appuyant sur les rapports de Sivis et les retours du personnel. Je mettrais en place des interventions ciblées comme des campagnes de sensibilisation, des formations en médiation pour les élèves et les enseignants, et un suivi individuel pour les élèves les plus impliqués. Il est également essentiel d’avoir une approche collaborative avec les familles et d’informer les partenaires extérieurs (comme les forces de l’ordre et les services sociaux) lorsque cela est nécessaire. En tant que chef d’établissement, je veillerais à ce que chaque incident soit traité avec sérieux pour prévenir toute escalade."], [116, "Que pouvez-vous dire de la voie professionnelle?", "Elle a été transformée à partir de 2018 avec plusieurs enjeux :\n\n- la sécurisation des parcours des élèves (familles de métiers, obligation de formation de 16 ans à 18 ans)\n\n- accompagnement des élèves avec AP\n\n- approche transversale renforcée avec la co-intervention\n\n- importance du chef d’œuvre\n\n- favoriser l’insertion professionnelle\n\n- une insertion professionnelle immédiate ou une poursuite d'études réussie. Elle valorise l'enseignement professionnel auprès des acteurs économiques, par la recherche d'une meilleure adéquation entre formation et compétences métiers attendues.\n\n- rôle de la Région\n\n- France compétences"], [117, "Un arbre au milieu de la cour menace de s'effondrer, votre réaction? »", "Sécurisation de l’espace concerné. Contact avec la collectivité territoriale de rattachement. Si l'accès à la cour est trop dangereux pour les élèves, la vie scolaire doit prévenir les élèves que la la récréation aura lieu en classe ou dans une autre partie de la cour pour des questions de sécurité. Enfin, je fais le nécessaire pour que l’arbre soit coupé le plus rapidement possible."], [118, "Quels sont les grands changements apportés par la réforme du collège de 2015?", "- Nouveau socle 5 domaines, 8 compétences\n\n- Nouvelles épreuves au brevet = sciences/techno\n\n- importance de l’oral\n\n- accent mis sur les tâches collaboratives, les sciences cognitives\n\n- EPI / AP"], [119, "Un professeur refuse de corriger les épreuves de l'ASSR, avançant que ce n'est pas à lui de le faire. De plus, il trouve que la passation de ces épreuves lui fait perdre du temps de classe. Comment réagissez-vous?", "L’ASSR (Attestation de sécurité soutière) s’inscrit dans le cadre du parcours citoyen des élèves. Elle ne concerne pas une discipline en particulier. Elle rentre dans le cadre de ses obligations de service. Enfin, je le rassure en lui disant que je veillerai l'an prochain à faire tourner l'équipe de correcteurs (ils sont désignés par le CE mais on peut aussi faire appel au volontariat) et que cette épreuve ne dure, suivant les textes officiels, que 20 minutes (auxquelles s'ajoute une correction qui peut être faite par un autre enseignant)\n\nASSR1 : 5ème\n\nASSR2 : 3ème"], [120, "Est-ce que vous connaissez le café des parents ? Qu'est-ce que le dispositif OEPRE ?", "Le café des parents est un temps d’échange au sein de l’établissement sur une thématique de co-éducation : exemple l’éducation au numérique avec une thématique sur les adolescents et les écrans. Le café des parents peut s’insérer dans la cadre de la mallette des parents.\n\nLargement utilisée depuis 2010 dans les écoles et les établissements, la Mallette des parents est enrichie chaque année en proposant aux familles et à toutes les équipes éducatives des ressources, des outils et des conseils pour renforcer le lien de confiance école-parents.\n\nL'objectif de la Mallette des parents est d'inviter toutes les familles à l'école et au collège afin d'expliciter les enjeux de la scolarité, l'organisation de l'École, le rôle de chaque interlocuteur, le déroulement des apprentissages, les savoirs à acquérir ou encore les grandes étapes du suivi médical de l'enfant.\n\n**La Mallette des parents permet :**\n\n- l'organisation à l'école ou au collège de réunions avec les parents ;\n\n- la mise à disposition des parents et des équipes éducatives de ressources permettant de trouver des réponses à l'ensemble des questions qu'ils peuvent se poser.\n\n**OEPRE** = ouvrir l’école aux parents pour la réussite des élèves. Dispositif (depuis 2008) en particulier à destination des parents et élèves allophones. Les formations gratuites, d'une durée comprise entre 60 et 120 heures annuelles, sont proposées à des groupes de 8 à 15 personnes environ **au sein d'écoles, de collèges ou de lycées**. Elles sont **organisées pendant la semaine, à des horaires permettant d'accueillir le plus grand nombre de parents** par des enseignants formés ou certifiés FLS, des formateurs FLE ou des associations. Un espace d'apprentissage pour les parents étrangers primo-arrivants autour de l'enseignement du français, de la découverte des valeurs de la République et du fonctionnement du système scolaire. Chaque année un bilan est effectué et recueilli par la CASNAV, pour la demande de renouvellement ou d’ouverture, il faut demander en mai-juin."], [121, "Définissez la laïcité et les principes qui en découlent", "Liberté de croire ou de ne pas croire. La religion relève de la sphère privée. C’est un principe inscrit dans la constitution de 1958. Elle est liée au principe de la neutralité de l’Etat et assure l’égalité entre les citoyens.\n\nI. La consécration de la laïcité par l’article 1er de la Constitution\n\nLe premier alinéa de [l’article 1er de la Constitution de 1958](https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/texte-integral-de-la-constitution-du-4-octobre-1958-en-vigueur#article-premier-591) prévoit que *« la France est une République indivisible, laïque, démocratique et sociale. Elle assure l’égalité devant la loi de tous les citoyens, sans distinction d’origine, de race ou de religion. Elle respecte toutes les croyances (…) »*. Trois précisions ont été apportées par le Conseil constitutionnel :\n\n- *« le principe de laïcité figure au nombre des droits et libertés que la Constitution garantit »* \n\n- En tant que principe organisationnel de la République, la laïcité implique « la neutralité de l’État », ainsi que le principe selon lequel « la République ne reconnaît (…) ni ne salarie aucun culte »\n\n- « le principe de laïcité impose notamment le respect de toutes les croyances, l’égalité de tous les citoyens devant la loi sans distinction de religion et que la République garantisse le libre exercice des cultes \n\n- *« l’organisation de l’enseignement public gratuit et laïque à tous les degrés est un devoir de l’État »*.\n\nEn tant que chef d’établissement, il est essentiel de rappeler les principes qui découlent de la laïcité, particulièrement dans le cadre scolaire :\n\n1.  **Neutralité des institutions** : L’école publique est un espace neutre, où aucun enseignement, discours ou comportement ne doit favoriser ou discriminer une croyance, une religion ou une conviction philosophique.\n\n2.  **Liberté de conscience** : Chaque élève, parent et personnel de l’établissement a le droit de croire ou de ne pas croire, de pratiquer ou de ne pas pratiquer une religion. Cette liberté s’exerce dans le respect du cadre légal et des règles de l’établissement.\n\n3.  **Égalité** : La laïcité assure l’égalité de tous devant la loi, quelles que soient leurs croyances ou leurs origines. À l’école, elle vise à rassembler tous les élèves autour des valeurs républicaines, en les préservant des divisions religieuses ou communautaires.\n\n4.  **Respect des règles communes** : Dans le cadre scolaire, les manifestations d’appartenance religieuse sont limitées afin de garantir le bon fonctionnement de l’établissement. Cela inclut l’interdiction des signes religieux ostensibles pour les élèves et l’obligation de neutralité pour les personnels.\n\nAinsi, la laïcité à l’école vise à créer un cadre propice à l’apprentissage, au vivre-ensemble et à la formation de citoyens éclairés et respectueux des valeurs de la République. C’est une condition essentielle pour promouvoir un climat serein et inclusif dans l’établissement.\n\n**121. Quelle est la mission des EMAS? Qu'est-ce qu'un assistant chargé de la prévention et de la sécurité ?**\n\nÉquipe mobile académique de sécurité. Elle intervient pour :\n\n- Prévenir les situations de violence en milieu scolaire en (in)formant les personnels, les élèves et le cas échéant leurs représentants légaux.\n\n- Sécuriser les EPLE, notamment par le biais du diagnostic de sécurité et de la médiation.\n\n- Accompagner, soutenir et conseiller tous les personnels, élèves et familles en situation de crise.\n\n=> Quelle que soit son action, l'EMAS se place sous l'autorité fonctionnelle du chef d'établissement lorsqu'elle intervient\n\nEDUSCOL :« Les assistants chargés de prévention et de sécurité (APS) sont mis en place afin d'augmenter, dès la rentrée scolaire 2012, le nombre des adultes présents dans les établissements scolaires les plus exposés aux phénomènes de violence et dont le climat nécessite d'être particulièrement amélioré. »"], [122, "À quelle fréquence réunissez-vous les conseils d'enseignent ? Pourquoi ? Et le conseil pédagogique ? Qui le compose ?", "Généralement, le conseil d’enseignement est réuni entre deux et trois fois par an. Je les réunirai en janvier-février pour aborder la DHG et aborder les besoins horaires, les choix pédagogiques de l’équipe. Nouvelle convocation en juin pour préparer la rentrée prochaine.\n\nLe conseil d'enseignement, qui réunit les professeurs d'une même discipline, réfléchit à la mise en œuvre du programme de cycle, aux besoins de mise en œuvre de l'accompagnement personnalisé dans la discipline et à l'inscription de la discipline dans les huit thématiques des enseignements pratiques interdisciplinaires.\n\nLe conseil pédagogique, présidé par le chef d'établissement, réunit au moins un professeur principal de chaque niveau d'enseignement, au moins un professeur par champ disciplinaire, un conseiller principal d'éducation et, le cas échéant, le chef de travaux. Il a pour mission de favoriser la concertation entre les professeurs, notamment pour coordonner les enseignements, la notation et l'évaluation des activités scolaires.. Il favorise la concertation entre les enseignants des différentes disciplines et des différentes équipes de classe, et prépare la partie pédagogique du projet d'établissement. Il est consulté sur la préparation de l'organisation des enseignements. Il formule des propositions quant aux modalités de l'accompagnement personnalisé - soutien, approfondissement, méthodes de travail - et de regroupement des élèves, que le chef d'établissement soumet ensuite au conseil d'administration. Il est saisi pour avis sur l'organisation des enseignements pratiques interdisciplinaires. Le conseil pédagogique se réunit au moins trois fois par an et en tant que de besoin à l'initiative de son président ou à la demande de la majorité de ses membres\n\nLe président fixe l'ordre du jour, les dates et heures des séances du conseil. Il convoque les membres du conseil pédagogique au moins huit jours avant la séance, ce délai pouvant être ramené à trois jours en cas d'urgence. Le chef d'établissement désigne les membres du conseil pédagogique ainsi que leurs suppléants éventuels. Les équipes pédagogiques ont quinze jours après la rentrée scolaire pour proposer, parmi les personnels volontaires, les enseignants susceptibles d'être désignés à ce titre. A défaut de proposition dans ce délai, le chef d'établissement choisit les membres du conseil pédagogique parmi les enseignants de l'établissement.\n\nLe chef d'établissement informe de cette désignation le conseil d'administration lors de la réunion qui suit. Il porte la composition du conseil pédagogique à la connaissance de la communauté éducative par voie d'affichage.\n\nLors de sa première réunion, le conseil pédagogique établit son règlement intérieur.\n\nEn cas d'absence ou d'empêchement du chef d'établissement, le conseil pédagogique est présidé par le chef d'établissement adjoint."], [123, "Le service vie scolaire vous fait remonter les faits suivants : les professeurs ne viennent pas chercher les élèves à l'heure alors que les surveillants les font ranger à leur emplacements habituels; ce retard excite les élèves et crée une tension chez les surveillants, que faire ?", "- Ecoute\n\n- rappel général dans une note de service sur la nécessité d’être devant les élèves à la deuxième sonnerie afin de faciliter le bon fonctionnement de l’établissement\n\n- présence visible dans la cour du CE ou adjoint\n\n- réception des enseignants qui seraient concernés et persisteraient dans ces retards."], [124, "Quels leviers pour motiver les équipes et s’investir sur un projet?", "- IMP\n\n- HSE\n\n- aménagement de l’EDT\n\n- obtention de subventions, de labels.\n\n- Communication, valorisation et ancrage dans le territoire de l’établissement."], [125, "Comment est structuré le budget d’un établissement ?", ""], [126, "Communiquez-vous la répartition des HSE? Comment pilotez-vous ce volant d’heures?", "**Rappel HSE : Les heures supplémentaires effectives correspondent à des heures effectuées ponctuellement. Tous les enseignants exerçant dans un établissement du 2d degré sont éligibles aux HSE.**\n\n**Leur rémunération correspond à 1/36e d’une HSA majorée de 25 %.**\n\n**Elles sont payées en fonction du nombre réalisé. Le chef d’établissement effectue un décompte mensuellement.43 euros pour 1 certifié classe normale**\n\nLa répartition des HSE n’a pas à être communiquée. De plus, elle est évolutive dans l’année en fonction des enveloppes attribuées notamment dans le cadre de certains dispositifs comme devoirs faits.\n\nEn revanche, il me paraît judicieux d’être transparent avec les enseignants et d’expliciter les priorités qui seront abondées par ces HSE. De même, je demanderai mensuellement aux enseignants de me notifier les heures supplémentaires qu’ils ont effectuées et qui ne rentrent pas dans le cadre de leur IMP ou HSA. Enfin, chaque mise en paiement donnera lieu à une notification écrite aux bénéficiaires."], [127, "Différences entre projet d’établissement et contrat d’objectif ?", "fil IH2EF : \"Le contrat d'objectifs, tel que défini par l'article R421-4 du code de l'éducation, ne retient que les objectifs à atteindre par l'établissement pour satisfaire aux orientations nationales et académiques et mentionne les indicateurs qui permettront d'apprécier la réalisation de ces objectifs. Il est moins large que le projet d'établissement.\n\nL'article R421-20 précise que le conseil d'administration, sur le rapport du chef d'établissement, adopte le projet d'établissement et approuve le contrat d'objectifs. Cependant, cette délibération ne figure pas parmi les délibérations énumérées aux articles R421-54 et R421-55, dont le caractère exécutoire est subordonné à la transmission à l'autorité académique.Depuis la loi d'orientation et de programmation pour la refondation de l'École de la République, le contrat peut être une convention tripartite à l'initiative de la collectivité territoriale (article R421-4 du code de l'éducation).\""], [128, "Quels partenaires vous épaulent pour l’orientation?", "« Pour favoriser les conditions d'émergence du projet personnel de l'élève, le CE peut mobiliser : parents, équipes éducatives (les PP, les Psy-EN, le prof doc, prof référent), le CIO, collectivités locales, organismes professionnels).\n\n je rajouterai mlds , réseau foquale et même la mission locale avec qui il est possible d organiser des ateliers découverte des métiers par exemple »"], [129, "Qu’avez-vous mis en place pour remotiver les élèves? Pas seulement les décrocheurs.", "- utilisation du numérique\n\n- escape games\n\n- pédagogie de projets (EAC, EMC)\n\n- Voyages et sorties scolaires"], [130, "Quelles sont vos qualités et vos défauts? Donnez-nous 3 qualités et 3 défauts", "Qualités :\n\n- organiser\n\n- l’écoute, bienveillante\n\n- adaptabilité\n\nDéfauts :\n\n- perfectionniste\n\n- prudence excessive : Vous prenez souvent le temps de bien analyser toutes les options avant de prendre une décision\n\n- trop impliqué : Vous vous investissez tellement dans votre rôle que vous pouvez, à certains moments, avoir du mal à déconnecter."], [131, "Un professeur d’EPS vend des chaussures aux élèves à prix cassés sur le parking de l’établissement. Que faîtes-vous ?", "- Rappel du principe de neutralité et d’interdiction de se livrer à des pratiques commerciales dans un établissement scolaire.\n\n- discussion pour comprendre\n\n- en fonction de la réponse = avertissement écrit (copie DPE)"], [132, "Citez un droit opposable en matière d’éducation.", "Un **droit opposable** est un droit garanti par la loi ou la constitution, qui peut être **exigé par un individu** et que l'État ou une autre entité a l'obligation de respecter ou de mettre en œuvre. Si ce droit n'est pas respecté ou réalisé, l'individu concerné peut saisir une **autorité administrative ou judiciaire** pour en obtenir l'application.\n\nUn droit opposable en matière d’éducation est le **droit à l’éducation**, garanti par plusieurs textes juridiques en France et à l'international.\n\n**Exemple concret : Le Droit à la Scolarisation des Enfants Handicapés**\n\nCe droit, reconnu par la **loi du 11 février 2005 pour l'égalité des droits et des chances, la participation et la citoyenneté des personnes handicapées**, est **opposable**. Cela signifie que toute famille peut exiger, si besoin par voie judiciaire, que l’État mette en œuvre les moyens nécessaires pour scolariser un enfant en situation de handicap.\n\n**Caractéristiques du droit opposable :**\n\n1.  **Reconnaissance légale** :\n\n    - Ce droit est inscrit dans les textes de loi, comme le **Code de l'Éducation** (article L. 112-1).\n\n2.  **Obligation pour l’État** :\n\n    - L'État a l’obligation de prendre les mesures nécessaires, comme :\n\n      - La mise à disposition d'un **Accompagnant d'Élève en Situation de Handicap (AESH)**.\n\n      - L'adaptation des locaux et des matériels pédagogiques.\n\n      - La proposition d'une scolarisation en milieu ordinaire ou en établissement spécialisé.\n\n3.  **Recours possible** :\n\n    - En cas de non-respect de ce droit, les familles peuvent saisir les juridictions compétentes (par exemple, le tribunal administratif) pour contraindre l'État à respecter cette obligation."], [133, "Que mettez-vous derrière les mots : Animer, piloter, administrer, impulsé.", "Animer = faire vivre, donner du rythme,\n\npiloter = donner le cap, rappeler les attendus\n\n/ livrables / objectifs,\n\nadministrer = gérer les aspects réglementaires et financiers permettant la bonne marche de l'eple,\n\nimpulser = faire preuve d'initiative ou la susciter chez les personnels pour que les actions permettant l'atteinte des objectifs fixés ."], [134, "Que savez-vous de l’organisation du lycée actuellement ? Citez des enseignements d’exploration, des filières technologiques.", "- Fin des filières\n\n- Les élèves de la voie générale choisissent d’approfondir progressivement leur p
