<script id="d" type="application/json">[[1, "Sur quels travaux de recherche le Chef d'établissement et le Ministre se basent-ils pour mettre en œuvre leur politique ?", "Sur les grandes enquêtes internationales (PISA, Pirls pour le niveau de lecture), le conseil scientifique de l’éducation nationale (2018), Le Centre national d'étude des systèmes scolaires (CNESCO, en 2013 installé en 2014 sous Peillon) les rapports de l’inspection générale, les recherches dans le domaine des sciences cognitives, le conseil d’évaluation de l’Ecole (26 juillet 2019). Le Chef d’établissement doit également faire de la veille lui permettant de diffuser des ressources utiles à son équipe pédagogique."], [2, "Quelles sont les mesures que vous prenez pour promouvoir la mixité ?", "Avant de répondre, je rappellerai que la mixité peut recouvrir plusieurs dimensions.\n\n- **La mixité peut désigner la présence d'individus des deux genres sexuels dans un groupe; elle renvoie à l’égalité filles-garçons.** Ce principe est inscrit dans le code de l’éducation. Extrait du site EDUSCOL : ” L’égalité des filles et des garçons est un principe fondamental inscrit dans le code de l'éducation.\n\n- Elle encourage un climat scolaire serein, assure un cadre protecteur - sans comportements ni violences sexistes - et elle favorise la mixité et l'égalité en matière d'orientation”.\n\n**L’Égalité entre les femmes et les hommes : \"grande cause nationale\" du quinquennat 2023/2027**\n\n**Le comité interministériel du 8 mars 2018 a défini les mesures clés pour transmettre et diffuser la culture de l'égalité : **\n\n- **Agir auprès de la communauté éducative :**\n\n- Un \"référent Égalité\" dans chaque établissement scolaire.\n\n- Formation de l’ensemble de la communauté éducative à la déconstruction des préjugés et à la prévention du harcèlement et des violences sexistes et sexuelles.\n\n- **Agir auprès des parents :**\n\n- Mise à disposition d'outils relatifs à l’égalité filles-garçons, les usages d’Internet et du numérique et la lutte contre le cyber-harcèlement dans [la Mallette des parents](https://mallettedesparents.education.gouv.fr/).\n\n- **Agir auprès des élèves :**\n\n- Instaurer la parité dans les instances représentatives des élèves.\n\n- Promouvoir la mixité des filières et des métiers, en se fixant des objectifs chiffrés par filière et en utilisant le stage d’orientation de 3ème pour faire découvrir des filières peu mixtes.”\n\n- **La mixité peut également renvoyer à la mixité sociale.** Il peut être plus difficile de jouer sur ce levier en raison des bassins de recrutement. Au quotidien : favoriser les actions permettant le vivre ensemble ; améliorer l’image de l’établissement en cas de fuite d’effectifs vers des établissements privés (cela passe par des choix pédagogiques donnant une identité et une spécificité à l’établissement, une communication externe accrue donnant de la visibilité au projet de l’établissement)"], [3, "Des élèves s’enfuient de l’internat et montent une barricade : Que faites-vous ?", "Je m’assure que personne n’est en danger, sécurise le périmètre. Je me rapproche de la vie scolaire, AED afin d’identifier les élèves concernés et le problème, je cherche à comprendre et me rapproche des élèves afin d’engager un dialogue. Parallèlement, je préviens les parents. Si cela ne suffit pas, je préviens la DSDEN et le référent police."], [4, "Vos enseignants ne veulent pas entendre parler du conseil pédagogique. Que faites-vous pour le mettre en place malgré tout ?", "En premier lieu, j’essaie de comprendre leur refus (emplois du temps ? contraintes personnelles ? refus pur et simple ?). Je leur rappelle que le conseil pédagogique (de mémoire) a été instauré en 2005 dans tous les établissements. Je m’efforce de leur démontrer la plus-value de conseil dans la mise en œuvre d’un projet pédagogique collectif et des enjeux liés à ce dernier. Enfin, je m’assure de proposer un ordre du jour connu à l’avance pour les enseignants, veille à préciser la durée. Sur la base du volontariat, dans un premier temps, je le mets en place."], [5, "Quelles sont les différentes catégories de personnel dans l’établissement et quelle autorité avez-vous sur elles ?", "Personnel administratif (secrétaire, gestionnaire, intendante), personnel enseignant avec différents statuts (fonction publique d’Etat, contractuels, TZR...), personnels de la collectivité territoriale (Région, département), Vie scolaire (CPE, AED; contrats civiques); personnel médico-social (COPSY devenues depuis 2016 les psychologues scolaires, assistante sociale, infirmière)"], [6, "Comment définiriez-vous une compétence à des enseignants qui vous le demande ?", "C’est une capacité à effectuer une tâche dans différents contextes, plus ou moins complexes. La capacité nécessitée des connaissances. Inversement, le développement de connaissances doit s’appuyer sur des compétences.\n\nTexte : le socle commun de compétences."], [7, "Quels leviers pour lutter contre le décrochage scolaire ?", "Rappel préalable : **La lutte contre le décrochage scolaire est une priorité nationale et un enjeu dans le cadre de la \"Stratégie Europe 2020\".** (EDUSCOL)\n\n“L**e décrochage scolaire n’est pas un phénomène uniforme et homogène.** Il se matérialise par autant de trajectoires individuelles et d’histoires de vie et s’explique par une combinaison de facteurs de risques internes et externes à l’École. La réponse ne peut donc être univoque.”b (EDUSCOL)\n\n=> L'éducation nationale a porté des évolutions importantes notamment sur le plan législatif :\n\n- “le droit au retour en formation pour tous les jeunes sortis du système éducatif sans diplôme ni un niveau suffisant de qualification *(article L-122 du code de l’éducation)* et l'obligation de formation pour les jeunes âgés de 16 à 18 ans *(article L-144 du code de l'éducation ).”*\n\n- **Les Écoles de la deuxième chance (E2c)**\n\n*En amont, sensibilisation des équipes, projet sas de remobilisation*, dialogue avec les familles,, l**a \"semaine de la persévérance scolaire\", lien avec la DVS de la DSDEN**"], [8, "L’uniforme à l’école ? Qu’en pensez-vous ?", "=> peut avoir des effets positifs sur le climat scolaire (égalité, sentiment d’appartenance)\n\nUn bilan de l’expérimentation en cours depuis la rentrée 2024 (90 établissements) sera établi fin avril permettant des ajustements nécessaires pour l’année scolaire 2025-2026. L’EN s’engage à financer la poursuite de l’expérimentation sur la tenue unique à l’école pour l’année scolaire 2025/2026, le projet est cofinancé par les collectivités volontaires. L’état finance 50 % des tenues dans la limite de 100 euros par élèves et par année, cela a couté 1,6 millions d’euros pour l’année 2024/2025."], [10, "Un professeur s’est fait insulté sur Facebook, les profs réclament la tête de l’élève en salle des profs. Que faites- vous ?", "Je reçois le personnel concerné et l’assure de mon soutien. Je lui rappelle ses droits et s’il souhaite porter plainte, je l’accompagner dans sa démarche. Je saisis un fait établissement afin d’en informer la DVS départementale et les autorités académiques. En parallèle, je communique aux autres enseignants les démarches entreprises.\n\nJe reçois l’élève auteur des insultes ainsi que sa famille. Je rappelle que cette insulte relève de l’injure publique envers un fonctionnaire et informe la famille du choix éventuel de l’enseignant de porter plainte ou non.\n\nArticle 33 de la loi du 29 juillet 1881 sur la liberté de la presse, modifié par la loi n° 2004-1486 du 30 décembre 2004. L’injure commise par les mêmes moyens (soit des discours, cris, menaces proférées, dans des lieux ou réunions publics, soit par des écrits, imprimés, dessins, ou tout autre support de l’écrit, de la parole ou de l’image vendus ou distribués, soit par tout moyen de communication par voie électronique, comme par exemple les blogs…) envers les corps ou les personnes désignés par les articles 30 et 31 (notamment les administrations publiques et les fonctionnaires publics) de la présente loi, sera punie d’une amende de 12 000 euros.\n\nJe rédige un rapport de saisine afin de convoquer un conseil de discipline.\n\nDans la classe de l’élève responsable des insultes, j’engage le CPE, les enseignants à faire réfléchir l’ensemble des élèves sur le respect d’autrui.\n\nEnfin, à l’échelle de l’établissement, poursuite des actions de prévention et d’éducation à la citoyenneté. + intervention de l’EMS."], [11, "Sympathie ? Empathie ?", "Sympathie = elle implique une relation de proximité. On éprouve des sentiments communs avec la personne. C’est une marque d’affection\n\nEmpathie = on est dans les champs de la compréhension. Notion de distance affective."], [12, "Envisagez-vous plus votre future fonction comme de la direction ou du management", "Les deux. Le Manager est pour moi qu’une partie de la direction. La notion de direction me paraît plus englobante. Manager s’applique surtout à destination du personnel de l’établissement. Manager, c’est mettre en œuvre des conditions propice à l’action des personnels."], [13, "Comment réagir face à une situation de blocage face aux enseignants ?", "Question un peu vague. Quel type de blocage ? Il faut identifier la cause du blocage : interne (décision prise par le chef) ? Externe (ex: réforme)?\n\nDans tous les cas, convocation d’un conseil pédagogique avec la possibilité d’engager un dialogue. Je donnerai des signes en me rendant également dans la salle des profs, en circulant davantage dans les couloirs afin de favoriser les discussions interpersonnelles avec les enseignants."], [14, "Il est 16h30, une rumeur circule sur une vidéo d'une élève qui circule sur les portables, elle y serait dénudée...que faites-vous?", "J’identifie la source de la rumeur, consulte la vie scolaire qui est au contact des élèves et qui est susceptible d’avoir des informations. Je reçois, avec le CPE l’élève concernée et l’oriente vers l’infirmière du collège. J’informe les parents. Si la rumeur est avérée, je cherche à faire cesser la diffusion, informer les autorités académiques compétentes (DSDEN, en particulier), accompagne les parents à déposer plainte et informe le référence police ou gendarmerie. Je sollicite également l’appui de l’EMS afin d’engager, en lien avec l’équipe éducative, une réflexion collective à long terme. Dans la cadre de la mallette des parents, un atelier de sensibilisation sur les pratiques numériques des jeunes pourra aussi être proposé."], [15, "Quelle est la différence entre Budget et Compte financier ?", "**Résumé des différences**\n\n| **Aspect**      | **Budget**                                      | **Compte financier**             |\n|-----------------|-------------------------------------------------|----------------------------------|\n| **Temporalité** | Prévisionnel (futur)                            | Réalisé (passé)                  |\n| **Nature**      | Planification                                   | Évaluation                       |\n| **Objectif**    | Anticiper les besoins et allouer les ressources | Vérifier et analyser la gestion  |\n| **Contenu**     | Estimations de recettes et dépenses             | Réalité des recettes et dépenses |\n\nBudget : c’est le projet des dépenses et des recettes pour l’année  Le compte financier clôture l’exercice comptable d’une année scolaire."], [16, "La loyauté́. Qui doit être loyal envers le CE ?", "Qu’entend-t-on par loyauté ? La loyauté c’est la fidélité aux engagements pris dans un cadre professionnel. Partant de là, elle concerne tous les personnels. La loyauté ne signifie ni conformité ni soumission. Elle est l’acceptation et le respect d’un contrat moral et de règles de transparence au sein d’un groupe (définition ministère de la défense). Au nom de ces règles, les conflits de toute nature sont censés se régler, via un dialogue franc et direct, réorientant l’action vers les objectifs collectifs partagés. // Le loyalisme se réduit à l’attachement à un régime ou à des institutions."], [17, "Quel nouveau poste a été́ créé par la loi d'orientation de 2005 au sein du ministère de l'éducation nationale ?", "Le référent handicap est un acteur clé dans l'accompagnement des élèves en situation de handicap. Son rôle principal est de garantir la continuité et la cohérence du parcours scolaire des élèves en situation de handicap, conformément aux objectifs d'inclusion de la loi.\n\n1.  **Coordination des acteurs** :\n\n    - Faire le lien entre les familles, les enseignants, les établissements, les équipes éducatives, et les services spécialisés.\n\n    - Collaborer avec les maisons départementales des personnes handicapées (MDPH).\n\n2.  **Accompagnement des élèves** :\n\n    - Faciliter la mise en œuvre des projets personnalisés de scolarisation (PPS).\n\n    - S’assurer de l’adaptation des conditions d’apprentissage pour répondre aux besoins spécifiques des élèves.\n\n3.  **Appui aux équipes pédagogiques** :\n\n    - Conseiller les enseignants et le personnel éducatif dans leurs pratiques inclusives.\n\n    - Aider à la mise en place des aménagements pédagogiques et matériels.\n\nCette mesure marque une avancée majeure pour l'inclusion scolaire, inscrivant dans le cadre législatif le droit à une éducation adaptée pour chaque élève, quel que soit son handicap. Le référent handicap contribue à une école plus inclusive et respectueuse des besoins individuels."], [18, "Qui fixe la politique de formation professionnelle et de l’apprentissage et la met en œuvre ? Avec quels partenaires ? (réforme TVP)", "France compétences est une institution nationale publique française dotée de la personnalité morale et de l'autonomie financière, créée au 1ᵉʳ janvier 2019 en application de la loi pour la liberté de choisir son avenir professionnel du 5 septembre 2018\n\nFinancer/Réguler/Améliorer"], [19, "Un imam demande une salle ? Que faites-vous ?", "Je lui demande la raison motivant sa demande. En fonction de sa réponse, je lui rappelle le principe de la laïcité et les textes réglementaires. Je ne mets pas à disposition de salle. Toutefois, des aumôneries sont possibles dans des établissements publics lorsqu’il y la présence d’un internat. Mais son ouverture est soumise à l’approbation du recteur.\n\n**Vade-mecum de la laïcité, octobre 2019**\n\n« Dans le second degré, il convient de distinguer les établissements dotés d’un internat de ceux qui en sont dépourvus.\n\n- *S’agissant des établissements dépourvus d’un internat, l’institution du service d’aumônerie est facultative. L’aumônerie peut toutefois être instituée si des parents d’élèves en font la demande. La décision est prise par le recteur d’académie après étude du dossier transmis par le chef d’établissement. L’instruction religieuse est proposée en dehors des horaires de cours et, en principe, hors de l’enceinte de l’établissement. Elle peut être exceptionnellement dispensée à l’intérieur des établissements si la sécurité ou la santé des élèves le justifie, sur autorisation du recteur d’académie, après avis du chef d’établissement.*\n\n- *S’agissant des établissements pourvus d’un internat, l’institution du service d’aumônerie est de droit sur demande des familles. Dans ce cas, l’instruction religieuse est donnée dans l’enceinte de l’établissement (articles R. 141-2 et R. 141-3 du Code de l’éducation). Dans les deux hypothèses, les aumôniers sont proposés à l’agrément du recteur d’académie par les autorités religieuses »*"], [20, "Quel est le plus grand drame de notre temps?", "Question très personnelle... Au regard de l’école ? Le décrochage scolaire ? Les difficultés à combattre les effets des inégalités scolaires et territoriales ?"], [21, "En CA, le chef propose une mesure dénuée de sens, complétement irréaliste, bref il débloque. Vote anonyme, comment je vote et pourquoi.", "Je m’abstiens en faisant preuve de loyalisme vis-à-vis de l’institution. Reste à savoir, quelle mesure est irréaliste ? Si elle est contraire au bon fonctionnement de l’EPLE, qu’elle met par exemple la sécurité des personnes ou des biens, je vote contre. J’envisage ensuite d’en rediscuter avec le chef d’établissement après le CA."], [22, "Pensez-vous que l’école soit un ascenseur social?", "Oui même si certaines limites sont identifiées lors des grandes enquêtes nationales et internationales. Par exemple, en 2019 (PISA), la France est \"dans le groupe des quatre ou cinq pays les plus inégalitaires\" parmi les pays occidentaux, selon Éric Charbonnier, analyste éducation de l'OCDE. Seuls le Luxembourg et Israël ont des écarts nettement plus importants que celui observé en France. Un élève défavorisé français a cinq fois plus de risques d'être en difficulté en lecture qu'un élève d'un milieu social élevé."], [23, "Qu'est-ce que l'enquête PISA? L’enquête TIMSS ? L’enquête CEDRE ? Qu’apprend-t-on de ces enquêtes?", "**1. L’enquête PISA (Programme International pour le Suivi des Acquis des élèves)**\n\n- **Organisme** : Coordonnée par l’OCDE (Organisation de Coopération et de Développement Économiques).\n\n- **Périodicité** : Réalisée tous les 3 ans.\n\n- **Population étudiée** : Les élèves de 15 ans, quel que soit leur niveau scolaire ou le type d’établissement.\n\n- **Domaines évalués** :\n\n  - Compétences en **lecture** (compréhension de textes écrits).\n\n  - **Mathématiques**.\n\n  - **Sciences**.\n\n  - Parfois des domaines spécifiques comme la résolution de problèmes collaboratifs ou la pensée créative.\n\n**Enseignements** :\n\n- Comparaison des performances des élèves entre pays.\n\n- Identification des inégalités sociales et de leurs impacts sur les résultats.\n\n- Analyse de l’efficacité des systèmes éducatifs en fonction des politiques publiques.\n\n**2. L’enquête TIMSS (Trends in International Mathematics and Science Study)**\n\n- **Organisme** : Conduite par l'IEA (International Association for the Evaluation of Educational Achievement).\n\n- **Périodicité** : Réalisée tous les 4 ans.\n\n- **Population étudiée** :\n\n  - Les élèves de **CM1** (4e année de scolarité) et de **4e** (8e année de scolarité).\n\n- **Domaines évalués** :\n\n  - **Mathématiques**.\n\n  - **Sciences**.\n\n**Enseignements** :\n\n- Suivi des tendances des acquis en mathématiques et en sciences sur plusieurs cycles.\n\n- Évaluation des curricula et des pratiques pédagogiques entre pays.\n\n- Mesure des écarts de performance selon le sexe, le niveau socio-économique ou d’autres facteurs.\n\n**3. L’enquête CEDRE (Cycle des Évaluations Disciplinaires Réalisées sur Échantillon)**\n\n- **Organisme** : Conduite par la DEPP (Direction de l'Évaluation, de la Prospective et de la Performance) en France.\n\n- **Périodicité** : Réalisée régulièrement sur des disciplines spécifiques.\n\n- **Population étudiée** :\n\n  - Échantillons représentatifs d’élèves de **CM2** ou de **3e**.\n\n- **Domaines évalués** :\n\n  - Compétences disciplinaires (par exemple, français, mathématiques, sciences, histoire-géographie).\n\n**Enseignements** :\n\n- Mesure des acquis des élèves à différentes étapes-clés de leur scolarité.\n\n- Identification des forces et faiblesses des apprentissages par discipline.\n\n- Suivi des évolutions sur le long terme pour des cohortes d’élèves.\n\n**Que nous apprennent ces enquêtes dans l’ensemble ?**\n\n1.  **Les performances des élèves** :\n\n    - Ces enquêtes mettent en lumière les niveaux de compétence des élèves dans des domaines-clés (lecture, mathématiques, sciences, etc.).\n\n    - Elles permettent de repérer des faiblesses récurrentes, par exemple en compréhension de textes ou en résolution de problèmes mathématiques.\n\n2.  **Les inégalités éducatives** :\n\n    - PISA et TIMSS, en particulier, révèlent des écarts de performance liés à des facteurs socio-économiques, culturels ou genrés.\n\n    - Elles montrent l’impact des politiques éducatives sur l’équité entre élèves.\n\n3.  **L’efficacité des systèmes éducatifs** :\n\n    - Ces études comparent les approches pédagogiques, les curriculums et les investissements dans l’éducation à l’échelle nationale et internationale.\n\n    - Elles identifient les meilleures pratiques et les politiques qui réussissent à améliorer les performances des élèves.\n\n4.  **Les tendances à long terme** :\n\n    - TIMSS et CEDRE permettent d’observer des évolutions sur plusieurs décennies et d’évaluer les effets des réformes éducatives.\n\nQue le système éducatif FR est performant sur les élites mais qu'il ne parvient pas à réduire les inégalités scolaires. Les résultats en maths sont en baisse. La réduction de l'écart filles/garçons est uniquement du en maths à la baisse des garçons. On pourrait aussi étendre l'analyse au dispositif de dédoublement des classes de GS/CP/CE1 en REP(+) qui ne permet pas une réussite supérieure (à peine +5%) alors que des moyens énormes sont mis en terme de RH.\n\nFinalement ce qui fait réussir, au-delà du déterminisme social, c'est l'effet enseignant, quel que soit sa démarche pédagogique. Avoir des enseignants bienveillants et exigeants, qui prennent en compte l'élève dans sa globalité, mobilisent et développent ces compétences psycho sociales sont surement la clé de la réussite. Pour cela il faut articuler une formation initiale/continuée/continue qui place l'alternance intégrative comme cadre de formation.\n\nEnfin, le rôle du chef d'établissement, dans cette machine école, c'est de susciter l'innovation, les expérimentations. Il doit permettre aux enseignants de sortir de leur zone de confort, de prendre des risques, d'essayer quitte à se tromper. Car c'est ça qui nous fait toutes et tous avancer\n\n**Comment pourrait-on améliorer nos résultats PISA?**\n\nPour rappel, PISA c’est le programme international pour le suivi des acquis des élèves, est la plus grande étude internationale auprès d'élèves dans le domaine de l'éducation. Pilotée par l'OCDE, PISA mesure l'efficacité des systèmes éducatifs. L'objectif est de comparer les performances des élèves issus de différents environnements d'apprentissage pour comprendre ce qui les prépare le mieux à leur vie d'adulte.\n\nPISA, c'est :\n\n- 79 pays participants\n\n- 252 établissements PISA en France métropolitaine et Outre-mer\n\n- 7000 élèves qui défendent les couleurs de la France\n\nL'étude est menée tous les trois ans auprès de jeunes de 15 ans, qu'ils soient scolarisés dans un établissement public ou privé sous contrat, au collège ou en lycée agricole, général, technologique ou professionnel. PISA évalue leurs capacités à mobiliser leurs connaissances scolaires et à les utiliser dans des situations proches de la vie quotidienne.\n\nComment se déroulent les épreuves ?\n\n- L'ensemble de l'évaluation dure en tout 3h30. Elle est décomposée en quatre séquences :\n\n- Les élèves passent d'abord des épreuves de compréhension de l'écrit, de culture mathématique et de culture scientifique pendant deux heures.\n\n- Puis, ils répondent à deux questionnaires de 45 minutes, axés sur leur milieu socio-culturel et sur les techniques d'information et de communication.\n\n- Leurs résultats sont confidentiels.\n\nSituation actuelle :\n\nEn compréhension de l’écrit, le score moyen des élèves français est stable à 493 (496 en 2009) et nettement au-dessus de la moyenne de l’OCDE (487 points). Les élèves français sont au niveau de l’Allemagne ou encore de la Belgique entre le 20 et 26e rang des pays de l’OCDE.\n\nEn mathématiques, le score moyen est de 495, légèrement au-dessus de la moyenne de l’OCDE (489 points en 2018 contre 490 en 2015). 11% des élèves sont très performants contre 37 % à Singapour.\n\nLe poids des déterminismes socio-économiques est encore très fort mais ne s’accroit plus : 107 points d’écart (moyenne de l’OCDE 88) contre 110 points en 2009.\n\n**=> Donc, il faut lutter contre les inégalités sociales, territoriales d’où le dédoublement de CP, devoirs faits, les réflexions sur les territoires apprenants, l’importance de l’éducation artistique et culturelle et du numérique.**"], [24, "Qu'est-ce que la justice scolaire? Comment s’exprime-t-elle au sein d’un établissement scolaire ?", "La justice scolaire correspond à l’équité scolaire et l’égalité des chances au sein d’un établissement. Elle est inscrite dans le code de l’éducation et dans le référentiel des professeurs. La justice scolaire est une valeur de l’école républicaine. Tout élève a le droit à une éducation et une formation adaptée à ses besoins (inclusion scolaire et lutte contre les discriminations). La justice scolaire permet d’aboutir à un meilleur climat scolaire. Dans un établissement, la justice scolaire s’exprime dans les mesures d’inclusion (PAP,PPRE...) mais également de prévention (phARe, EVRAS...) cela signifie également le respect du règlement intérieur, et prévoit des punitions ou sanctions en cas d’infraction. Un sentiment de justice améliore les contextes d’apprentissage des élèves et les conditions d’exercice des personnels de l’éducation nationale. Il favorise aussi la collaboration positive avec les familles et les partenaires. C’est ce qui va aider les élèves à comprendre le sens des règles, des droits, des devoirs et à acquérir les compétences sociales nécessaires pour un comportement juste avec autrui, respectueux, responsable et citoyen.  \n  \nDES RÈGLES EXPLICITES\n\n• Travailler collectivement autour du règlement intérieur : rédaction, diffusion, mise en application.\n\nFaire participer les élèves à l’élaboration des règles.\n\n• Mettre en œuvre des séquences pédagogiques autour des règles de l’école ou de l’établissement.\n\n• Favoriser la démocratie scolaire, donner du sens aux élections des représentants élèves.\n\n• S’appuyer sur les instances qui responsabilisent les élèves (conseils d’école, CVL, CVC, MDL, internat).\n\nÉDUQUER AU DROIT ET À LA CITOYENNETÉ\n\n• Mettre en œuvre le parcours citoyen.\n\n• S’appuyer sur les programmes disciplinaires et des projets pluridisciplinaires.\n\n• Éduquer au droit : sensibiliser aux droits de l’enfant, faire connaître la justice des mineurs.\n\n• Faire connaître les métiers du droit et de la justice.\n\n• Développer des liens avec des partenaires (ex : référent police ou gendarmerie, les maisons de la justice et du droit)\n\n• Éduquer aux compétences sociales et citoyennes (écoute, empathie, gestion des émotions ; gestion des conflits, communication…).\n\n• Favoriser les actions coopératives et les débats.\n\n• Développer la médiation par les pairs.\n\nMISE EN ŒUVRE ÉDUCATIVE DES PROCÉDURES DISCIPLINAIRES\n\n• Mettre en œuvre les procédures disciplinaires prévues au règlement intérieur et diffusées auprès de la communauté scolaire.\n\n• Respecter les principes généraux du droit.\n\n• Accompagner par le dialogue : permettre à l’élève et à sa famille de s’exprimer (principe du contradictoire) ; expliciter le déroulé de la procédure disciplinaire et le sens des mesures prises.\n\n• S’appuyer sur les mesures alternatives à l’exclusion scolaire.\n\n• Utiliser toute l’échelle des sanctions.\n\n• Développer les mesures de responsabilisation. •\n\nPenser des sanctions restauratrices, qui permettent à l’élève de se réinsérer dans le fonctionnement normal de sa scolarité (mettre l’élève en position de production active ; en cas d’exclusion, préparer son retour en classe et dans l’établissement).\n\n• Mettre en œuvre un suivi ou du tutorat pour les élèves concernés par une procédure disciplinaire. • Développer une réflexion interne à la communauté scolaire sur l’usage et la nature des punitions/sanctions au sein de l’école et de l’établissement : s’interroger sur les pratiques (valeurs, efficacité, cohérence) et les indicateurs.\n\n• Se former aux approches préventives comme la discipline positive ou la communication non violente"], [25, "Qu'est-ce que l'École inclusive? Qu’en pensez-vous?", "Elle s’inscrit dans un cadre législatif (celui de la loi La loi du 11 février 2005 pour l'égalité des droits et des chances, la participation et la citoyenneté des personnes handicapées). Cette loi s’est traduite par un nombre croissant d’enfants et de jeunes en situation de handicap scolarisés dans les écoles et les établissements (trois fois plus élevé en quinze ans).\n\n**C’est un projet de société : faire de la différence une force.**\n\nL’école inclusive implique une réflexion en établissement avec les différents acteurs internes et externes. Elle donne lieu à des aménagements, en particulier dans le cadre d’un PPS (plan personnalisé de scolarisation) ou d’un PAP (plan d’accompagnement personnalisé).\n\n**Des étapes clés à respecter** : dialogue avec la famille pour accueillir l’enfant, accompagner l’élève avec des pratiques pédagogiques au service de l’inclusion, solliciter expertise IEN-ASH\n\nDe même, des unités localisées pour l'inclusion scolaire (ULIS) ont été déployées **Ce sont les commissions des droits et de l'autonomie des personnes handicapées (CDAPH) qui décident de l'orientation d'un élève vers une ULIS** qui lui offre la possibilité de poursuivre en inclusion des apprentissages adaptés à ses potentialités et besoins et d'acquérir des compétences sociales et scolaires, même lorsque ses acquis sont très réduits. Les ULIS ont d’abord été déployées dans les écoles et collèges. Depuis deux ans, plusieurs ont été mises en œuvre dans les lycées.\n\n**Actualité :**\n\n**Le CAPPEI est le certificat d'aptitude professionnelle aux pratiques de l'éducation inclusive.**\n\nCe certificat est destiné à attester la qualification des enseignants du premier degré et du second degré appelés à exercer leurs fonctions dans les écoles, dans les établissements scolaires, dans les établissements et services accueillant des élèves présentant des besoins éducatifs particuliers (EBEP) liés à une situation de handicap, de grande difficulté scolaire ou à une maladie, et à contribuer à la mission de prévention des difficultés d'apprentissage et d'adaptation de l'enseignement.\n\nLe CAPPEI remplace le CAPA-SH et le 2CA-SH à compter de la session 2019.\n\nPIAL (Pôle inclusif d’accompagnement localisé) remplacés par les Pôles d’Accompagnement Spécialisés (PAS) en 2025\n\nPIAL (Pôles Inclusifs d’Accompagnement Localisés)\n\n1.  Objectif principal :\n\n    - Optimiser la gestion des Accompagnants des Élèves en Situation de Handicap (AESH).\n\n    - Faciliter l'inclusion des élèves en situation de handicap dans le système scolaire.\n\n2.  Fonctionnement :\n\n    - Les PIAL coordonnent les ressources humaines et les moyens matériels pour répondre aux besoins d'accompagnement des élèves.\n\n    - Ils encouragent une gestion plus flexible des AESH, qui peuvent être affectés à plusieurs élèves ou classes en fonction des besoins.\n\n3.  Critiques :\n\n    - Manque de personnalisation dans l'accompagnement.\n\n    - Flexibilité perçue comme une instabilité pour certains élèves et AESH.\n\n    - Difficultés d’adaptation pour répondre efficacement à des besoins spécifiques.\n\nPAS (Pôles d’Accompagnement Spécialisés)\n\n1.  Nouvelle approche :\n\n    - Les PAS visent à renforcer une prise en charge plus spécialisée et adaptée aux besoins spécifiques des élèves.\n\n    - Une meilleure articulation avec les acteurs médicaux, sociaux et éducatifs.\n\n2.  Objectifs des PAS :\n\n    - Individualisation accrue de l'accompagnement.\n\n    - Coordination plus étroite avec les structures de soin et les dispositifs médico-sociaux.\n\n    - Favoriser une inclusion réussie tout en respectant les besoins spécifiques des élèves.\n\n3.  Améliorations attendues :\n\n    - Réduction des critiques liées à la gestion des PIAL.\n\n    - Meilleure qualité de l’accompagnement grâce à une approche plus spécialisée.\n\n    - Une prise en charge plus claire et lisible pour les familles.\n\nDifférences clés entre PIAL et PAS\n\n| Aspect              | PIAL                                                 | PAS                                           |\n|---------------------|------------------------------------------------------|-----------------------------------------------|\n| Focalisation        | Optimisation des ressources (AESH, moyens)           | Individualisation et spécialisation de l'aide |\n| Coordination        | Priorité aux moyens humains                          | Articulation avec dispositifs médico-sociaux  |\n| Réponse aux besoins | Gestion collective et flexible                       | Accompagnement plus ciblé et personnalisé     |\n| Critiques           | Trop de flexibilité, accompagnement jugé insuffisant | Plus de stabilité et de réponse spécialisée   |\n\nEnjeux de la transition\n\n- Pour les élèves : Assurer un meilleur accompagnement dans leur parcours scolaire en tenant compte de leurs besoins spécifiques.\n\n- Pour les AESH : Clarifier les missions et renforcer la reconnaissance professionnelle.\n\n- Pour les familles : Rassurer sur la continuité et la qualité de l'accompagnement."], [26, "Dans un lycée professionnel, quelqu'un vient vous alerter, une machine présente un défaut de fonctionnement et pourrait représenter un danger. Que faites-vous? à court terme, moyen...?", "A court terme, je sécurise la machine concernée en interdisant son utilisation par une signalétique et informant les équipes du danger à l’utiliser. Dans un deuxième temps, je sollicite le DDFPT (Directeur Délégué aux Formations Professionnelles et Technologiques en établissement - Ex Chef de Travaux) et l’intendant pour vérifier cette machine, envisager sa mise en conformité par des réparations ou son remplacement."], [27, "Dans quel cas de figure convient-il de tenir un conseil de discipline hors les murs? Pourquoi?", "« Si la réunion du conseil de discipline dans les locaux de l'établissement risque d'entraîner des troubles, le chef d'établissement peut décider de le réunir dans un autre EPLE ou, le cas échéant, dans les locaux de la direction des services départementaux de l'éducation nationale.\n\nIl peut, pour les mêmes raisons, saisir le conseil de discipline départemental. »\n\nRappel :\n\n**Composition du conseil de discipline**\n\nLe conseil de discipline est toujours composé de 14 membres issus du CA (consulter la fiche spécifique sur le Conseil d'administration) mais la répartition varie :\n\n**Au collège :**\n\n9 membres de l'établissement : le chef d'établissement, le chef d'établissement adjoint, 1 conseiller principal d'éducation (CPE), le gestionnaire de l'établissement et 5 représentants élus des personnels ;\n\n3 représentants élus des parents d'élèves ;\n\n2 représentants élus des élèves.\n\n**Au lycée :**\n\n9 membres de l'établissement : le chef d'établissement, le chef d'établissement adjoint, 1 conseiller principal d'éducation (CPE), le gestionnaire de l'établissement et 5 représentants élus des personnels ;\n\n2 représentants élus des parents d'élèves ;\n\n3 représentants élus des élèves."], [28, "Des élèves fument du cannabis devant l'établissement, que faites-vous? Les professeurs demandent un conseil de discipline, comment réagissez-vous?", "Dans un premier temps, je vais à leur rencontre et leur rappelle que le règlement intérieur s’applique aux abords immédiats de l’établissement. Je leur rappelle ce dernier qui interdit la consommation de produits stupéfiants et leur rappelle que l’usage est considéré aux yeux de la loi comme un délit d’usage. En présence du CPE, je confisque le cannabis et préviens le référent police ou gendarmerie, remets le produit confisqué. Je reçois ensuite individuellement les élèves et les familles, les oriente vers l’infirmière scolaire. Enfin, à long terme, dans le cadre du CESC, nous réfléchissons à des actions d’éducation à la santé.\n\nConcernant la convocation du conseil de discipline, j’informe oralement et par écrit l’équipe des mesures prises. La convocation n’est pas automatique. Est-ce que c’est la première fois ? Est-ce régulier ? L’étape préalable peut être aussi une commission éducative."], [29, "Un professeur n’a mis qu’une seule note à plusieurs classes au premier trimestre, les parents d’élèves s’en émeuvent pendant le conseil de classe. Comment réagissez-vous?", "Je prends note de la question des familles. Au préalable, avant la tenue du conseil de classe, j’ai observé les résultats de la classe et je me suis moi-même interrogé. J’ai ainsi pris soin de recevoir l’enseignant pour échanger sur cette situation. Dans le cadre de sa liberté pédagogique, cette note est peut-être la moyenne d’une série d’évaluations ponctuelles en cours de trimestre. Par ailleurs, le jour du conseil, je rappelle aux parents que l’évaluation ne se limite pas aux notes mais qu’elle englobe les compétences évaluées. Enfin, j’explique qu’une réflexion sur l’évaluation est en cours dans l’établissement.\n\nAu collège, à ma connaissance, aucun texte n’impose un nombre minimum de notes. En revanche, au bac, dans le cadre du contrôle continu, il est précisé « Robustesse des moyennes trimestrielles ou semestrielles, garanties par un nombre minimal de notes par période, et un nombre suffisant d’exercices inspirés des sujets de baccalauréat libérés. Un minimum de trois évaluations par trimestre (ou de quatre par semestre) est, sauf exception, attendu. »"], [30, "Deux délégués demandent d’être reçus, ils ont été témoins d’une scène qui les a choqués : un professeur a giflé un élève. Que faites-vous?", "Je reçois les élèves délégués, l’élève concerné séparément. Je prends en note leur témoignage en leur posant des questions ouvertes. Je reçois l’enseignant afin de comprendre la situation. Si ce dernier confirme les faits, je l’informe que je dois en informer les autorités académiques, en particulier la Division de la Vie scolaire. Je rédige un rapport circonstancié et le soumets à la signature de l’enseignant afin qu’il accuse en avoir pris connaissance (en présence d’un représentant syndical s’il le souhaite ou d’un de ses collègues). Parallèlement, je rappelle à l’enseignant qu’il peut se faire accompagner (autonome de solidarité, cellule d’écoute). Enfin, au préalable, je reçois la famille pour l’informer des démarches effectuées en interne et les assure de mon soutien. Je rassure l’élève en accompagnant son retour en classe.\n\nEn revanche, si le témoignage des élèves s’avère faux, j’informe l’enseignant de la rumeur et convoque les élèves dans la perspective de sanctions.\n\n**Rappel : Il n'existe que six sanctions disciplinaires, qui sont énumérées par l'article R. 511-13 du Code de l'éducation. **\n\nL'échelle des sanctions fixée à l'article R. 511-13 du code de l'éducation est reproduite dans le règlement intérieur. Toutefois, le juge administratif (CE, 16 janvier 2008, MEN c/Mlle A, n° 295023) considère que, même en l'absence de toute mention dans le règlement intérieur, l'échelle des sanctions réglementaires est applicable de plein droit.\n\n**a) L'avertissement,** loin d'être symbolique, constitue une sanction. Premier grade dans l'échelle des sanctions, l'avertissement peut contribuer à prévenir une dégradation du comportement de l'élève. Comme les autres sanctions, il est porté au dossier administratif de l'élève qui est informé de cette inscription.\n\n**b) Le blâme** constitue un rappel à l'ordre écrit et solennel. Les observations adressées à l'élève présentent un caractère de gravité supérieure à l'avertissement. Comme les autres sanctions, le blâme doit faire l'objet d'une décision dûment notifiée à l'intéressé ou à son représentant légal par le chef d'établissement. L'élève doit certifier en avoir pris connaissance. Cette décision, versée à son dossier administratif, peut être suivie, au besoin, d'une mesure d'accompagnement de nature éducative.\n\n**c) La mesure de responsabilisation** qui implique la participation de l'élève, en dehors des heures d'enseignement, à des activités de nature éducative pendant une durée qui ne peut excéder vingt heures.\n\nElle peut se dérouler au sein de l'établissement. Dans l'hypothèse où elle n'est pas effectuée dans l'établissement mais au sein d'une association, d'une collectivité territoriale, d'un groupement rassemblant des personnes publiques ou d'une administration de l'État, l'accord de l'élève et, lorsqu'il est mineur, celui de son représentant légal doit être recueilli. Le refus de l'élève ne peut l'exonérer de la sanction qui devra alors être exécutée au sein de l'établissement.\n\nUne convention de partenariat entre l'établissement et l'organisme d'accueil doit avoir été autorisée par le conseil d'administration préalablement à l'exécution de la mesure. L'arrêté du 30 novembre 2011 pris en application de l'article R. 511-13 du code de l'éducation fixe les clauses-types de la convention. Le même arrêté décrit les informations qui doivent figurer dans le document signé par le chef d'établissement, le représentant légal et le responsable de la structure d'accueil, afin de définir les modalités d'exécution de la mesure de responsabilisation.\n\nL'exécution de la mesure de responsabilisation doit demeurer en adéquation avec l'âge de l'élève et ses capacités. Toute activité ou tâche susceptible de porter atteinte à la santé et à la dignité de l'élève est interdite. Il appartient aux chefs d'établissement d'exercer un contrôle sur le contenu des activités ou tâches réalisées par l'élève afin de s'assurer que la nature et les objectifs de la mesure de responsabilisation sont conformes à l'objectif éducatif assigné à celle-ci.\n\nPar exemple, dans le cas d'un propos injurieux envers un camarade de classe, l'élève sanctionné pourra avoir à réaliser une étude en lien avec la nature du propos qu'il a tenu ou, dans le cas du déclenchement d'une alarme, mener une réflexion sur la mise en danger d'autrui ou être invité à rencontrer des acteurs de la protection civile. Dans le cadre de cette démarche, l'engagement de l'élève à réaliser la mesure de responsabilisation est clairement acté.\n\nIl est souhaitable qu'à l'issue de la mesure le chef d'établissement en fasse un bilan avec l'élève et ses parents.\n\nIl convient de ne pas confondre cette sanction avec la mesure de responsabilisation prononcée à titre d'alternative à la sanction, laquelle peut être proposée à l'élève qui a fait l'objet d'une sanction d'exclusion temporaire de la classe, de l'établissement ou de l'un de ses services annexes.\n\n**d) L'exclusion temporaire de la classe** peut être prononcée si un élève perturbe plusieurs cours de façon répétitive. Cela suppose une concertation, en amont, entre les différents membres de l'équipe pédagogique et éducative. Cette concertation est essentielle afin de garantir la portée éducative de la sanction. L'exclusion de la classe, dont la durée maximale est de huit jours, s'applique à l'ensemble des cours d'une même classe. Elle n'est pas assimilable à l'exclusion du cours qui relève, quant à elle, du régime des punitions. Pendant l'exclusion de la classe, l'élève est accueilli dans l'établissement.\n\n**e) L'exclusion temporaire de l'établissement ou de l'un de ses services annexes,** qu'elle ait été prononcée par le chef d'établissement ou le conseil de discipline, est désormais limitée à huit jours, de façon à ne pas compromettre la scolarité de l'élève.\n\n**f) L'exclusion définitive de l'établissement ou de l'un de ses services annexes :** le conseil de discipline est seul compétent pour prononcer cette sanction.  \nSi l'exclusion définitive d'un élève est prononcée, un accueil spécifique devra être mis en place dans le nouvel établissement d'affectation pour favoriser son intégration. En application de l'article D. 511-30 du code de l'éducation, si l'élève a déjà fait l'objet d'une exclusion définitive au cours de l'année scolaire, l'information préalable du directeur académique des services de l'éducation nationale est obligatoire.\n\nEn application de l'article L. 131-6 du code de l'éducation, le maire de la commune où est domicilié l'élève doit être informé de la durée des sanctions d'exclusion temporaire ou définitive de l'établissement prononcées à l'encontre des élèves, afin de lui donner la possibilité de prendre les mesures à caractère social ou éducatif appropriées, dans le cadre de ses compétences."], [31, "Budget : qui l’élabore ? Qui en est responsable ? En quoi le budget peut-il être un acte pédagogique ?", "Source IH2EF : « L'article R421-9 du code de l'éducation précise qu' \"en tant qu'organe exécutif de l'établissement [le chef d'établissement] :\n\n- est ordonnateur des recettes et des dépenses de l'établissement ;\n\n- prépare les travaux du conseil d'administration, et, notamment, (…) le projet de budget ;\n\n- exécute les délibérations du conseil d'administration et, notamment, le budget adopté par le conseil\".\n\n**Cela signifie qu'il en assume la responsabilité même s'il est conseillé et assisté dans ce domaine par l'adjoint gestionnaire** (cf. article R421-13 du code de l'éducation). Celui-ci apporte son expertise, notamment en proposant pour les services du budget des \"domaines\" et \"activités\" pertinents.\n\n**Le budget : définition**\n\n**Le budget est un acte politique et administratif** qui retrace les objectifs de l'EPLE fixés notamment par le projet d'établissement, le contrat d'objectifs et par la convention signée avec la collectivité territoriale de rattachement. Même si le cadre paraît contraint, la construction du budget laisse une marge de manœuvre aux établissements et la politique générale de l'EPLE peut être comprise à la lecture de ce document.\n\nC'est également un acte financier \"par lequel sont prévues et autorisées les recettes et les dépenses\" des organismes publics (décret n° 2012-1246 du 7 novembre 2012 relatif à la gestion budgétaire et comptable publique).\n\n**Acte pédagogique oui**\n\n=> dépenses = activité pédagogiques (AP) et et vie de l’élève (VE)\n\n**Rappel : les principes**\n\n**Le principe d'unité** : le budget englobe la totalité des charges et des produits de l'établissement ;\n\n**Le principe d'universalité** : le budget doit décrire l'intégralité des produits et des charges (non-contraction entre les recettes et les dépenses et non-affectation des recettes) ;\n\nLe principe d'annualité : l'année budgétaire et l'exercice comptable commencent le 1er janvier et s'achèvent le 31 décembre ;\n\n**Le principe de spécialité :** les crédits ouverts au budget d'un exercice à chaque service ne peuvent être affectés à d'autres services ;\n\n**Le principe d'équilibre :** tout budget doit être présenté en équilibre. Lorsque la dotation globale de fonctionnement ne permet pas de l'atteindre, le recours au fonds de roulement de l'établissement est nécessaire ;\n\n**Le principe de la sincérité :** les recettes et les dépenses de l'établissement doivent être évaluées de façon sincère, c'est à dire qu'elles doivent avoir fait l'objet d'une évaluation excluant toute majoration ou minoration fictives."], [32, "Le CE est-il un pédagogue ?", "**Oui. Dans le référentiel des compétences attendues d’un chef d’établissement, cette dimension est affirmée :**\n\n- « Savoir construire dans la concertation la politique pédagogique et éducative de l'établissement \n\n- Savoir impulser, animer et conduire cette politique pédagogique et éducative\n\n**+ rôle du chef lors de l’accord PPCR**\n\n**+ rôle avec les FIL**\n\n**+ EDT**\n\n**+ DHG**\n\n**+ budget**"], [33, "Vous êtes chef d’établissement d’un collège, vous apprenez à 17h que tous les AED feront grève demain pour soutenir la grève des enseignants. Comment gérez-vous la situation?", "Avec le personnel administratif, le CPE et les agents je fais un point sur la situation. A destination des familles, je fais une communication expliquant qu’en raison d’un mouvement social, les conditions d’accueil des élèves seront dégradées. Je fais un sondage dans pronote afin de savoir si certaines familles envisagent de garder leurs enfants à la maison. Le jour de la grève, j’assure des permanences et mobilise les salles informatiques pour positionner les élèves dans Pix sur les créneaux libres avec l’appui du CPE. Je peux également rassembler les élèves dans la cours.\n\nEn fait, tout d’dépend de la taille de l’établissement, de la proportion d’externes, de la part des élèves transportés ... etc."], [34, "Un prof arrive ivre en cours. Que faites-vous ?", "Je l’invite à me suivre dans mon bureau et lui fait remarque son état d’ébriété. Je lui rappelle que cet état n’est pas compatible avec sa mission d’enseignement et qu’il n’est pas envisageable de le laisser se présenter dans cet état. J’essaie de comprendre pourquoi il est dans cette situation, surtout si c’est exceptionnel. Je lui demande de se faire raccompagner chez lui. Lors de son retour j’échange avec lui. Si cette situation devait venir à être endémique, je lui proposerai un accompagnement en sollicitant un accompagnement des autorités académiques (infirmière de la DSDEN, assistance sociale)."], [35, "Cas d'un collège REP+ avec de très mauvais résultats au DNB, quelles actions en tant que CE alors qu'on vient d'être nommé dans l'établissement?", "A court terme, analyse des données APAE (Aide au pilotage et à l’autoévaluation des établissements) devenu Archipel en 2023, conseil pédagogique afin d’identifier les besoins et les difficultés rencontrés par l’équipe pédagogique. Écoute également des représentants des parents d’élève. A partir du diagnostic :\n\n- sollicitation de l’expertise interne de l’établissement avec un coordonnateur devoirs faits, appui des enseignants qui éventuellement seraient engagés dans des actions de formation.\n\n- Expertise externe en se rapprochant de l’IA-IPR référent pour le réseau REP+ du bassin.\n\n- sollicitation de formations à initiatives locales sur des thématiques transversales.\n\n- A plus long terme, inscription des actions dans l’environnement local de l’établissement :\n\n  - réflexion sur les territoires éducatifs en lien avec les collectivités locales.\n\n  - réflexion sur le numérique comme levier des apprentissages\n\n  - Place de l’EAC\n\n  - liaison collège/lycées\n\n  - expérimentation avec l’aide de la Cardie (Cellule Académique de Recherche et Développement pour l'Innovation et l'Expérimentation)."], [36, "Qu’est-ce qui pourrait constituer des indicateurs de la bonne relation école-parents ?", "- activation des comptes ENT et consultation de pronote\n\n- mobilisation des parents lors des élections pour le CA et participation aux différentes instances.\n\n- associations de parents favorisant la mise en œuvre (notamment financières) de sorties et voyages scolaires.\n\n- participation des parents à la mallette des parents\n\n- ateliers OEPRE (ouvrir l'école aux parents pour la réussite des enfants)\n\n- association à l’auto-évaluation"], [37, "Vous êtes principale de collège, la salle des profs est réfractaire à la mise en place d’une réforme. Les profs décident de faire grève. Que faire ?", "J’essaie de comprendre les points tension : s’agit-il de la réforme en elle-même qui est contestée ou la manière dont elle est mise en œuvre au sein de l’établissement ?\n\nDans les deux cas, je mets en œuvre un conseil pédagogique. En amont, je prépare un diaporama remettant en perspective la réforme, ses objectifs et ses modalités pratiques. J’invite les enseignants présents à s’exprimer sur les points qui posent problème. J’écoute les remarques et prends en note ces dernières. Je propose une phase de réflexion collective pour la mise en œuvre notamment des EPI et de l’AP avec un cadre : qui ? Quoi ? Quels objectifs ? Comment ? Par ailleurs, j’informe l’équipe de ma volonté de faire appel à une expertise externe à l’établissement en sollicitant un accompagnement académique lors d’une formation à initiative locale sur des thèmes au cœur de la réforme comme la pédagogie de projet, la différenciation pédagogique."], [38, "Que pensez-vous de la réforme du collège ? Quels sont ses objectifs ?", "La réforme s’inscrit dans le cadre de la loi d’orientation et de programmation pour la refondation de l’Ecole de la République (8 juillet 2013). Son organisation a été mise en œuvre par un décret du 30 juin 2015.\n\nSa mise en œuvre part de plusieurs constats :\n\n- la diversité des élèves\n\n- les inégalités sociales et territoriales face à la réussite scolaire\n\n- les enquêtes internationales (PISA, programme international pour le suivi des acquis des élèves en particulier)\n\nObjectifs : différencier, favoriser la réussite des élèves, une éducation de tous pour tous, accroître l’autonomie des équipes, maîtrise du socle (refonte), travail collaboratif, AP, EPI, priorité aux LV"], [39, "Quels partenariats mettriez-vous en place pour renforcer le climat scolaire ?", "Les partenariats externes peuvent jouer un rôle clé. Je m’appuierais sur des associations de prévention de la violence et de soutien psychologique, des médiateurs scolaires, et des dispositifs locaux d’aide aux familles en difficulté. Par exemple, des associations spécialisées en gestion des conflits peuvent former les élèves et le personnel. Avec les forces de l’ordre, je veillerais à mettre en place des actions de prévention, notamment autour des abords de l’établissement. Enfin, je développerais des liens avec les institutions locales pour organiser des activités périscolaires qui favorisent l’implication des jeunes dans leur environnement."], [40, "Vous êtes chef d’établissement, comment initiez-vous le travail d’équipe ?", "- conseil pédagogique\n\n- proposition d’ateliers sur certaines thématiques pour les enseignants volontaires\n\n- utilisation d’IMP pour s’appuyer sur des relais intermédiaires ayant en charge la coordination de certains sujets.\n\n- ouverture d’un espace confluence pour l’établissement afin de favoriser des tâches collaboratives\n\n- proposition en début de rentrée d’une journée de cohésion en dehors de l’établissement permettant de découvrir l’environnement local de l’établissement."], [41, "Quelle différence faîtes vous entre un collège de REP+ et un collège ordinaire ?", "Rappel préalable : depuis 1981 avec des dénominations diverses : ZEP, CLAIR, ECLAIR,\n\nLe collège REP + : 2014 sous Peillon\n\n**1981 : Création des zones prioritaires** par Alain Savary, ministre de l’Éducation nationale. La circulaire du 9 juillet 1981 en précise l’objectif : « corriger l’inégalité [sociale] par le renforcement sélectif de l’action éducative dans les zones et dans les milieux sociaux où le taux d’échec scolaire est le plus élevé ».\n\n**2006** : La circulaire du 30 mars 2006,** « Principe et modalités de la politique de l’éducation prioritaire »**, présente un nouveau plan de relance de l’éducation prioritaire en distinguant plusieurs niveaux d’action. 249 puis 253 RAR (Réseaux Ambition Réussite) sont créés. Ils sont dotés de moyens supplémentaires (professeurs référents et assistants pédagogiques), d’un renforcement du suivi et de l’accompagnement et pilotés au niveau national. Les autres ZEP et REP deviennent les RRS (Réseau de Réussite Scolaire) et sont pilotés au niveau académique. Chaque réseau ainsi créé, RAR ou [RRS](https://www.reseau-canope.fr/education-prioritaire/), est composé d’un seul collège et des écoles de son secteur de recrutement.\n\n**2010 : Le programme expérimental CLAIR** (Collège Lycée Ambition Innovation Réussite), issu des états généraux de la violence, est lancé dans dix académies et 105 établissements rencontrant le plus de difficultés relatives au climat scolaire.\n\n**2011 : Le programme ÉCLAIR **(École Collège Lycée Ambition Innovation Réussite) étend le programme CLAIR en le faisant évoluer. Il intègre le premier degré, la quasi-totalité des RAR, qui disparaissent ainsi. Ce programme vise à donner plus d’autonomie aux établissements et aux réseaux afin de développer l’innovation. Il crée la mission de « préfet des études », professeur coordonnateur par niveau au collège, chargé de renforcer les liens entre le pédagogique et l’éducatif, les liens avec le premier degré et avec les parents. Il développe la notion de postes à profil. Les ÉCLAIR, comme les RAR auparavant, sont pilotés au niveau national.\n\n**2014 : Début de la refondation de l’éducation prioritaire : REP**\n\nLa refondation de l’éducation prioritaire a conduit à une révision de son périmètre qui s’est appuyée sur un indice composite de difficultés sociale et scolaire des collèges. Il est construit à partir de quatre indicateurs : le taux d’élèves défavorisés, le taux de boursiers, le taux de retard à l’entrée en 6e et le taux des élèves résidant dans, ou à moins de 300 mètres d’un quartier prioritaire de la politique de la ville (QPV).\n\n- un référentiel décliné en six priorités\n\n- l'accueil des enfants de moins de trois ans\n\n- le dispositif « plus de maîtres que de classes »\n\n- un accompagnement continu jusqu'à la fin des cours de l'après-midi des élèves de sixième\n\n- une carte de l'éducation prioritaire adaptée aux besoins\n\nL[’Instruction n° 2016-124 du 5-8-2016](https://www.education.gouv.fr/bo/16/Hebdo30/MENE1621839J.htm?cid_bo=105544)  introduit **les parcours d’excellence** qui s'inspirent des démarches des cordées de la réussite en s'adressant à plus de jeunes et à plus d'établissements, à un public plus diversifié et en créant un continuum de la 3e à la terminale pour donner aux élèves issus des milieux modestes des moyens supplémentaires de réussir et d'exceller dans la voie qu'ils ont choisie, qu'elle soit professionnelle, technologique ou générale. En 2020 « cordées de la réussite » et « parcours d'excellence » fusionnent en un seul dispositif sous l'appellation de « cordées de la réussite » - [Instruction interministérielle MENJS - MESRI - ANCT - DGESCO B2-3 du 21 juillet 2020](https://www.education.gouv.fr/bo/20/Hebdo32/MENE2021598J.htm)\n\n**2017: Le dédoublement des classes de CP en REP+. **Cette mesure s’inscrit dans la priorité donnée à l’école primaire par le ministre de l’Éducation nationale et de la Jeunesse : 100% des élèves doivent maîtriser les enseignements fondamentaux à la sortie de l’école primaire (lire, écrire, compter et respecter autrui).\n\nRentrée 2021 : Toutes les classes de CP et CE1 en REP et REP+ sont dédoublées et plus de la moitié des classes de GS.\n\n**2019 : Le programme des cités éducatives** vise à dynamiser les quartiers prioritaires de la ville (QPV) au travers d’une mobilisation autour de l’enjeu éducatif coordonnée par la préfecture, les services académiques et les collectivités territoriales. Elles ont objectif de mieux accompagner les parcours éducatifs individuels depuis la petite enfance jusqu’à l’insertion professionnelle.\n\n- 2022 - 3e vague : 74 nouveaux quartiers sont sélectionnés portant à 200 le nombre de cités éducatives.\n\n=> Volonté de promouvoir une éducation de tous pour tous dans des territoires concentrant d’importantes fragilités sociales ayant des incidences sur la réussite scolaire.\n\n=> Un collège REP + est inscrit dans un réseau avec un IA-IPR référent\n\n=> Pondération des heures à 1,1 afin de favoriser la concertation entre les équipes\n\n=> Référentiel spécifique avec 6 priorités :\n\n- Garantir l'acquisition du « lire, écrire, parler » et enseigner plus explicitement les compétences que l'école requiert pour assurer la maîtrise du socle commun,\n\n- Conforter une école bienveillante et exigeante,\n\n- Mettre en place une école qui coopère utilement avec les parents et les partenaires pour la réussite scolaire,\n\n- Favoriser le travail collectif de l'équipe éducative,\n\n- Accueillir, accompagner, soutenir et former les personnels,\n\n- Renforcer le pilotage et l'animation des réseaux.\n\n=> Pour l’ambition : nombreux projets EAC, cordées de la réussite, internats d’excellence, cités éducatives"], [42, "A la rentrée vous serez adjoint dans un établissement qui rencontre des problèmes de Harcèlement scolaire. Le CE va vous confier ce dossier qu’allez-vous mettre en place?", "A court terme :\n\n- échange avec le référent harcèlement de l’académie pour solliciter une expertise externe + l’EMS\n\n- présentation des objectifs CESC\n\n- mobilisation de l’équipe pédagogique (en particulier les professeurs principaux) en lien avec le CPE pour une sensibilisation : détecter les signaux faibles, définir la notion et les formes de harcèlement\n\n- Avec le CPE, aborder cette thématique en CVC ou CVL\n\n- communication (flyers, contacts...)\n\nA moyen terme :\n\n- intervention de l’EMS dans l’établissement\n\n- Mettre en œuvre des ambassadeurs formés au repérage des situations de harcèlement\n\n- actions à destination des parents\n\nA long terme :\n\n- inscription des classes de 6ème et 5ème à semaine « non au harcèlement »"], [43, "Que faire si des profs ne veulent pas être PP ? Et il vous manque 4 profs principaux à la rentrée.", "**Extrait du site SGEN CFDT **: Tout d’abord, rappelons que la désignation du/de la professeur.e principal.e est une des prérogatives du chef d’établissement.\n\nNéanmoins, le/la collègue doit être « désigné(e) avec l’accord de l’intéressé par le chef d’établissement pour la durée de l’année scolaire » comme le précise l’article 3 du Décret n°93-55 du 15 janvier 1993 instituant une indemnité de suivi et d’orientation des élèves en faveur des personnels enseignants du second degré.\n\nLa nécessité de l’accord du/de la professeur.e est par ailleurs confirmée par le décret n°2014-940 du 20 août 2014 sur les IMP dans son article 3 (sur les missions particulières).\n\nDONC, OUI, ON PEUT REFUSER D’ÊTRE PROFESSEUR·E PRINCIPAL·E.\n\n**Cependant, un chef d’établissement peut désigner d’autorité un.e professeur.e principal.e**. Ce n’est évidemment pas la meilleure façon de procéder d’autant que la personne désignée ne remplira pas ses fonctions de gaieté de cœur.\n\nSi on peut résister, il n’y a guère de doute que le juge administratif donnerait raison au chef d’établissement qui obligerait, **dans l’intérêt du service à rendre aux élèves**. »"], [44, "Un élève exige de la viande halal à la cantine. Que faites-vous?", "Je reçois le jeune et sa famille en rappelant le cadre :\n\n- le principe de la laïcité\n\n- la restauration est un service facultatif.\n\nJ’explique à la famille, qu’en lien avec la collectivité de rattachement, il a été fait le choix de ne pas différencier les menus pour des motifs religieux. En revanche, il est convenu de proposer des menus équilibrés pour les élèves qui ne souhaiteraient pas manger de viande. Enfin, en cuisine, du poisson est proposé en parallèle."], [45, "Vous êtes principal-adjoint dans un collège rural, c'est vendredi, il est 17h et la semaine a été difficile. On vous amène un élève qui a été exclu de cours pour insolence. Il est coutumier du fait. La principale le gifle. Que faites-vous ?", "- l’élève est envoyé chez le CPE le temps d’échanger avec ma collègue afin de comprendre son geste. Je lui demande si elle souhaite prévenir la famille et que je prenne la relève avec l’élève. Je lui conseille de prévenir la DSDEN du dérapage.\n\n- si elle souhaite que je poursuive avec l’élève, je reviens sur son comportement mais aussi revient sur le dérapage de la collègue. J’appelle les parents pour leur expliquer la situation, leur présente des excuses au nom de l’institution.\n\n- enfin, je reviens vers la collègue, m’assure qu’elle va bien. Je lui propose de l’aider à rédiger un rapport circonstancié à destination de la DSDEN."], [46, "Les profs refusent l'évaluation par compétences que faire?", "Je m’interroge d’abord sur la question. Est-ce que cette évaluation se substitue aux notes ? Si ce n’est pas le cas, il convient de rappeler que l’évaluation par compétences est dans tous les cas une obligation (rappel des modalités d’obtention du brevet + livret scolaire pour les lycées où sont présents des tableaux avec « Évaluation des compétences en référence aux programmes d’enseignement »). Il s’agit donc d’une obligation même si les notes sont maintenues.\n\nAprès leur avoir rappelé ce cadre, j’écoute les motivations de leur refus et leur propose de mobiliser une formation sur l’évaluation par compétences pour les accompagner. Je leur rappelle que ce type d’évaluation est au service des apprentissages. Elle favorise le suivi et l’accompagnement des élèves et des familles par la mise en place d’évaluations critériées.\n\nLES POINTS DU CONTRÔLE CONTINU\n\n| •**Degré de maîtrise** | **Nombre de points** |\n|------------------------|----------------------|\n| Maîtrise insuffisante  | 10 points            |\n| Maîtrise fragile       | 25 points            |\n| Maîtrise satisfaisante | 35 points            |\n| Très bonne maîtrise    | 50 points            |\n\n• soit **400 points**, pour une très bonne maîtrise des huit composantes du socle."], [47, "Vous êtes en lycée. Environ 900 DP. Un matin, vous arrivez et on vous annonce qu'il n'y a aucun agent aujourd’hui. Que faites-vous ?", "- **Évaluer l’urgence**\n\n\n\n- **Comprendre la situation** : Pourquoi les agents ne sont-ils pas disponibles (grève, maladie, autre) ? Y a-t-il des indications sur une reprise rapide ou s’agit-il d’une absence prolongée ?\n\n- **Identifier les besoins immédiats** : Repérer les impacts directs sur les élèves et les enseignants, notamment pour :\n\n  - Le service de restauration.\n\n  - L'entretien et la propreté (toilettes, salles de cours, couloirs).\n\n  - La sécurité des locaux (ouverture et fermeture, surveillance).\n\n\n\n- **Communiquer rapidement**\n\n\n\n- **Alerter la direction** : Si ce n’est pas déjà fait, informer immédiatement le chef d’établissement.\n\n- **Informer les équipes pédagogiques** :\n\n  - Leur signaler les impacts possibles (cantine fermée, classes à réorganiser).\n\n- **Informer les élèves et leurs familles** :\n\n  - Transmettre une communication claire expliquant la situation et les mesures temporaires prises (via SMS, mail ou affichage).\n\n  - Prévenir si un retour à domicile est envisagé.\n\n\n\n- **Rechercher des solutions provisoires**\n\n\n\n- **Mobiliser le personnel disponible** :\n\n  - Impliquer l’équipe administrative, les surveillants, et les enseignants volontaires pour assurer certains services d’urgence (ouverture des locaux, distribution de repas simples comme des sandwichs si possible).\n\n- **Faire appel à des renforts extérieurs** :\n\n  - Contacter la collectivité de rattachement (région/département) pour demander des renforts ponctuels (agents en remplacement).\n\n  - Solliciter des entreprises extérieures pour le nettoyage si besoin.\n\n\n\n- **Gérer la restauration**\n\n\n\n- **Solution simple** : Si la cantine ne peut pas être assurée, envisager de :\n\n  - Commander des repas à emporter (boulangerie ou traiteur local).\n\n  - Permettre aux élèves externes de quitter l’établissement plus tôt pour déjeuner à l’extérieur.\n\n- **Communication claire** :\n\n  - Informer les élèves que le déjeuner sera simplifié ou qu’ils doivent prévoir un repas.\n\n\n\n- **Maintenir la sécurité et l’ordre**\n\n\n\n- Assurer la surveillance des élèves par les équipes disponibles.\n\n- Limiter l’accès aux zones critiques (salles non nettoyées, cuisines, etc.).\n\n- Renforcer la vigilance sur les incidents potentiels.\n\n\n\n- **Faire un retour sur la situation**\n\n\n\n- **Bilan de la journée** : Recueillir les retours des équipes sur ce qui a bien/mal fonctionné.\n\n- **Préparer une solution durable** : Identifier les actions à mettre en place pour éviter qu’une telle situation ne se reproduise, comme :\n\n  - Renforcer la communication avec les agents.\n\n  - Prévoir un plan d’urgence en cas d’absence massive.\n\nLa priorité est de maintenir un cadre minimal pour les élèves et d’assurer leur sécurité. Une bonne communication et une coordination efficace entre les équipes présentes sont essentielles pour minimiser l’impact."], [48, "Comment mettre en place l'AP ?", "Au lycée ou collège ?\n\n**Au collège,** deux cas de figure, l’AP est intégré au service des enseignants sans dédoublement. C’était dans l’esprit de la réforme. Les séances d’AP étaient envisagées comme des temps de différenciation pédagogique avec une obligation 3 heures en 6ème, 1 à 2 heures sur les autres niveaux en fonction de la marge horaire, il est possible de mettre en œuvre des heures dédoublées en fonction des besoins identifiés, comme la maîtrise de la langue.\n\n**Au lycée pro**\n\n**« Consolidation, accompagnement personnalisé et accompagnement au choix d'orientation** »,\n\n=> La durée totale de l'accompagnement personnalisé en baccalauréat professionnel est de **265 heures** (soit environ 3 heures / semaines) à répartir sur les 84 semaines du cycle de trois ans et de **192,5 heures** en CAP (101,5 heures la première année et 91 heures la seconde année). **L'accompagnement personnalisé s'inscrit dans l'emploi du temps scolaire des élève**s.\n\n=> Donc identification des besoins en conseil pédagogique, sollicitation de professeurs volontaires autour de thématiques transversales, implication des PP\n\n**Doc de l’académie de Nantes :**\n\n[https://www.pedagogie.ac-nantes.fr/medias/fichier/consolidation-des-acquis-ap-accompagnement-de-l-orientation-min-2_1561974784880-pdf](https://www.pedagogie.ac-nantes.fr/medias/fichier/consolidation-des-acquis-ap-accompagnement-de-l-orientation-min-2_1561974784880-pdf)\n\n**Au lycée général (EDUSCOL)**\n\n« L'accompagnement personnalisé est intégré dans les emplois du temps des élèves.\n\nIl représente 72 heures annuelles en lycée d'enseignement général et technologique. 210 heures pour les trois années de préparation au baccalauréat professionnel y sont consacrées en lycée professionnel. **Cela représente deux heures par semaine en moyenne.**\n\n**Il a pour objectifs :**\n\n- d'apporter un soutien aux élèves\n\n- de leur permettre d'approfondir leurs connaissances\n\n- de les accompagner dans leur projet d'orientation\n\n- Il concerne tous les élèves et prend en compte l’ensemble de leurs besoins : soutien scolaire, approfondissement et aide à l’orientation.\n\nEn seconde, il permet avant tout d’acquérir et de consolider les méthodes de travail propres au lycée et offre aux élèves les outils nécessaires pour choisir la voie ou la série dans laquelle ils souhaitent s’engager.\n\nEn première, il favorise l'acquisition de compétences et permet à l'élève de commencer à réfléchir sur son projet d'études supérieures.\n\nEn classe terminale, il prend appui sur les enseignements constituant les dominantes disciplinaires et contribue à la finalisation du projet d'études supérieures.\n\n**Dans chaque lycée, le Conseil de la vie lycéenne (CVL) est consulté sur la mise en œuvre de l’accompagnement personnalisé. Il contribue à recenser les besoins des élèves et à évaluer le dispositif. »**"], [49, "Le CPE se présente avec un élève dans votre bureau, il vous indique que l’élève serait susceptible de détenir une arme (un couteau) d’après les propos qu’il a recueillis auprès d’autres élèves.", "A court terme : je demande à l’élève d’ouvrir son sac, son casier, de vider ses poches. Je l’informe qu’une rumeur circule le fait qu’il serait susceptible de détenir un couteau. Je lui rappelle que l’introduction d’un couteau dans un établissement est interdite.\n\nParallèlement, pendant qu’il reste avec le CPE, je reçois les élèves qui ont rapporté les propos de l’élève suspecté d’avoir un couteau afin de connaître ses intentions éventuelles (ex menaces).\n\nSi l’élève admet avoir un couteau : ce dernier est mis de côté. Je signale un fait établissement et appelle la DSDEN pour l’informer de la situation. Par ailleurs, je contacte le référent gendarmerie ou police de l’établissement et informe la famille de l’élève concerné.\n\nSi l’élève refuse toute fouille du sac, j’informe sa famille et préviens la police de la suspicion.\n\nSi l’élève a tout inventé (ou ses camarades) : rappel que la diffusion de fausses informations, rumeurs peut appeler des sanctions, en présence des parents."], [50, "Un assistant d’éducation vous interpelle dans la cour pour vous signaler qu’il a été témoin ce matin d’une altercation verbale entre un parent et un professeur, le père n’avait pas pris rendez-vous.", "De manière informelle, je vais à la rencontre de l’enseignant si tout va bien. En fonction de sa réponse, je l’invite à me suivre dans mon bureau pour l’assurer de mon soutien et lui demande de me rapporter la teneur de ses échanges avec le parent. En fonction de la gravité des propos tenus par le parent, je lui rappelle qu’il a la possibilité de déposer plainte. Je prends mon téléphone pour contacter le parent, lui rappelle que la prise de rendez-vous est nécessaire et l’invite à mesurer ses propos, en particulier en public contre un représentant de l’Etat, que les insultes contre un fonctionnaire constituent une infraction pénale. Je conviens avec lui d’un rendez-vous en établissement, propose à l’enseignant, s’il le souhaite, d’être associé à ce temps de rencontre.\n\nEnfin, à l’échelle de l’établissement, je fais une note de cadrage sur la réception des parents et rappel le contexte sanitaire, le plan Vigipirate qui renforcent la nécessité de communiquer à l’avance les rendez-vous à l’administration afin d’identifier les personnes extérieures qui pénètrent dans l’établissement."], [51, "Que pensez-vous de « devoirs faits » ?, Comment le mettre en œuvre de manière efficace ?", "Rappel, le dispositif a été lancé en 2017, sur la base du volontariat à destination des élèves de collège. En parallèle, déploiement de l’application Jules devoirs faits.\n\n**En début d’année, un diagnostic doit être fait. Il peut s’appuyer sur :**\n\n- les données APAE de l’établissement\n\n- les résultats des évaluations en sixième\n\n- les besoins identifiés par les équipes pédagogiques à la rentrée mais aussi lors des années précédentes avec le repérage des élèves en difficulté qui bénéficient de PAP ou de PPRE.\n\n- les besoins exprimés par les familles\n\n**Flécher des moyens :**\n\n- Lister les enseignants volontaires.\n\n- EDT (possibilité de mettre en œuvre des heures en barrette)\n\n- Le choix d’un relais intermédiaire : un enseignant coordonnateur de devoirs faits (IMP).\n\n- la mobilisation des AED, contrat civique\n\n- des HSE en fonction de l’enveloppe fournie par le Rectorat.\n\n**Former et uniformiser les pratiques**\n\n- formation établissement des acteurs engagés\n\n- élaboration d’un document assurant le lien et la continuité avec les familles\n\n**Bilans d’étapes nécessaires.**"], [52, "Vie scolaire et enseignants comment faire le lien ?", "=> Présence du CPE en conseil pédagogique\n\n=> présence d’AED lors de formations établissement\n\n=> référent AED / niveau en lien avec les professeurs principaux\n\n=> participation conjointe en CVC ou CVL\n\n= > projets d’EAC, valeurs de la république\n\n=> moments informels"], [53, "comment allez-vous mettre en place PIX dans votre établissement ?", "**- Se former sur PIX** :\n\n- Comprendre les modalités d’utilisation pour les élèves, enseignants et administrateurs.\n\n- Identifier les compétences numériques évaluées (5 domaines, 16 compétences).\n\n\n\n- **Intégrer PIX aux objectifs pédagogiques** :\n\n  - Identifier comment PIX s'inscrit dans les projets d'établissement, en particulier l'éducation numérique et l'acquisition de compétences transversales.\n\n\n\n- **Désigner un référent PIX**\n\n\n\n- Nommer un ou plusieurs **référents PIX** (enseignant ou personnel administratif).\n\n- Le référent sera responsable de :\n\n  - La gestion des comptes et de la plateforme.\n\n  - L'organisation des campagnes de certification.\n\n  - La formation et l'accompagnement des collègues.\n\n**3. Informer et former l’équipe éducative**\n\n- **Sensibiliser les enseignants** à PIX :\n\n  - Réunions pédagogiques pour expliquer les enjeux de PIX et son fonctionnement.\n\n  - Montrer comment intégrer PIX dans leurs disciplines (via des défis ou exercices liés à leurs cours).\n\n- **Proposer des formations** :\n\n  - Formation technique pour apprendre à utiliser la plateforme.\n\n  - Formation pédagogique sur l’intégration de PIX dans les pratiques éducatives.\n\n**4. Communiquer avec les élèves et les familles**\n\n- **Expliquer PIX aux élèves** :\n\n  - Présenter PIX comme un outil ludique pour développer leurs compétences numériques.\n\n  - Montrer l’utilité de la certification pour leur orientation ou leur entrée dans la vie active.\n\n- **Informer les familles** :\n\n  - Par des réunions ou des communications écrites (courriels, lettres).\n\n  - Souligner les bénéfices de PIX pour les parcours scolaires et professionnels.\n\n**5. Planifier la mise en œuvre**\n\n- **Créer les comptes élèves et enseignants** sur la plateforme PIX ORGA.\n\n- **Organiser des sessions régulières d'entraînement** :\n\n  - Intégrer PIX dans le cadre des cours (par exemple, en EMI ou en SNT pour les secondes).\n\n  - Prévoir des moments dédiés dans les emplois du temps (séances en salle informatique ou en autonomie).\n\n- **Définir un calendrier de certification** :\n\n  - Identifier les niveaux concernés (3ᵉ, terminale, BTS, etc.).\n\n  - Prévoir les sessions de certification obligatoires en respectant les directives nationales.\n\n**6. Intégrer PIX dans les pratiques pédagogiques**\n\n- **Projets interdisciplinaires** :\n\n  - Créer des activités ou des défis PIX dans le cadre de projets communs (recherche documentaire, outils collaboratifs, gestion des données).\n\n- **Approche différenciée** :\n\n  - Accompagner les élèves ayant des besoins spécifiques (par exemple, des élèves en difficulté numérique).\n\n- **Suivi et motivation** :\n\n  - Fixer des objectifs progressifs.\n\n  - Mettre en place des récompenses ou valoriser les efforts.\n\n**7. Organiser la certification**\n\n- **Sessions de certification obligatoires** :\n\n  - Organiser une ou deux sessions annuelles, selon les niveaux d’élèves.\n\n  - Préparer les élèves via des entraînements ciblés avant la session.\n\n- **Gestion technique** :\n\n  - S'assurer que le matériel est fonctionnel (ordinateurs, connexion Internet).\n\n  - Prévoir des surveillants et des supports en cas de problème.\n\n**8. Suivi et évaluation**\n\n- **Analyse des résultats** :\n\n  - Identifier les forces et les lacunes des élèves à partir des données PIX.\n\n  - Ajuster les formations ou les projets pédagogiques en conséquence.\n\n- **Feedback aux élèves et familles** :\n\n  - Valoriser les progrès réalisés.\n\n  - Aider les élèves à améliorer leurs compétences si nécessaire.\n\n**9. Pérenniser PIX**\n\n- **Faire de PIX une pratique régulière** :\n\n  - Le proposer dès la classe de seconde pour familiariser les élèves.\n\n  - Intégrer les compétences PIX dans les bulletins ou le livret scolaire.\n\n- **Développer une culture numérique dans l’établissement** :\n\n  - Encourager l'utilisation d'autres outils numériques.\n\n  - Inscrire PIX dans le projet numérique de l’établissement."], [54, "Qu'est-ce qu'une IMP? à quoi sert-elle? Tous les agents peuvent-ils percevoir une IMP?", "Indemnité pour mission particulière, mise en place en 2015. Elles peuvent concerner des missions effectuées dans un établissement mais également dehors d’un établissement lorsqu’il s’agit de missions départementales ou académiques. Exemple : coordination de projet, référent numérique, animation de la vie scolaire\n\nLes personnels enseignants et les CPE peuvent être concernés, elles sont accordées par le CE en CA\n\n5 taux annuels forfaitaires de 312,50 €, 625 €, 1 250 €, 2 500 € et 3 750 €\n\nLettre de mission et bilan de fin d’année\n\n=> Levier d’autonomie et confère au chef d’établissement un levier pédagogique."], [55, "Quels personnels le chef d'établissement peut-il recruter directement?", "Le CE, en lien avec le CPE, recrute ses AED. Il est associé à certains autres recrutements (professeurs, agents territoriaux) sans être décisionnaire. Enfin, il peut solliciter des services civiques.\n\n**Rappel services civiques :** C'est un engagement volontaire au service de l'intérêt général ouvert aux 16-25 ans, élargi à 30 ans aux jeunes en situation de handicap. Accessible sans condition de diplôme, le Service Civique est indemnisé et s'effectue en France ou à l'étranger.\n\n**AED :** Les AED sont recrutés par contrat
