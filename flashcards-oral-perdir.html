t des Liens avec les Parents** : Impliquer les familles dans le suivi scolaire de leurs enfants."], [283, "Utilisation de l'EDT pour Éviter le Décrochage", "L’emploi du temps (EDT) doit permettre de :\n\n- **Favoriser la Continuité Pédagogique** : Éviter les longues coupures entre les matières.\n\n- **Proposer des Activités Diversifiées** : Alterner entre théorique et pratique pour maintenir l'engagement des élèves."], [284, "Heures de Cours dans un EDT de Collégien", "Un collégien a généralement **entre 26 et 30 heures de cours par semaine**. Cela est justifié pour garantir une formation complète et équilibrée."], [285, "Équivalent de Devoirs faits au Lycée", "***Aide selon le budget restant pour du soutien ou tutorat par les professeurs ou AED***"], [286, "Parler de la Réforme du Lycée", "La réforme du lycée a pour objectif de :\n\n- **Personnaliser le Parcours des Élèves** : Offrir davantage de choix dans les spécialités et permettre une meilleure adéquation entre les formations et les attentes des élèves.\n\n- **Favoriser les Compétences Transversales** : Intégrer des projets pluridisciplinaires pour développer des compétences essentielles."], [287, "différence chef d’œuvre/projet au lycée professionnel", "Au lycée professionnel, le projet et le chef-d’œuvre visent à initier les lycéens pendant deux ans à des méthodes de travail en usage dans le milieu professionnel, notamment au travail en équipe. Le chef-d’œuvre est l’une des épreuves du CAP et le projet est l’une des épreuves du baccalauréat professionnel.\n\nC’est une réalisation, collective ou individuelle, qui permet d’exprimer ses talents en lien avec la spécialité de CAP choisie. La note finale du chef-d’œuvre est composée à 50 % de la moyenne des notes du livret scolaire ou de formation et à 50 % de la note de l’oral de présentation. \n\nProjet : Mis en place à la rentrée 2024, il permet d’introduire dans le cursus de baccalauréat professionnel en classes de première et de terminale des heures dédiées à :\n\n1.  un objet mobilisateur ;\n\n2.  une démarche accompagnée, à la fois individuelle et collective ;\n\n3.  l’acquisition de méthodes de travail transférables notamment dans le milieu professionnel.\n\nL’évaluation du projet de baccalauréat professionnel prend en compte : \n\n- Le contrôle en cours de formation : la conduite de la réalisation du projet, tout au long du parcours ;\n\n- Une présentation orale individuelle et un échange avec les enseignants, dont l’un de ceux ayant suivi le projet en juin.\n\nEn première, le volume horaire élève dédié à la réalisation d’un Projet s’élèvera à une heure trente hebdomadaires. Le volume horaire dédié au projet se poursuivra en terminale à hauteur d’une heure hebdomadaire. Pour rappel, les heures complémentaires de la Dotation Horaire Globale peuvent aussi servir pour des travaux de groupe pour le projet. Elles ne concernent pas seulement les enseignements généraux et/ou professionnels.\n\nLes chefs-d’œuvre de la République\n\n**Lancée en 2021, l’opération nationale \"Les chefs-d’œuvre de la République\" est ouverte à tous les lycées et à leurs partenaires institutionnels et concerne aussi bien le chef d’œuvre de CAP que le projet de baccalauréat professionnel. **\n\n**Son ambition :**\n\n- illustrer l’excellence de l’exigence professionnelle ;\n\n- valoriser une nouvelle génération de talents ;\n\n- permettre aux jeunes citoyens de contribuer à l’enrichissement du patrimoine de leurs institutions.\n\n**Chaque institution qui le souhaite (mairie, musée, théâtre, administration, conseil départemental ou régional, chambre consulaire…) peut commander un chef-d’œuvre lié aux métiers d’art ou industriels** et à l’ensemble des métiers du tertiaire, des services et du secteur sanitaire et social.\n\nCes chefs-d’œuvre de la République permettront aux élèves de** découvrir l’histoire, le patrimoine et les missions d’une institution, en y laissant leur empreinte.**"], [288, "Concours et Type d'Établissement Souhaité", "Je souhaiterais être nommé dans un établissement qui favorise l’innovation pédagogique et qui a une **catégorie financière intermédiaire**, permettant ainsi de bénéficier de moyens suffisants pour mettre en place des projets éducatifs ambitieux."], [289, "Différence entre Cellule de Veille et GPDS", "- **Cellule de Veille** : Se concentre sur l'identification et l'analyse des risques liés à l'absentéisme et au décrochage, permettant une réponse rapide.\n\n- **GPDS (Groupe de Pilotage du Décrochage Scolaire)** : Se charge de définir des stratégies à long terme pour prévenir le décrochage, impliquant différents acteurs et ressources de l’établissement."], [290, "Quelles sont les valeurs de la République ?", "Liberté, égalité, fraternité, laïcité, absence de discrimination"], [291, "Qu'est-ce que le carré régalien ?", "A compter de la rentrée 2021, chaque académie est dotée d'un carré régalien pour identifier et coordonner son action dans quatre domaines : protection et promotion des valeurs de la République, lutte contre les communautarismes, lutte contre les violences scolaires et lutte contre le harcèlement."], [292, "Quelles sont les principes fondamentaux reconnus par les lois de la République ?", "Liberté d’association, respect des droits de la défense, liberté individuelle, liberté de conscience, liberté d’enseignement."], [293, "Les 5 symboles officiels de l’État français", "Les symboles de l’État français incarnent l’identité nationale et les valeurs de la République. Voici les principaux :\n\n1.  **Le drapeau tricolore** : Bleu, blanc, rouge. Le drapeau est l'emblème national, représentant l’unité de la nation.\n\n2.  **L’hymne national** : La **Marseillaise**, chant révolutionnaire devenu l’hymne officiel de la France en 1795.\n\n3.  **La devise** : **Liberté, Égalité, Fraternité**. Cette devise est un symbole des valeurs républicaines issues de la Révolution française.\n\n4.  **Marianne** : Représentation symbolique de la République, souvent sous les traits d’une femme portant le bonnet phrygien, symbole de la liberté.\n\n5.  **Le sceau et la langue française** : Le sceau de l’État, utilisé pour officialiser des actes, et la langue française, définie comme langue officielle de la République par la Constitution."], [294, "Que faire si une élève arrive voilée dans l’établissement ?", "Si une élève arrive voilée dans un établissement scolaire public, la loi de 2004 sur les **signes religieux ostensibles** s’applique. Voici la marche à suivre :\n\n1.  **Rappel de la loi** : La loi interdit le port de signes religieux ostensibles dans les écoles, collèges et lycées publics. Il est donc nécessaire de rappeler à l’élève que le voile, en tant que signe ostensible, n’est pas autorisé.\n\n2.  **Entretien individuel** : Organiser un entretien avec l’élève pour expliquer la loi, dans le respect de la personne et de ses croyances. Cette discussion doit être bienveillante et pédagogique.\n\n3.  **Dialogue avec les parents** : Si nécessaire, informer les parents de la situation et leur rappeler le cadre légal en vigueur dans les établissements publics.\n\n4.  **Mise en conformité** : Si l’élève persiste à porter le voile, elle peut être invitée à se conformer à la loi, et en cas de non-respect, des sanctions pédagogiques adaptées peuvent être envisagées (mise à l'écart provisoire, convocation d’un conseil de discipline si le dialogue n’aboutit pas).\n\nL’approche doit toujours être guidée par le respect des droits de l’enfant et la volonté de maintenir un climat serein et inclusif."], [295, "Comment réagissez-vous si vous apprenez qu’un adulte a levé la main sur un élève ?", "Dans une telle situation, la protection de l’élève est prioritaire, et des actions immédiates doivent être prises :\n\n1.  **Réagir immédiatement** : Si l’incident est en cours, il est essentiel d’intervenir directement pour mettre fin à l’agression.\n\n2.  **Recueillir les témoignages** : Interroger les personnes impliquées (l’élève, l’adulte et les éventuels témoins) pour comprendre les circonstances précises.\n\n3.  **Informer la hiérarchie** : Le chef d’établissement doit être informé immédiatement de la situation pour prendre les mesures nécessaires.\n\n4.  **Engager une procédure disciplinaire** : Si l’adulte est un membre du personnel, une enquête interne sera menée, pouvant entraîner des sanctions disciplinaires (mise à pied, licenciement, etc.). Si l'adulte est un externe, des poursuites judiciaires peuvent être envisagées.\n\n5.  **Protéger l’élève** : Assurer à l’élève un suivi, notamment en lui proposant un soutien psychologique si nécessaire.\n\n6.  **Déclaration obligatoire** : Selon la gravité des faits, il est obligatoire de signaler l’incident aux autorités compétentes (protection de l’enfance, inspection académique) et potentiellement au procureur de la République si des faits graves sont avérés.\n\nLa réaction doit être rapide, juste et proportionnée, en respectant les droits de toutes les parties tout en assurant la sécurité et le bien-être des élèves."], [296, "Différences entre valeurs et principes attachés à la République française", "Il est important de distinguer les **valeurs** et les **principes** de la République française, bien qu’ils soient complémentaires.\n\n- **Les valeurs** : Ce sont des idéaux moraux qui guident les comportements et la société. Elles constituent l'esprit de la République et sont inscrites dans la devise nationale :\n\n  - **Liberté** : Le respect des droits et des libertés individuels (liberté de conscience, d’expression, etc.).\n\n  - **Égalité** : Tous les citoyens doivent être égaux en droits, quelle que soit leur origine, leur religion, ou leur situation sociale.\n\n  - **Fraternité** : L’esprit de solidarité et d’entraide entre les citoyens, qui sous-tend le vivre-ensemble.\n\n- **Les principes** : Ce sont les règles fondamentales sur lesquelles repose l’organisation de la République. Ils sont juridiques et structurent le fonctionnement de l'État :\n\n  - **Indivisibilité** : La République est une et indivisible, le territoire et l’unité nationale ne peuvent être fractionnés.\n\n  - **Laïcité** : Principe de séparation de l’État et des religions, garantissant la neutralité de l’État et la liberté de croyance.\n\n  - **Démocratie** : La République repose sur le principe de la souveraineté du peuple, qui s’exprime notamment par le suffrage universel.\n\n  - **Sociale** : La République garantit la protection sociale des citoyens, comme le droit à l'éducation et à la santé.\n\nEn résumé, les **valeurs** sont des idéaux à atteindre pour vivre en société, tandis que les **principes** sont les fondements juridiques et organisationnels qui régissent la République."], [297, "Que pensez-vous de l’enseignement religieux obligatoire en Alsace et en Moselle ?", "L'enseignement religieux obligatoire en Alsace-Moselle est une exception liée à l’histoire particulière de ces territoires. Le régime concordataire, toujours en vigueur dans ces régions, découle du fait qu'Alsace et Moselle étaient sous contrôle allemand au moment de la loi de 1905 sur la séparation des Églises et de l’État. Lorsque ces territoires sont redevenus français, ce régime a été maintenu.\n\nCet enseignement religieux obligatoire pose un certain nombre de questions par rapport au **principe de laïcité** appliqué dans le reste de la France. Voici quelques points de réflexion :\n\n1.  **Respect des traditions locales** : Cet enseignement fait partie d’une tradition locale héritée de l’histoire, et beaucoup d’habitants d’Alsace et de Moselle y sont attachés. Cela témoigne de la diversité culturelle et historique au sein du territoire français.\n\n2.  **Tension avec le principe de laïcité** : Dans le reste de la France, le principe de laïcité impose la neutralité religieuse de l’État et interdit tout enseignement religieux dans les établissements publics. Ce régime particulier peut donc apparaître en contradiction avec l’idéal d'égalité de traitement sur l'ensemble du territoire national.\n\n3.  **Choix des parents et respect de la liberté de conscience** : Bien que l’enseignement religieux soit obligatoire, les familles ont la possibilité de choisir entre plusieurs religions (catholicisme, protestantisme, judaïsme) ou de demander une dispense. Cela garantit en partie la liberté de conscience, mais la dispense est souvent perçue comme stigmatisante pour ceux qui ne suivent pas cet enseignement.\n\n4.  **Possible réforme ou maintien du régime spécifique ?** : Le débat persiste sur l’éventualité d’harmoniser le régime d’enseignement religieux avec le reste de la France, mais une telle réforme toucherait aux sensibilités locales et à l’équilibre historique des relations entre l’État et les cultes dans ces régions.\n\nEn résumé, l’enseignement religieux obligatoire en Alsace-Moselle est à la fois le reflet d’une **spécificité historique** et un **défi à l’unité laïque** du modèle français. C’est un sujet complexe qui demande de concilier respect des particularismes locaux et promotion d’un principe républicain fondamental : la laïcité."], [298, "Exemples d’actions républicaines au sein de l’établissement", "Des actions républicaines peuvent être mises en place dans un établissement scolaire pour promouvoir les valeurs et les principes de la République française. Voici quelques exemples concrets :\n\n1.  **Cérémonie de remise des diplômes ou du brevet** : Organiser des cérémonies solennelles pour valoriser la réussite scolaire de tous les élèves. Cela met en avant l'égalité des chances et le mérite républicain.\n\n2.  **Semaine de la laïcité** : Chaque année, le 9 décembre, les établissements sont invités à célébrer la Journée de la Laïcité. Cela peut se faire via des débats, des expositions ou des projets pédagogiques autour de la tolérance, du respect de la diversité et de la neutralité religieuse.\n\n3.  **Conseil de vie collégienne ou lycéenne (CVC/ CVL)** : Encourager la participation des élèves aux conseils de la vie scolaire leur permet d’exercer un rôle actif dans la gestion de l’établissement. C’est un excellent moyen de les initier à la démocratie représentative et à la citoyenneté active.\n\n4.  **Cérémonie de citoyenneté** : Organiser une cérémonie de remise des cartes électorales aux élèves majeurs pour marquer symboliquement leur entrée dans la citoyenneté et leur droit de vote. Cela peut être accompagné d’interventions sur le fonctionnement de la démocratie.\n\n5.  **Débats républicains** : Organiser des débats ou des joutes oratoires sur des thèmes liés aux valeurs républicaines (liberté d’expression, égalité, justice sociale). Cela permet aux élèves de s’exprimer et de réfléchir de manière critique aux grands principes qui régissent la société.\n\n6.  **Projets commémoratifs** : Encourager les élèves à participer aux commémorations des grandes dates de la République, comme le 11 novembre ou le 8 mai. Ces cérémonies renforcent la mémoire collective et l’attachement aux valeurs républicaines.\n\n7.  **Promotion de l’inclusion et de la mixité sociale** : Mettre en place des actions contre les discriminations (racisme, sexisme, homophobie, etc.) en lien avec les valeurs de fraternité et d’égalité, par exemple à travers des interventions d'associations, des ateliers de sensibilisation, ou des projets artistiques inclusifs.\n\n8.  **Le devoir de mémoire** : Organiser des visites de lieux de mémoire (comme des musées sur la Shoah, des monuments aux morts, etc.) pour sensibiliser les élèves aux luttes pour la liberté, à l’histoire de la République et à la nécessité de défendre ses valeurs.\n\nCes actions permettent d’**ancrer les valeurs républicaines** dans la vie quotidienne de l’établissement et de former des citoyens éclairés et engagés dans la société."], [299, "Citez les 5 grands principes de notre système éducatif", "Liberté, gratuité, laïcité, obligation scolaire, neutralité.\n\n### **300. Dispositifs d’accompagnement scolaire aux élèves dans le second degré**\n\nDans le second degré, plusieurs dispositifs existent pour accompagner les élèves :\n\n- **Accompagnement personnalisé (AP)** : Des heures dédiées à l’aide individualisée, au soutien scolaire, au renforcement des compétences ou à l’approfondissement dans certaines matières.\n\n- **Devoirs faits** : Dispositif visant à accompagner les élèves dans la réalisation de leurs devoirs.\n\n- **Soutien et remédiation pédagogique** : Pour les élèves ayant des difficultés scolaires, des heures de soutien sont prévues pour travailler sur des points spécifiques.\n\n- **Tutorat** : Un enseignant ou un élève plus âgé prend en charge un élève en difficulté pour le guider dans son travail.\n\n- **Programme de réussite éducative (PRE)** : Un dispositif global impliquant plusieurs acteurs (enseignants, parents, éducateurs) pour favoriser la réussite des élèves les plus en difficulté.\n\n- **Parcours personnalisé de réussite éducative (PPRE)** : Programme de remédiation mis en place pour les élèves qui ont des difficultés importantes, particulièrement à la fin du collège.\n\n- **Dispositif ULIS (Unité Localisée pour l'Inclusion Scolaire)** : Un accompagnement pour les élèves en situation de handicap."], [301, "Analyse des évaluations à l’entrée en seconde", "L’analyse des évaluations à l’entrée en seconde permet de :\n\n- **Identifier les points forts et les faiblesses** : Les résultats peuvent mettre en lumière des lacunes en français, mathématiques, ou autres compétences. Cela guide les actions de soutien.\n\n- **Adapter l’accompagnement personnalisé** : Les données peuvent être utilisées pour définir les priorités de l’accompagnement personnalisé dans les premières semaines de lycée.\n\n- **Mise en place de groupes de remédiation** : À partir des résultats, des groupes de niveau peuvent être créés pour offrir des réponses pédagogiques adaptées.\n\n- **Suivi individualisé** : Ces évaluations servent de base pour organiser un suivi des élèves en difficulté et leur proposer des solutions spécifiques (PPRE, tutorat, etc.).\n\n(Le fichier Excel auquel vous faites référence pourrait inclure des résultats chiffrés des évaluations, une analyse graphique pourrait être utile pour visualiser les répartitions par niveau et par compétence.)"], [302, "Rôle du chef d’établissement dans le processus d’orientation", "Le chef d’établissement joue un rôle clé dans l’orientation des élèves :\n\n- **Coordination des équipes éducatives** : Il s’assure que les professeurs principaux, PsyEN, et autres intervenants travaillent ensemble pour guider les élèves.\n\n- **Pilotage du conseil de classe** : Il préside les conseils de classe qui valident les décisions d’orientation.\n\n- **Lien avec les familles** : Le chef d’établissement communique avec les familles pour expliquer les orientations proposées et recueillir leurs avis.\n\n- **Appui à la prise de décision** : Il aide à arbitrer entre différentes voies possibles, notamment lorsque les choix de l’élève et des familles divergent des préconisations du conseil de classe.\n\n- **Encouragement à l’ambition scolaire** : Par son leadership, il peut impulser une dynamique d’ambition et de réussite pour l’ensemble des élèves."], [303, "Notion de \"continuum bac-3 / bac+3\"", "Le **continuum bac –3 / bac +3** est une politique éducative visant à assurer une continuité entre le collège, le lycée et les premières années post-bac. L’idée est d’accompagner les élèves dès la classe de troisième (bac-3) dans la construction de leur projet scolaire et professionnel, et de leur offrir une cohérence éducative et pédagogique jusqu’au bac+3 (niveau licence). Cela se traduit par :\n\n- **Un accompagnement progressif dans l’orientation** dès le collège.\n\n- **Une préparation aux études supérieures** dès le lycée, en adaptant les méthodes de travail et en favorisant les compétences transversales.\n\n- **Un suivi et un accompagnement** jusqu’à la fin du premier cycle universitaire, pour éviter les ruptures d’études."], [304, "Comment développer l’ambition scolaire des élèves ?", "Pour développer l’ambition scolaire, plusieurs leviers peuvent être activés :\n\n- **Valorisation de la réussite** : Mettre en avant les réussites individuelles et collectives, tant dans les apprentissages que dans les projets, pour motiver les élèves.\n\n- **Différenciation pédagogique** : Adapter l’enseignement aux besoins spécifiques des élèves, en valorisant leurs progrès, quels que soient leurs points de départ.\n\n- **Développement de l'estime de soi** : Favoriser la confiance en soi des élèves en mettant l’accent sur leurs compétences et en encourageant une attitude positive face aux défis scolaires.\n\n- **Ouverture culturelle et professionnelle** : Multiplier les rencontres avec des professionnels, les visites d’entreprises, et les interventions de personnes issues de l’enseignement supérieur pour montrer la diversité des parcours possibles.\n\n- **Accompagnement individualisé** : Proposer un suivi personnalisé, notamment avec le professeur principal et les PsyEN, pour aider chaque élève à définir ses objectifs."], [305, "Modalités spécifiques pour accompagner les élèves de terminale dans leur orientation", "Au lycée, plusieurs dispositifs existent spécifiquement pour les élèves de terminale :\n\n- **Parcoursup** : Plateforme qui permet aux élèves de terminale de faire leurs vœux d’orientation post-bac. Les lycées organisent des séances d’information et d’accompagnement sur le fonctionnement de cette plateforme.\n\n- **Heures dédiées à l'orientation** : En terminale, des heures spécifiques peuvent être consacrées à l’orientation, animées par le professeur principal ou le PsyEN.\n\n- **Forum des métiers et des formations** : Des événements sont souvent organisés dans les lycées pour permettre aux élèves de rencontrer des professionnels et des représentants de formations supérieures.\n\n- **Simulations d’entretiens** : Certains établissements mettent en place des simulations d’entretiens d’admission pour préparer les élèves aux procédures de sélection post-bac.\n\n- **Accompagnement des projets personnels** : Les élèves peuvent être encouragés à élaborer un projet personnel et professionnel en lien avec leurs ambitions."], [306, "Missions d’une PsyEN (Psychologue de l'Éducation nationale)", "Les PsyEN ont plusieurs missions, notamment :\n\n- **Accompagnement individuel des élèves** : Ils reçoivent les élèves en entretien pour les aider à clarifier leurs choix d’orientation, résoudre des difficultés scolaires ou personnelles, et les aider à élaborer un projet d’avenir.\n\n- **Participation aux conseils de classe** : Ils contribuent aux discussions sur l’orientation des élèves.\n\n- **Animation de séances collectives d’information** : Ils informent les élèves sur les différentes voies d’orientation et les métiers.\n\n- **Soutien aux équipes pédagogiques** : Ils apportent leur expertise psychologique pour favoriser la réussite des élèves et prévenir le décrochage scolaire."], [307, "Qu’est-ce qu’un stage passerelle ? Comment le mettre en place ?", "Le **stage passerelle** est un dispositif permettant à un élève de tester une autre filière avant de s’y engager. Cela permet d’éviter des réorientations brusques ou de remédier à une erreur d’orientation. Pour le mettre en place :\n\n- **Coordination avec l’établissement d’accueil** : Le chef d’établissement et l’équipe pédagogique organisent la logistique et l’accompagnement pendant le stage.\n\n- **Définition des objectifs du stage** : Il est important de clarifier avec l’élève les attentes et les compétences à observer ou à acquérir.\n\n- **Suivi régulier** : Un suivi est réalisé pendant et après le stage pour évaluer si la nouvelle orientation convient à l’élève."], [308, "Rôle du professeur principal", "Le professeur principal a un rôle central dans l’accompagnement des élèves. Ses principales missions sont :\n\n- **Suivi pédagogique et personnel des élèves** : Il veille à la réussite de chaque élève, en établissant un lien régulier avec eux et leurs familles.\n\n- **Coordination avec les autres enseignants** : Il assure le lien entre l’équipe pédagogique et l’élève.\n\n- **Accompagnement dans l'orientation** : Il guide les élèves dans leurs choix d’orientation, notamment à travers des entretiens personnalisés.\n\n- **Information sur les procédures d’orientation** : Il informe la classe sur les différentes possibilités d’orientation et les procédures administratives."], [309, "Missions du référent décrochage scolaire", "Le référent décrochage scolaire a pour mission de prévenir et de lutter contre le décrochage scolaire. Ses actions incluent :\n\n- **Identification des élèves à risque** : Il détecte les élèves en situation de décrochage scolaire potentiel.\n\n- **Mise en place de dispositifs adaptés** : Il propose des actions spécifiques pour les élèves décrocheurs, comme le tutorat, le mentorat, ou l’inclusion dans des dispositifs de remédiation.\n\n- **Coordination avec les familles** : Il dialogue avec les familles pour les impliquer dans la scolarité de l’élève.\n\n- **Accompagnement au retour en formation** : Pour les élèves décrocheurs, il aide à élaborer un projet de réintégration scolaire ou de formation adaptée.\n\nCes réponses couvrent l'ensemble des thématiques abordées et mettent en lumière les différents dispositifs et acteurs impliqués dans l'accompagnement des élèves au sein du système éducatif."], [310, "Quelles instances sollicitez-vous tout au long du processus d'évaluation ?", "Tout au long du processus d'évaluation d'un établissement scolaire, plusieurs instances peuvent être sollicitées :\n\n- **Conseil pédagogique** : Il joue un rôle central en définissant les orientations pédagogiques et en participant à l’élaboration du projet d’établissement.\n\n- **Conseil d'administration** : Il valide les orientations stratégiques issues de l'évaluation et adopte les conclusions.\n\n- **Conseil des délégués pour la vie lycéenne (CVL)** ou **Conseil des délégués pour la vie collégienne (CVC)** : Ces instances permettent de recueillir l'avis des élèves sur le fonctionnement de l’établissement.\n\n- **Équipe de direction** : Composée du chef d’établissement, de ses adjoints, et des gestionnaires, cette équipe pilote l’évaluation.\n\n- **Personnels éducatifs et enseignants** : Leur participation active permet de mesurer l’efficacité des dispositifs pédagogiques.\n\n- **Parents d’élèves** : Ils sont consultés via les représentants élus pour connaître leur perception du fonctionnement de l’établissement.\n\n- **PsyEN et CPE** : Ils contribuent par leur expertise sur les problématiques liées à l'accompagnement des élèves.\n\n- **Inspecteurs de l’Éducation nationale (IEN)** et **Inspecteurs pédagogiques régionaux (IPR)** : Ils peuvent intervenir pour apporter une expertise extérieure dans l'évaluation pédagogique et administrative.\n\n- **Collectivité territoriale de rattachement** : Responsable de l'entretien matériel et du budget des établissements, elle est sollicitée pour des aspects logistiques et financiers de l’évaluation."], [311, "Quels sont les enjeux de l’évaluation ?", "L’évaluation d’un établissement scolaire comporte plusieurs enjeux :\n\n- **Amélioration continue** : Identifier les forces et faiblesses de l’établissement pour améliorer la qualité de l'enseignement et des conditions d’apprentissage.\n\n- **Rendre compte** : L’évaluation permet de faire un bilan auprès de la communauté éducative, des parents, et des instances de tutelle sur les actions menées et leurs résultats.\n\n- **Réussite des élèves** : L’évaluation vise avant tout à améliorer les conditions permettant la réussite des élèves, en identifiant les obstacles et en proposant des solutions.\n\n- **Développement professionnel** : Elle permet de cibler les besoins en formation des enseignants et des autres personnels pour répondre aux objectifs pédagogiques.\n\n- **Conformité aux objectifs** : L’évaluation assure que les actions mises en place sont en phase avec les objectifs nationaux et locaux définis dans le projet d’établissement.\n\n- **Innovation pédagogique** : Elle peut mettre en lumière des initiatives efficaces qui méritent d’être développées ou généralisées."], [312, "Quelles suites possibles à l’évaluation ?", "Les suites possibles à l’évaluation d’un établissement scolaire incluent :\n\n- **Élaboration ou révision du projet d’établissement** : Les conclusions de l’évaluation permettent de réajuster ou de redéfinir les axes prioritaires du projet d’établissement.\n\n- **Mise en place de plans d’action** : À la suite de l’évaluation, des plans concrets peuvent être élaborés pour corriger les points faibles identifiés (remédiation pédagogique, amélioration du climat scolaire, etc.).\n\n- **Formations des équipes pédagogiques** : L'évaluation peut révéler des besoins en formation, conduisant à la mise en place de programmes adaptés pour les enseignants.\n\n- **Suivi et ajustement des pratiques pédagogiques** : Les pratiques éducatives peuvent être modifiées ou ajustées pour mieux répondre aux besoins des élèves et améliorer les résultats scolaires.\n\n- **Dialogue avec les partenaires** : L'évaluation peut conduire à renforcer la collaboration avec des partenaires externes (collectivités territoriales, associations, entreprises) pour la mise en œuvre de projets ou d’actions spécifiques."], [313, "Comment accompagner les équipes à l’issue du bilan de l’auto-évaluation ?", "L’accompagnement des équipes après l’auto-évaluation est essentiel pour garantir une dynamique d’amélioration. Voici comment cela peut se faire :\n\n- **Organisation de temps d’échanges** : Mettre en place des réunions collectives pour partager les résultats et impliquer toute la communauté éducative dans la recherche de solutions.\n\n- **Formation continue** : Proposer des formations en lien avec les conclusions de l’évaluation pour permettre aux enseignants de développer de nouvelles compétences ou d’ajuster leurs pratiques pédagogiques.\n\n- **Soutien individualisé** : Accompagner certains enseignants ou équipes dans la mise en œuvre des changements nécessaires via du coaching, du tutorat, ou des conseils individualisés.\n\n- **Plan d’action concret** : Co-construire avec les équipes un plan d’action réaliste et opérationnel, en définissant des objectifs mesurables et des échéances précises.\n\n- **Communication régulière** : Assurer une communication continue sur l’avancée des actions mises en place à la suite du bilan pour maintenir l’engagement de tous."], [314, "À quel moment la collectivité territoriale de rattachement est-elle impliquée dans le processus d’évaluation ?", "La **collectivité territoriale de rattachement** (la région pour les lycées, le département pour les collèges) est impliquée dans le processus d’évaluation principalement dans deux contextes :\n\n- **Évaluation des infrastructures et des moyens matériels** : La collectivité est responsable des bâtiments, des équipements et du budget alloué à l’établissement. L’évaluation peut révéler des besoins en termes de rénovation, d’aménagements, ou d’équipements supplémentaires, nécessitant l’intervention de la collectivité.\n\n- **Phase de bilan et planification** : À l’issue de l’évaluation, la collectivité est sollicitée pour adapter ses investissements en fonction des conclusions (nouvelles infrastructures, modernisation du matériel pédagogique, etc.)."], [315, "Quelle est la finalité de l’évaluation des établissements ?", "La finalité principale de l’évaluation des établissements scolaires est **l’amélioration continue** des performances de l’établissement afin de favoriser la réussite de **tous les élèves**. Elle permet :\n\n- D’ajuster les pratiques pédagogiques pour mieux répondre aux besoins des élèves.\n\n- D’améliorer le climat scolaire et les conditions d’apprentissage.\n\n- De rendre compte de l’efficacité des actions mises en place auprès des partenaires (personnels, parents, administration, etc.).\n\n- D’assurer que les objectifs nationaux et locaux sont bien intégrés et respectés.\n\nL’évaluation vise ainsi à garantir que l’établissement est en **cohérence avec les valeurs républicaines**, qu’il promeut l’égalité des chances, et qu’il favorise l’émancipation et la réussite de chaque élève."], [316, "Comment faire vivre la démarche d’auto-évaluation à long terme ?", "Pour faire vivre la démarche d’auto-évaluation à long terme, il est essentiel de :\n\n- **Institutionnaliser le processus** : Faire de l’auto-évaluation une pratique régulière en l’intégrant dans le calendrier de l’établissement, avec des bilans périodiques.\n\n- **Impliquer toute la communauté éducative** : S’assurer que l’ensemble des parties prenantes (enseignants, élèves, parents, personnels) est régulièrement consulté et engagé dans le processus.\n\n- **Créer des indicateurs de suivi** : Définir des indicateurs clairs pour mesurer les progrès réalisés, que ce soit en termes de résultats scolaires, de climat scolaire ou de pratiques pédagogiques.\n\n- **Former les équipes** : Former les personnels à l’auto-évaluation et à l’utilisation des outils d’analyse pour qu’ils soient en mesure de piloter eux-mêmes la démarche.\n\n- **Ajuster les objectifs** : Faire évoluer les objectifs du projet d’établissement en fonction des conclusions de chaque auto-évaluation, afin de maintenir une dynamique d’amélioration."], [317, "Qu’est-ce qu’un projet d’établissement ?", "Un **projet d’établissement** est un document stratégique qui définit les grandes orientations pédagogiques, éducatives, et administratives d’un établissement scolaire sur plusieurs années (en général 3 à 5 ans). Il est élaboré en concertation avec l’ensemble des acteurs de la communauté éducative (enseignants, élèves, parents, personnels) et validé par le conseil d’administration.\n\nLe projet d’établissement a plusieurs fonctions :\n\n- **Fixer des objectifs pédagogiques** : Il définit les priorités en matière de réussite scolaire, d’accompagnement des élèves, et de gestion des parcours d’orientation.\n\n- **Donner un cadre aux actions éducatives** : Il précise les actions à mettre en place pour améliorer le climat scolaire, favoriser l’égalité des chances, et encourager les pratiques innovantes.\n\n- **Mobiliser les ressources** : Il sert de base pour organiser les moyens humains, financiers et matériels de l’établissement en fonction des objectifs fixés.\n\n- **Assurer une cohérence avec les orientations nationales** : Le projet d’établissement doit être en cohérence avec les politiques éducatives nationales et académiques.\n\nEn résumé, le projet d’établissement est un **outil de pilotage** central pour améliorer la qualité de l’enseignement et la réussite des élèves."], [318, "En quoi des pratiques interdisciplinaires, croisées ou partagées, vous semblent-elles être une réponse appropriée à certaines difficultés des élèves ?", "En tant que chef d’établissement, je me suis vite aperçu que le travail interdisciplinaire faisait immanquablement réfléchir sur la pratique individuelle. Et je pense aussi que le croisement du regard de plusieurs adultes lors d’une réalisation collective permet toujours de trouver des réponses à des difficultés d’élèves. D’autre part, le projet collectif permet de s’éloigner de la contrainte strictement disciplinaire. Ainsi, dans mon établissement actuel, nous organisons une semaine des arts et de la culture. Une douzaine d’enseignants ainsi que le CPE travaillent sur ce projet. Les élèves qui y participent sont évalués à la fois sur des points de programme disciplinaires, mais aussi sur des compétences transdisciplinaires. Notes et évaluation de compétences du socle cohabitent et fonctionnent de manière complémentaire.\n\nJe pense que deux facteurs majeurs freinent ces dialogues : les habitudes et points de vue de quelques collègues, souvent peu nombreux mais qui peuvent avoir une certaine influence en salle des professeurs, et le manque de vision pédagogique du chef d’établissement."], [319, "Alors, comment est-ce qu’un chef d’établissement peut impulser très concrètement le gout de l’interdisciplinarité au sein de son établissement ?", "Dans un premier temps, je pense qu’il est important d’observer les équipes. Il faut rencontrer les collègues, se faire expliquer les différentes actions, les fonctionnements. Cette rencontre permet de repérer ce qui se fait dans l’établissement et de le valoriser. Il est nécessaire que les personnels puissent savoir tout ce qui se fait et ainsi disposer d’une réelle lisibilité des actions menées. Le chef d’établissement a alors à repérer ce qu’il est possible de mettre en perspective, les leadeurs positifs ainsi que les complémentarités possibles. J’essaie aussi de donner une place réelle à l’ensemble des disciplines et une place à tous les personnels, même non-enseignants. Par exemple, lors des réflexions autour du projet d’établissement, je veille à constituer les groupes avec professeurs, agents de service, assistants d’éducation, assistante sociale, infirmière.\n\nDe mon point de vue, le chef d’établissement doit avoir une vision pédagogique à long terme. Il doit repérer ce qui peut être amélioré et amener les équipes à réfléchir autour de deux ou trois problématiques annuelles intégrées aux axes du projet d’établissement, qui est un moteur de la réflexion et permet de donner une visibilité supplémentaire aux actions menées.\n\nIl faut aussi pouvoir dégager du temps pour favoriser la réflexion. À Loos-en-Gohelle puis à Calais, j’ai instauré une heure blanche dans l’emploi du temps des élèves et des professeurs. Durant ce créneau horaire, je réunis trois ou quatre fois le conseil pédagogique au cours de l’année pour alimenter la réflexion. Souvent, les collègues s’emparent de ce créneau pour travailler ensemble autour de projets communs. Cette heure blanche permet aussi de réunir plusieurs enseignants et plusieurs élèves (parfois de classes ou de niveaux différents) pour des cours interdisciplinaires. Et au-delà de cette heure blanche, la constitution des emplois du temps donne aussi la possibilité aux collègues qui le souhaitent d’intervenir en même temps. La priorité est donc donnée aux demandes pédagogiques, sans pour autant massacrer les emplois du temps des élèves et des enseignants, bien entendu. D’ailleurs, j’ai noté une constante assez amusante à propos de cette confection des emplois du temps : le travail interdisciplinaire se propage ! Au début, c’est facile, parce que les demandes de ce type sont minimes. Au bout de trois ans, la réalisation des emplois du temps devient ultracomplexe, parce que les demandes sont beaucoup plus nombreuses. Surement parce que les résultats des élèves suivent.\n\nD’autre part, les dispositifs doivent être évalués annuellement. Ce n’est pas parce qu’une expérimentation n’a pas donné tous les résultats escomptés qu’il faut nécessairement l’abandonner. Elle aura besoin d’être débriefée et devra probablement évoluer. Le chef d’établissement doit être à la manœuvre pour accompagner les équipes vers cette évolution.\n\nEnfin, je pense qu’il me faut trouver des marges de manœuvre dans le budget global pour financer les expérimentations et le dialogue des disciplines, même si souvent, les collègues sont rétribués bien en deçà de leur investissement personnel. J’essaie toujours de lier l’utilisation des moyens au projet d’établissement, et le projet d’établissement est intimement dirigé vers la réussite des élèves. Finalement, le secret de la coopération entre les disciplines ne serait-il pas de faire dialoguer les personnels autour de la réussite des élèves ?"], [320, "Quelle est votre vision du rôle de personnel de direction dans un établissement scolaire ?", "Le rôle de personnel de direction va au-delà de la gestion administrative. C’est un poste stratégique qui demande de savoir fédérer l’équipe éducative autour d’une vision partagée, tout en s’assurant que les élèves bénéficient des meilleures conditions d'apprentissage. Je m’efforce de promouvoir un climat scolaire bienveillant, inclusif et propice aux apprentissages, en mettant en place des pratiques collaboratives et innovantes. En tant que chef d'établissement, je veux aussi encourager la formation continue du personnel pour intégrer efficacement les outils numériques et les pratiques pédagogiques actuelles."], [322, "Comment intégreriez-vous l'intelligence artificielle dans votre établissement, en tenant compte des opportunités et des risques ?", "L’IA offre de nombreuses opportunités, notamment pour le suivi personnalisé des élèves, l’aide à l’évaluation, et le soutien aux élèves en difficulté. Cependant, son usage doit être encadré et réfléchi pour éviter des écueils éthiques, comme la protection des données personnelles. En tant que chef d’établissement, je favoriserais des expérimentations avec des outils d'IA validés par l’Éducation nationale et en conformité avec le RGPD. Mon rôle serait d’accompagner les enseignants dans leur appropriation de ces outils, tout en expliquant aux élèves et aux parents comment l’IA est utilisée pour améliorer l'apprentissage, en maintenant une approche éthique et transparente."], [323, "Comment géreriez-vous une situation de crise, par exemple un cas de harcèlement ou une altercation grave entre élèves ?", "Face à une crise, il est crucial de réagir rapidement et de manière posée. En cas de harcèlement, je mettrais en place une cellule de soutien impliquant le personnel éducatif, les parents et les services de santé scolaire. Je veillerais à protéger la victime et à prendre des mesures appropriées à l’encontre de l’agresseur, conformément aux procédures du ministère. En parallèle, je sensibiliserais l’ensemble de la communauté scolaire pour prévenir d’autres incidents. La transparence et la communication auprès des familles et des parties prenantes sont également essentielles pour restaurer la confiance dans l’établissement."], [324, "Comment encourageriez-vous l'innovation pédagogique dans votre établissement ?", "Pour encourager l’innovation, je proposerais des ateliers de partage de pratiques pour que les enseignants échangent sur leurs expériences, en mettant un accent particulier sur le numérique et l'usage de l’IA pédagogique. Je pourrais aussi introduire des formations sur les nouvelles approches pédagogiques, comme la classe inversée ou l’apprentissage collaboratif assisté par IA. En partenariat avec le rectorat et des experts, nous pourrions également mettre en place des projets pilotes permettant de tester ces innovations et d’évaluer leur impact sur les résultats des élèves."], [325, "Que feriez-vous pour favoriser l’inclusion des élèves en difficulté ou en situation de handicap ?", "Je mettrais en place un dispositif d’accompagnement personnalisé pour les élèves ayant des besoins spécifiques. Cela inclurait la formation des enseignants sur l’inclusion, l’aménagement des classes, et la sensibilisation des autres élèves. Je veillerais également à ce que les outils numériques et d’IA, comme les lecteurs d’écran ou les applications d’aide à la lecture, soient accessibles à tous et utilisés pour soutenir l’apprentissage de ces élèves. Collaborer avec les familles et les partenaires externes (psychologues, orthophonistes, etc.) serait également un élément clé pour garantir une prise en charge adaptée."], [326, "Comment gèreriez-vous le développement professionnel des enseignants de votre établissement ?", "Le développement professionnel des enseignants est essentiel pour maintenir un enseignement de qualité. En tant que chef d’établissement, j’organiserais régulièrement des sessions de formation continue, axées notamment sur les innovations pédagogiques et l’usage du numérique. Je favoriserais également le mentorat, où des enseignants expérimentés accompagnent leurs collègues plus jeunes ou moins expérimentés. Je m’assurerais aussi d’impliquer les enseignants dans la prise de décision concernant les orientations pédagogiques de l’établissement pour encourager leur engagement."], [327, "Quelles actions concrètes mettriez-vous en place pour améliorer le climat scolaire ?", "Améliorer le climat scolaire implique plusieurs actions : renforcer le dialogue entre élèves, enseignants et personnel, et organiser des activités de cohésion pour développer l’esprit d’équipe. Par exemple, des ateliers de médiation peuvent être proposés aux élèves pour apprendre à gérer les conflits de manière constructive. J’encouragerais également les enseignants à adopter des pratiques inclusives et à faire preuve de bienveillance, notamment en mettant en avant les réussites des élèves. Enfin, en tant que chef d’établissement, je veillerais à être disponible et à l’écoute des préoccupations de chacun pour créer un environnement serein et motivant."], [328, "Comment utiliseriez-vous les données dans le pilotage de l’établissement ?", "Les données constituent un outil précieux pour le pilotage de l’établissement. Par exemple, l’analyse des résultats scolaires et des taux d’absentéisme permet d’identifier les élèves en difficulté et d'adapter les actions de remédiation. J’utiliserais des tableaux de bord pour suivre des indicateurs clés de performance, en veillant à respecter la confidentialité et le RGPD. Ces données aideraient également à ajuster les méthodes pédagogiques et à prendre des décisions stratégiques pour l’amélioration continue de l’établissement"], [329, "Pourquoi le climat scolaire est-il important dans un établissement ?", "Le climat scolaire est essentiel car il a une influence directe sur le bien-être des élèves et des personnels, ainsi que sur les performances académiques. Un bon climat réduit les tensions, les actes de violence et favorise un environnement propice aux apprentissages. Les élèves se sentent plus en sécurité et ont plus de chances de réussir. Pour les personnels, un bon climat contribue aussi à leur engagement et à leur motivation. En tant que chef d’établissement, je m’efforcerais d’instaurer un climat positif en développant des actions de prévention, de médiation, et de renforcement du sentiment d’appartenance à l’établissement."], [330, "Comment évalueriez-vous le climat scolaire dans votre établissement ?", "J’utiliserais plusieurs outils pour évaluer le climat scolaire, en commençant par l’indice de climat scolaire qui se base sur des indicateurs comme la sécurité, les relations entre élèves et adultes, et l’ambiance générale. Je pourrais aussi mettre en place des enquêtes de satisfaction auprès des élèves, des parents et du personnel, qui permettent de recueillir un ressenti global. Les incidents signalés dans le cadre du dispositif Sivis seraient également analysés pour identifier des tendances et des zones d’amélioration. Enfin, des réunions régulières avec le personnel éducatif et des échanges avec les élèves me permettraient de recueillir des retours directs."], [331, "Quelles actions concrètes mettriez-vous en place pour améliorer le climat scolaire ?", "Pour améliorer le climat scolaire, je mettrais en place une approche en trois volets : prévention, gestion et implication. En prévention, je pourrais organiser des ateliers sur la médiation et la gestion des conflits pour les élèves et les enseignants. Pour la gestion des incidents, je renforcerais les procédures de signalement et de suivi afin que chaque cas soit pris en compte et résolu rapidement. Enfin, pour l’implication, je favoriserais des activités collectives (projets, événements) pour renforcer le sentiment d’appartenance à l’établissement. Il est aussi important de promouvoir une communication transparente avec les familles, ce qui contribue à apaiser les tensions et à renforcer la confiance."], [332, "Quels sont les principaux facteurs qui influencent le climat scolaire, et comment les géreriez-vous ?", "Les principaux facteurs incluent le contexte socio-économique des élèves, le niveau de violence, la qualité des relations entre élèves et adultes, et les performances académiques. Par exemple, dans un établissement où le contexte socio-économique est difficile, je veillerais à renforcer le soutien aux élèves et à améliorer les relations avec les familles. Pour la violence, des actions de prévention et des partenariats avec des associations de médiation et des psychologues scolaires sont cruciaux. En ce qui concerne les relations au sein de l’établissement, je m’efforcerais de maintenir un dialogue ouvert avec les élèves et le personnel, en organisant des réunions de concertation et en facilitant des espaces d’expression."]]</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent);
let st={};try{st=JSON.parse(localStorage.getItem('perdir_st')||'{}')}catch(e){}
let flt='all',order=D.map((_,i)=>i),pos=0,shown=false,rev=false,term='';
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('perdir_st',JSON.stringify(st))}catch(e){}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*([^*\s][^*]*?)\*/g,'$1<i>$2</i>')}
function md(t){let h='',ul=false;for(const raw of t.split('\n')){const l=raw.trim();if(!l){continue}
const m=l.match(/^[-*]\s+(.*)/);if(m){if(!ul){h+='<ul>';ul=true}h+='<li>'+inl(m[1])+'</li>'}else{if(ul){h+='</ul>';ul=false}h+='<p>'+inl(l)+'</p>'}}
return h+(ul?'</ul>':'')}
function list(){const t=term.trim().toLowerCase();return order.filter(i=>{const n=D[i][0],s=st[n];
if(flt==='new'&&s)return false;if(flt==='ko'&&s!=='ko')return false;if(flt==='ok'&&s!=='ok')return false;
if(t){if(/^\d+$/.test(t))return String(n)===t;return (D[i][1]+' '+D[i][2]).toLowerCase().includes(t)}return true})}
let cur=[];
function stats(){const ok=D.filter(c=>st[c[0]]==='ok').length,ko=D.filter(c=>st[c[0]]==='ko').length;
$('p1').style.width=ok/D.length*100+'%';$('p2').style.width=ko/D.length*100+'%';
$('s0').textContent=D.length+' questions';$('s1').textContent='✅ '+ok+' maîtrisées';$('s2').textContent='🔁 '+ko+' à revoir'}
function draw(){cur=list();stats();const c=$('card');
if(!cur.length){c.innerHTML='<div class="empty">Aucune carte dans ce filtre.</div>';return}
if(pos>=cur.length)pos=0;if(pos<0)pos=cur.length-1;
const [n,q,a]=D[cur[pos]],s=st[n],front=rev?shown:!shown;
const badge=s==='ok'?'✅':s==='ko'?'🔁':'';
c.innerHTML='<div class="tag"><span>Question '+n+' '+badge+'</span><span>'+(pos+1)+' / '+cur.length+'</span></div>'+
(front?'<div class="q">'+inl(q)+'</div><div class="hint">Touche pour voir la réponse</div>':'<div class="a"><p><b>'+inl(q)+'</b></p>'+md(a)+'</div><div class="hint">Touche pour retourner</div>');
}
function go(d){pos+=d;shown=false;draw();window.scrollTo(0,0)}
function mark(v){if(!cur.length)return;st[D[cur[pos]][0]]=v;save();if(flt==='all'||flt==='new'){go(1)}else{draw()}}
$('card').onclick=()=>{shown=!shown;draw()};
$('pv').onclick=()=>go(-1);$('nx').onclick=()=>go(1);$('bo').onclick=()=>mark('ok');$('bk').onclick=()=>mark('ko');
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));pos=0;shown=false;draw()});
$('sh').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;shown=false;draw()};
$('rv').onclick=()=>{rev=!rev;$('rv').classList.toggle('on',rev);shown=false;draw()};
$('se').oninput=e=>{term=e.target.value;pos=0;shown=false;draw()};
$('th').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
if(e.key===' '){e.preventDefault();shown=!shown;draw()}else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key==='1')mark('ko');else if(e.key==='2')mark('ok')});
draw();
</script></body></html>
